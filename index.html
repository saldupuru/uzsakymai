  // ---------- parsing ----------
  const MONTHS = {
    'sausio':1,'vasario':2,'kovo':3,'balandžio':4,'balandzio':4,'gegužės':5,'geguzes':5,
    'birželio':6,'birzelio':6,'liepos':7,'rugpjūčio':8,'rugpjucio':8,'rugsėjo':9,'rugsejo':9,
    'spalio':10,'lapkričio':11,'lapkricio':11,'gruodžio':12,'gruodzio':12
  };
  const COLOR_ROOTS = ['rožin','rozin','balt','mėlyn','melyn','žal','zal','gelton',
    'raudon','violetin','auksin','sidabrin','juod','rud','pastelin','oranžin','oranzin',
    'rusv','alyv','turkio','purpurin','bordo','krem','perlamutrin'];
  const FILLER_WORDS = /\b(sveiki|laba diena|labas|reikia|reikėtų|reiketu|norėčiau|noreciau|norėtume|noretume|užsisakyti|uzsisakyti|užsakyti|uzsakyti|prašau|prasau|ačiū|aciu|tortas|tortą|torta|torto|tortui|man|norim|reik|galėtumėt|galetumet|galit|galėtumėte|prašyčiau|prasyciau|šiaip|siaip|labai|noriu|prašyt|spalvos|spalva|spalvų|spalvu|skonio|skoniai|skonis|skonių|skoniu|d\.)\b/g;
  const STOP_WORDS = ['pati','pats','pačiam','pacia','pačiai','asmeniškai','asmeniskai','viena','vienas','namo'];

  function classifyToken(tok){
    if(!tok) return null;
    tok = tok.trim();
    if(tok.length < 3) return null;
    if(/^\d+([.,]\d+)?$/.test(tok)) return null;
    if(/€|eur\b/.test(tok)) return null;
    if(/autobus|siunt|pristat|atvež|atvez|atsiim|pasiim|vilniu/.test(tok)) return null;
    if(STOP_WORDS.includes(tok)) return null;
    for(const root of COLOR_ROOTS){ if(tok.includes(root)) return {type:'color', value:tok}; }
    if(/^didel/.test(tok)) return {type:'size', value:'didelis'};
    if(/^maž|^maz/.test(tok)) return {type:'size', value:'mazas'};
    return {type:'flavor', value:tok};
  }

  function parseMessage(text){
    const t = text.toLowerCase();
    const result = { neededDate:'', flavor:'', colors:'', fulfillment:'', address:'', price:'', customerPhone:'' };
    let workingText = t;

    let m = t.match(/\b(\d{1,2})[.\-\/](\d{1,2})(?:[.\-\/](\d{2,4}))?\b/);
    if(m){
      const day = parseInt(m[1],10), mon = parseInt(m[2],10);
      let year = m[3] ? parseInt(m[3],10) : new Date().getFullYear();
      if(year < 100) year += 2000;
      if(day>=1&&day<=31&&mon>=1&&mon<=12){
        result.neededDate = `${year}-${String(mon).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        workingText = workingText.replace(m[0], ' ');
      }
    }
    if(!result.neededDate){
      for(const [name,num] of Object.entries(MONTHS)){
        const re1 = new RegExp('(\\d{1,2})\\s*'+name+'[a-zė]*');
        const re2 = new RegExp(name+'[a-zė]*\\s*(\\d{1,2})');
        let mm = t.match(re1) || t.match(re2);
        if(mm){
          const day = parseInt(mm[1],10);
          let year = new Date().getFullYear();
          result.neededDate = `${year}-${String(num).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
          workingText = workingText.replace(mm[0], ' ');
          break;
        }
      }
    }

    if(/autobus|siunt/.test(t)) result.fulfillment = 'autobusas';
    else if(/pristat|atvež|atvez/.test(t)) result.fulfillment = 'pristatymas';
    else if(/atsiim|pasiim/.test(t)) result.fulfillment = 'atsiemimas';

    let pm = t.match(/(\d+(?:[.,]\d{1,2})?)\s?(€|eur)/);
    if(pm){ result.price = pm[1].replace(',','.'); workingText = workingText.replace(pm[0], ' '); }

    let phoneMatch = workingText.match(/(\+370[\s\-]?\d{3}[\s\-]?\d{5}|\b8\d{8}\b|\b0?6\d{7}\b)/);
    if(phoneMatch){
      result.customerPhone = phoneMatch[0].replace(/[\s\-]/g,'');
      workingText = workingText.replace(phoneMatch[0], ' ');
    }

    workingText = workingText.replace(FILLER_WORDS, ' ');
    const segments = workingText.split(/[,;\n]/);
    const flavors = [];
    const colors = [];
    segments.forEach(seg=>{
      seg.split(/\s+ir\s+|\s+bei\s+/).forEach(rawTok=>{
        const cls = classifyToken(rawTok);
        if(!cls) return;
        if(cls.type==='color' && !colors.includes(cls.value)) colors.push(cls.value);
        else if(cls.type==='flavor' && !flavors.includes(cls.value)) flavors.push(cls.value);
      });
    });
    result.flavor = flavors.join(', ');
    result.colors = colors.join(', ');
    return result;
  }

  // ---------- price calc ----------
  function extrasSumForSize(extrasState, size, jarQty){
    if(!extrasState || !extrasState.enabled || !extrasState.selectedIds || !extrasState.selectedIds.length) return 0;
    const priceKey = size==='large' ? 'priceLarge' : 'priceSmall';
    const perJar = extrasState.selectedIds.reduce((sum,id)=>{
      const ex = extrasList.find(e=>e.id===id);
      return sum + (ex ? (ex[priceKey]||0) : 0);
    }, 0);
    return perJar * (jarQty||0);
  }
  function extrasSumFor(o){
    return extrasSumForSize(o.jarLargeExtras, 'large', o.jarQtyLarge) + extrasSumForSize(o.jarSmallExtras, 'small', o.jarQtySmall);
  }
  function deliveryPriceFor(fulfillment){
    if(fulfillment==='pristatymas') return prices.delivery_vilnius||0;
    if(fulfillment==='autobusas') return prices.delivery_bus||0;
    return 0;
  }
  function fulfillmentLabel(fulfillment){
    if(fulfillment==='atsiemimas') return 'Atsiimsiu pats (Vilnius, Viršilų g. 11)';
    if(fulfillment==='pristatymas') return 'Pristatymas Vilniuje';
    if(fulfillment==='autobusas') return 'Siuntimas autobusu';
    return null;
  }
  function decorSumFor(o){
    let sum = 0;
    [].concat(o.largeCakes||[], o.smallCakes||[]).forEach(unit=>{
      if(unit.decorEnabled && unit.decorIds && unit.decorIds.length){
        unit.decorIds.forEach(id=>{
          const d = decorsList.find(x=>x.id===id);
          if(d) sum += (d.price||0);
        });
      }
    });
    return sum;
  }
  function computeOrderPrice(o){
    const lc = (o.largeCakes||[]).length;
    const sc = (o.smallCakes||[]).length;
    const jl = o.jarQtyLarge || 0;
    const js = o.jarQtySmall || 0;
    const jarCost = jl*(prices.large_jar||0) + js*(prices.small_jar||0);
    let total = lc*(prices.large_cake||0) + sc*(prices.small_cake||0) + jarCost;
    total += extrasSumFor(o);
    total += decorSumFor(o);
    total += deliveryPriceFor(o.fulfillment);
    if(o.isUrgent) total += (prices.urgent_fee||0);
    if(o.discountType==='percent' && o.discountValue){
      total = total*(1-o.discountValue/100);
    } else if(o.discountType==='gift' && o.discountValue){
      total = total - o.discountValue;
    }
    total = Math.max(0, total);
    return Math.round(total*100)/100;
  }
  // When an offer is applied, its fixed price only covers the quantities
  // the offer itself specifies. If the customer bumps a quantity higher
  // than what the offer includes, only the EXTRA units beyond the offer's
  // amount are charged at the normal catalog price - the offer price
  // covers the rest. Extras/decor/delivery/urgent fee are never part of
  // an offer, so they're always added on top in full.
  function computeOrderPriceWithOffer(o){
    const offer = offersList.find(of=>of.id===o.appliedOfferId);
    if(!offer) return computeOrderPrice(o);
    const lc = (o.largeCakes||[]).length;
    const sc = (o.smallCakes||[]).length;
    const jl = o.jarQtyLarge || 0;
    const js = o.jarQtySmall || 0;
    const extraLc = Math.max(0, lc - (offer.largeCakes||0));
    const extraSc = Math.max(0, sc - (offer.smallCakes||0));
    const extraJl = Math.max(0, jl - (offer.jarLarge||0));
    const extraJs = Math.max(0, js - (offer.jarSmall||0));
    let total = (offer.price||0)
      + extraLc*(prices.large_cake||0)
      + extraSc*(prices.small_cake||0)
      + extraJl*(prices.large_jar||0)
      + extraJs*(prices.small_jar||0);
    total += extrasSumFor(o);
    total += decorSumFor(o);
    total += deliveryPriceFor(o.fulfillment);
    if(o.isUrgent) total += (prices.urgent_fee||0);
    total = Math.max(0, total);
    return Math.round(total*100)/100;
  }
  function recomputePrice(){
    if(!modalOrder) return;
    if(modalOrder.appliedOfferId){
      const total = computeOrderPriceWithOffer(modalOrder);
      modalOrder.price = total ? String(total) : '';
      return;
    }
    if(modalOrder.priceManual) return;
    const total = computeOrderPrice(modalOrder);
    modalOrder.price = total ? String(total) : '';
  }

  // Lithuanian numeral agreement (skaičiaus derinimas su daiktavardžiu):
  //   baigiasi 1, bet ne 11  -> vienaskaita (1 tortas, 21 tortas)
  //   baigiasi 2-9, bet ne 11-19 -> daugiskaita (2-9 tortai, 22 tortai)
  //   kitaip (0, 10-20, ...) -> kilmininko daugiskaita (10 tortų, 11 tortų)
  function ltPluralCategory(n){
    const mod10 = n % 10, mod100 = n % 100;
    if(mod10===1 && mod100!==11) return 'one';
    if(mod10>=2 && mod10<=9 && !(mod100>=11 && mod100<=19)) return 'few';
    return 'other';
  }
  function ltCountPhrase(n, size, wordType){
    const adjForms = {
      large: {one:'didelis', few:'dideli', other:'didelių'},
      small: {one:'mažas', few:'maži', other:'mažų'},
    };
    const nounForms = {
      cake: {one:'tortas', few:'tortai', other:'tortų'},
      jar: {one:'indelis', few:'indeliai', other:'indelių'},
    };
    const cat = ltPluralCategory(n);
    return `${n} ${adjForms[size][cat]} ${nounForms[wordType][cat]}`;
  }
  function offerCompositionText(o){
    const parts = [];
    if(o.largeCakes) parts.push(ltCountPhrase(o.largeCakes, 'large', 'cake'));
    if(o.smallCakes) parts.push(ltCountPhrase(o.smallCakes, 'small', 'cake'));
    if(o.jarLarge) parts.push(ltCountPhrase(o.jarLarge, 'large', 'jar'));
    if(o.jarSmall) parts.push(ltCountPhrase(o.jarSmall, 'small', 'jar'));
    return parts.join(', ') || '-';
  }

  // Fills the order draft's product quantities from an offer (empty
  // flavor/color slots - the customer still has to pick those), and locks
  // the price to the offer's fixed price.
  function applyOfferToOrder(o){
    if(!modalOrder) return;
    modalOrder.largeCakes = Array.from({length:o.largeCakes||0}, ()=>({combos:[], draftFlavor:'', draftColor:'', decorEnabled:false, decorIds:[]}));
    modalOrder.smallCakes = Array.from({length:o.smallCakes||0}, ()=>({combos:[], draftFlavor:'', draftColor:'', decorEnabled:false, decorIds:[]}));
    modalOrder.jarQtyLarge = o.jarLarge||0;
    modalOrder.jarQtySmall = o.jarSmall||0;
    modalOrder.jarLargeCombos = [];
    modalOrder.jarSmallCombos = [];
    customerProductToggles.large_cake = !!o.largeCakes;
    customerProductToggles.small_cake = !!o.smallCakes;
    customerProductToggles.large_jar = !!o.jarLarge;
    customerProductToggles.small_jar = !!o.jarSmall;
    modalOrder.price = String(o.price||0);
    modalOrder.priceManual = true;
    modalOrder.appliedOfferId = o.id;
  }

  function clearAppliedOffer(){
    if(!modalOrder) return;
    modalOrder.largeCakes = [];
    modalOrder.smallCakes = [];
    modalOrder.jarQtyLarge = 0;
    modalOrder.jarQtySmall = 0;
    modalOrder.jarLargeCombos = [];
    modalOrder.jarSmallCombos = [];
    customerProductToggles = {large_cake:false, small_cake:false, large_jar:false, small_jar:false};
    modalOrder.priceManual = false;
    modalOrder.appliedOfferId = null;
    recomputePrice();
  }

  // ---------- color helper ----------
  function colorNameToHex(name){
    const n = (name||'').toLowerCase();
    const map = [
      [/rožin|rozin/, '#F2A6C6'], [/raudon/, '#C0392B'], [/balt/, '#FFFFFF'],
      [/mėlyn|melyn/, '#3B6FC4'], [/žal|zal/, '#5B8C3A'], [/gelton/, '#EFC94C'],
      [/violetin/, '#8E5FBF'], [/auksin/, '#C9932E'], [/sidabrin/, '#B9BEC4'],
      [/juod/, '#2B2320'], [/rud/, '#7A5230'], [/pastelin/, '#F4E3E8'],
      [/oranžin|oranzin/, '#E8823A'], [/rusv/, '#8A6E4B'], [/alyv/, '#7C8F5A'],
      [/turkio/, '#3FB6A8'], [/purpurin/, '#9B2D6E'], [/bordo/, '#6E1F32'],
      [/krem/, '#F6E9D3'], [/perlamutrin/, '#EDEDF2'],
    ];
    for(const [re,hex] of map){ if(re.test(n)) return hex; }
    let hash=0; for(let i=0;i<n.length;i++) hash = n.charCodeAt(i) + ((hash<<5)-hash);
    return `hsl(${Math.abs(hash)%360},55%,65%)`;
  }

  function fmtISO(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
  function dateFromISO(iso){ const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); }
  function addDaysISO(iso, days){ const d = dateFromISO(iso); d.setDate(d.getDate()+days); return fmtISO(d); }
  function vacationRangeFor(iso){
    if(!iso) return null;
    return vacations.find(v => iso >= v.start && iso <= v.end) || null;
  }
  function suggestedDatesFor(range){
    return { before: addDaysISO(range.start, -1), after: addDaysISO(range.end, 1) };
  }
  function capitalizeFirst(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

  function offerRemainingText(expiresAt){
    if(!expiresAt) return null;
    const diff = new Date(expiresAt).getTime() - Date.now();
    if(diff <= 0) return null;
    const totalMin = Math.floor(diff/60000);
    const days = Math.floor(totalMin/1440);
    const hours = Math.floor((totalMin%1440)/60);
    const mins = totalMin%60;
    if(days>0) return `Liko ${days} d. ${hours} val.`;
    if(hours>0) return `Liko ${hours} val. ${mins} min.`;
    return `Liko ${mins} min.`;
  }

  // Whether an offer should currently be offered to customers on the order
  // form: admin marked it visible, it hasn't been used up (if one-time), and
  // it hasn't expired (if a deadline was set).
  function offerIsEligible(o){
    if(o.visible===false) return false;
    if(o.usageType==='once' && o.used) return false;
    if(o.expiresAt && !offerRemainingText(o.expiresAt)) return false;
    return true;
  }

  // Matches an incoming email against a lowercased search query, checking
  // not just its own subject/from/body but also the text of any reply that
  // was sent for it (stored separately in outgoingEmails) - so searching
  // for something you wrote back finds the original email too.
  // HTML-escapes text, then wraps every case-insensitive occurrence of the
  // current search query in a <mark> highlight - used when showing an
  // opened email's subject/body so the matching word jumps out visually.
  function highlightMatch(text, query){
    const escaped = escapeHtml(text||'');
    const q = (query||'').trim();
    if(!q) return escaped;
    const escapedQuery = escapeHtml(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    if(!escapedQuery) return escaped;
    try{
      const re = new RegExp(escapedQuery, 'gi');
      return escaped.replace(re, m=>`<mark style="background:#FFE08A;color:inherit;padding:0 2px;border-radius:3px;">${m}</mark>`);
    }catch(e){
      return escaped;
    }
  }

  function incomingEmailMatchesQuery(e, q){
    if((e.subject||'').toLowerCase().includes(q) ||
       (e.from||'').toLowerCase().includes(q) ||
       (e.body||'').toLowerCase().includes(q)) return true;
    const reply = outgoingEmails.find(o=>o.relatedEmailId===e.id && o.relatedType==='inboxEmail');
    if(reply && (
      (reply.body||'').toLowerCase().includes(q) ||
      (reply.subject||'').toLowerCase().includes(q)
    )) return true;
    return false;
  }

  function inboxSearchDropdownItems(){
    const q = (inboxSearchQuery||'').trim().toLowerCase();
    if(!q) return [];
    const matchIncoming = incomingEmails.filter(e=>incomingEmailMatchesQuery(e, q));
    const matchComposed = outgoingEmails.filter(o=>o.relatedType==='compose').filter(o=>
      (o.toName||'').toLowerCase().includes(q) || (o.to||'').toLowerCase().includes(q) ||
      (o.subject||'').toLowerCase().includes(q) || (o.body||'').toLowerCase().includes(q)
    );
    return [
      ...matchIncoming.map(e=>({type:'incoming', id:e.id, title: e.subject||'(be temos)', sub: e.from||''})),
      ...matchComposed.map(o=>({type:'compose', id:o.id, title: o.subject||'(be temos)', sub: o.toName||o.to||''})),
    ].slice(0,8);
  }

  function inboxSearchDropdownInnerHtml(){
    const items = inboxSearchDropdownItems();

      <div style="font-weight:600;font-size:13px;">${it.type==='compose'?'✎':'📩'} ${escapeHtml(it.title)}</div>
      <div style="color:var(--choc-soft);font-size:12px;">${escapeHtml(it.sub)}</div>

  }

  // Wires click handlers onto whatever [data-search-jump] items currently
  // exist inside the dropdown container - used both after a full render()
  // and after the lightweight direct-DOM update (see updateInboxSearchDropdown).
  function wireSearchJumpHandlers(container){
    (container || document).querySelectorAll('[data-search-jump]').forEach(el=>{
      el.onclick = ()=>{
        const [jumpType, jumpId] = el.dataset.searchJump.split(':');
        if(jumpType==='incoming'){ openIncomingEmailId = jumpId; inboxViewMode = 'received'; }
        else { openComposedId = jumpId; inboxViewMode = 'sent'; }
        inboxSearchDropdownOpen = false;
        render();

    });
  }

  // Updates ONLY the floating dropdown's contents directly via the DOM,
  // without going through the app's normal full render() - a full
  // teardown/rebuild on every keystroke made this specific floating,
  // bordered element visibly flicker (unmount+remount) even though its
  // open/closed *state* never actually changed. The list below the search
  // box still updates through the normal (debounced) render() path.
  function updateInboxSearchDropdown(){
    const dd = document.getElementById('inboxSearchDropdown');
    if(!dd) return;
    const q = (inboxSearchQuery||'').trim();
    const inner = (q && inboxSearchDropdownOpen) ? inboxSearchDropdownInnerHtml() : '';
    dd.innerHTML = inner;
    dd.style.display = inner ? 'block' : 'none';
    wireSearchJumpHandlers(dd);
  }

  const ORDINALS = ['Pirmas','Antras','Trečias','Ketvirtas','Penktas','Šeštas','Septintas','Aštuntas','Devintas','Dešimtas'];

  function plainTextOrderSummary(data){
    const SEPARATOR = '－'.repeat(28);
    const blocks = [];

    if(data.isUrgent){
      blocks.push('⚡ Skubus užsakymas');
    }
    if(data.largeCakes && data.largeCakes.length){
      const lines = [`Dideli tortai (${data.largeCakes.length} vnt.):`];
      data.largeCakes.forEach((unit,i)=>{
        const combos = (unit.combos||[]).filter(c=>c.flavor||c.color);
        const txt = combos.length ? combos.map(c=>`${c.color||'?'} - ${c.flavor||'?'}`).join(' | ') : 'nepasirinkta';
        lines.push(`  #${i+1}: Skonių ir spalvų deriniai: ${txt}`);
        const decorLabel = decorLabelFor(unit);
        if(decorLabel) lines.push(`    ${decorLabel}`);
      });
      blocks.push(lines.join('\n'));
    }
    if(data.smallCakes && data.smallCakes.length){
      const lines = [`Maži tortai (${data.smallCakes.length} vnt.):`];
      data.smallCakes.forEach((unit,i)=>{
        const combos = (unit.combos||[]).filter(c=>c.flavor||c.color);
        const txt = combos.length ? combos.map(c=>`${c.color||'?'} - ${c.flavor||'?'}`).join(' | ') : 'nepasirinkta';
        lines.push(`  #${i+1}: Skonių ir spalvų deriniai: ${txt}`);
        const decorLabel2 = decorLabelFor(unit);
        if(decorLabel2) lines.push(`    ${decorLabel2}`);
      });
      blocks.push(lines.join('\n'));
    }
    if(data.jarQtyLarge){
      const combos = (data.jarLargeCombos||[]).filter(c=>c.flavor||c.color);
      const lines = [`Dideli indeliai (${data.jarQtyLarge} vnt.): Skonių ir spalvų deriniai: ` + (combos.length ? combos.map(c=>`${c.color||'?'} - ${c.flavor||'?'}`).join(', ') : 'skoniai nenurodyti')];
      const extrasLine = formatExtrasLineFor(data.jarLargeExtras, 'Didelių');
      if(extrasLine) lines.push(`  ${extrasLine}`);
      blocks.push(lines.join('\n'));
    }
    if(data.jarQtySmall){
      const combos = (data.jarSmallCombos||[]).filter(c=>c.flavor||c.color);
      const lines = [`Maži indeliai (${data.jarQtySmall} vnt.): Skonių ir spalvų deriniai: ` + (combos.length ? combos.map(c=>`${c.color||'?'} - ${c.flavor||'?'}`).join(', ') : 'skoniai nenurodyti')];
      const extrasLine2 = formatExtrasLineFor(data.jarSmallExtras, 'Mažų');
      if(extrasLine2) lines.push(`  ${extrasLine2}`);
      blocks.push(lines.join('\n'));
    }
    return blocks.length ? blocks.join(`\n${SEPARATOR}\n`) : '-';
  }

  // NOTE: the "gautas užsakymas" admin-notification email used to be sent
  // here via EmailJS. It's now handled entirely by the Orange Pi script,
  // which detects new orders itself (see notifyEmailSent field on the order
  // doc) and sends the notification over SMTP - this keeps the ability to
  // queue arbitrary outgoing emails restricted to the authenticated admin
  // session only (an anonymous customer's browser was never a safe place to
  // trust with "send an email" requests).
  // Push notification via ntfy.sh - a free, no-signup push service. Sending
  // is a single plain HTTP POST to https://ntfy.sh/<topic>; the phone just
  // needs the free "ntfy" app subscribed to that same topic name.
  async function sendOrderNotificationNtfy(data){
    if(!orderSettings.notifyNtfyEnabled) return;
    const topic = (orderSettings.ntfyTopic || '').trim();
    if(!topic) return;
    const priceStr = data.price || autoPriceFallback(data) || '-';
    const bodyLines = [
      `Klientas: ${data.customerName || '-'} (${data.customerPhone || '-'})`,
      `Reikia iki: ${data.neededDate ? formatDate(data.neededDate) : 'nenurodyta'}`,
      `Būdas: ${fulfillmentLabel(data.fulfillment) || 'nenurodyta'}`,
      `Kaina: ${priceStr}`,
      '',
      plainTextOrderSummary(data),
    ];
    if(data.notes) bodyLines.push('', `Pastabos: ${data.notes}`);
    const body = bodyLines.join('\n');
    try{
      // Sent as JSON, not via HTTP headers: ntfy's header-based publish API
      // requires header values to be plain ASCII/Latin-1, so Lithuanian
      // diacritics (ž, š, ų, ė...) in the title silently broke fetch()
      // before the request ever left the browser. JSON body has no such
      // restriction.
      await fetch('https://ntfy.sh/', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          topic,
          title: `Naujas užsakymas Nr. ${formatOrderNumber(data.orderNumber)}`,
          message: body,
          priority: 4,
          tags: ['cake'],
        }),
      });
    }catch(e){
      console.error('Nepavyko išsiųsti ntfy pranešimo', e);
    }
  }

  // "Name <email@x.lt>" or plain "email@x.lt" -> {name, email}. Used for
  // replying to real incoming emails, whose "From" header comes in either
  // shape depending on the sender's mail client.
  function parseEmailFrom(fromStr){
    const str = (fromStr||'').trim();
    const m = str.match(/^(.*)<([^>]+)>$/);
    if(m){
      return {name: m[1].trim().replace(/^"|"$/g,''), email: m[2].trim()};
    }
    return {name: str, email: str};
  }

  function readFileCompressed(file){
    return new Promise((resolve, reject)=>{
      if(file.type.startsWith('image/')){
        const reader = new FileReader();
        reader.onload = (e)=>{
          const img = new Image();
          img.onload = ()=>{
            const maxDim = 1000;
            let w = img.width, h = img.height;
            if(w > maxDim || h > maxDim){
              const scale = maxDim / Math.max(w,h);
              w = Math.round(w*scale); h = Math.round(h*scale);
            }
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.72));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      } else {
        const reader = new FileReader();
        reader.onload = (e)=> resolve(e.target.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      }
    });
  }

  // Data URL <-> raw bytes helpers, used for feeding files into pdf-lib
  // (which works with byte arrays, not data URLs directly).
  function dataUrlToBytes(dataUrl){
    const base64 = dataUrl.split(',')[1];
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }
  function bytesToDataUrl(bytes, mime){
    let binary = '';
    const chunkSize = 0x8000;
    for(let i=0;i<bytes.length;i+=chunkSize){
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i+chunkSize));
    }
    return `data:${mime};base64,${btoa(binary)}`;
  }

  // Merges any mix of photographed/picked pages - images AND real PDF files
  // (receipt photo + an existing invoice PDF, several images, several PDFs,
  // any combination) - into a single PDF, in the order they were added. Used
  // by the "Pridėti išlaidą" file-picker and camera flows so multiple
  // attachments become one file instead of the last one overwriting the rest.
  async function buildMergedExpensePdf(attachments){
    const { PDFDocument } = PDFLib;
    const mergedPdf = await PDFDocument.create();
    const pageSize = [595.28, 841.89]; // A4 in points, for image pages
    for(const att of attachments){
      if(att.type==='pdf'){
        const existingPdf = await PDFDocument.load(dataUrlToBytes(att.dataUrl));
        const copiedPages = await mergedPdf.copyPages(existingPdf, existingPdf.getPageIndices());
        copiedPages.forEach(p=>mergedPdf.addPage(p));
      } else {
        const imgBytes = dataUrlToBytes(att.dataUrl);
        const img = att.dataUrl.startsWith('data:image/png')
          ? await mergedPdf.embedPng(imgBytes)
          : await mergedPdf.embedJpg(imgBytes);
        const page = mergedPdf.addPage(pageSize);
        const margin = 28;
        const maxW = pageSize[0]-margin*2, maxH = pageSize[1]-margin*2;
        const scale = Math.min(maxW/img.width, maxH/img.height);
        const w = img.width*scale, h = img.height*scale;
        page.drawImage(img, {x:(pageSize[0]-w)/2, y:(pageSize[1]-h)/2, width:w, height:h});
      }
    }
    const mergedBytes = await mergedPdf.save();
    return bytesToDataUrl(mergedBytes, 'application/pdf');
  }

  function decorLabelFor(unit){

  function formatUnitsBlock(arr, singular, plural, noun){
    if(!arr || !arr.length) return '';
    const n = arr.length;
    const headerText = n===1 ? `${singular} - 1 vnt.` : `${plural} - ${n} vnt.`;
    let html = `<div class="ticket-meta"><b>${escapeHtml(headerText)}</b></div>`;
    if(n===1){
      const combos = (arr[0].combos||[]).filter(c=>c.flavor||c.color);
      const txt = combos.length
        ? combos.map(c=>`${escapeHtml(c.color||'?')} - ${escapeHtml(c.flavor||'?')}`).join(' | ')
        : 'nepasirinkta';
      html += `<div class="ticket-meta ticket-unit-line">Skonių ir spalvų deriniai: ${txt}</div>`;
      const decorLabel = decorLabelFor(arr[0]);
      if(decorLabel) html += `<div class="ticket-meta ticket-unit-line">${escapeHtml(decorLabel)}</div>`;
    } else {
      arr.forEach((unit,i)=>{
        const combos = (unit.combos||[]).filter(c=>c.flavor||c.color);
        const txt = combos.length
          ? combos.map(c=>`${escapeHtml(c.color||'?')} - ${escapeHtml(c.flavor||'?')}`).join(' | ')
          : 'nepasirinkta';
        html += `<div class="ticket-meta ticket-ordinal">${ORDINALS[i]||('#'+(i+1))} ${noun}</div>`;
        html += `<div class="ticket-meta ticket-unit-line">Skonių ir spalvų deriniai: ${txt}</div>`;
        const decorLabel = decorLabelFor(unit);
        if(decorLabel) html += `<div class="ticket-meta ticket-unit-line">${escapeHtml(decorLabel)}</div>`;
      });
    }
    return html;
  }

  // Formats an admin-entered min/max price pair as "10.00 € - 50.00 €" for
  // the product cards and detail pages. Either bound alone still renders
  // something sensible ("nuo"/"iki"); both empty renders nothing.
  function formatPriceRangeText(min, max){
    const nMin = parseFloat(min), nMax = parseFloat(max);
    const hasMin = !isNaN(nMin) && String(min).trim() !== '';
    const hasMax = !isNaN(nMax) && String(max).trim() !== '';
    if(hasMin && hasMax) return `${nMin.toFixed(2)} € - ${nMax.toFixed(2)} €`;
    if(hasMin) return `nuo ${nMin.toFixed(2)} €`;
    if(hasMax) return `iki ${nMax.toFixed(2)} €`;
    return '';
  }

  // The individual /produktai/cukraus-vatos-tortai or /produktai/cukraus-vatos-indeliai
  // page: a big selectable photo on the left (with thumbnails below), and a
  // description + price range + order button on the right - reached either
  // by a real page load (external link, Google) or a client-side link from
  // the landing page's "Mūsų produktai" cards.
  function productPageHtml(){
    const type = productRouteType || 'cakes';
    const isJars = type === 'jars';
    const data = (isJars ? productPages.jars : productPages.cakes) || {photos:[], description:''};
    const photos = data.photos || [];
    const idx = photos.length ? Math.min(Math.max(productPhotoIndex, 0), photos.length - 1) : 0;
    const mainPhoto = photos.length ? photos[idx] : '/logo.png';
    const title = isJars ? 'Cukraus vatos indeliai' : 'Cukraus vatos tortai';
    const priceRange = isJars
      ? formatPriceRangeText(Math.min(prices.small_jar||0, prices.large_jar||0), Math.max(prices.small_jar||0, prices.large_jar||0))
      : formatPriceRangeText(Math.min(prices.small_cake||0, prices.large_cake||0), Math.max(prices.small_cake||0, prices.large_cake||0));
    const descText = (data.description || '').trim();
    return `<div class="landing">
      <div class="wrap product-page-wrap">
        <button type="button" class="customer-back-link" id="productBackToLandingBtn">← Grįžti į pagrindinį puslapį</button>
        <div class="product-page">
          <div class="product-page-gallery">
            <div class="product-page-main-photo"><img src="${escapeAttr(mainPhoto)}" alt="${escapeAttr(title)} - Saldu Puru"></div>
            ${photos.length > 1 ? `<div class="product-page-thumbs">
              ${photos.map((src,i)=>`<button type="button" class="product-page-thumb${i===idx?' active':''}" data-product-thumb="${i}"><img src="${escapeAttr(src)}" loading="lazy" alt="Miniatiūra ${i+1}"></button>`).join('')}
            </div>` : ''}
          </div>
          <div class="product-page-info">
            <h1 class="product-page-title">${escapeHtml(title)}</h1>
            ${priceRange ? `<p class="product-page-price">${escapeHtml(priceRange)}</p>` : ''}
            ${descText ? `<div class="product-page-desc">${escapeHtml(descText)}</div>` : ''}
            <button type="button" class="landing-btn landing-order-trigger product-page-order-btn">Užsakyti</button>
          </div>
        </div>
      </div>
    </div>`;
  }

  function attachEvents(prevId, prevCaret, prevCaretEnd){
    if(screenMode === 'landing'){
      startLandingAutoRotate();
      setupLandingReveal();
      applyHeroBannerTextColor();
      fitHeroTitleToOneLine();
      if(!landingResizeListenerBound){
        landingResizeListenerBound = true;
        let resizeTimer = null;
        window.addEventListener('resize', ()=>{
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(fitHeroTitleToOneLine, 120);
        });
      }
    }
    else stopLandingAutoRotate();
    document.querySelectorAll('.landing-order-trigger').forEach(btn=>{
      btn.onclick = ()=>{
        modalOrder = emptyOrderTemplate(nextOrderNumber());
        screenMode = 'customer';
        initFacebookPixel(orderSettings.fbPixelId);
        history.pushState(null, '', '#uzsakymas');
        render();
        window.scrollTo(0, 0);
      };
    });
    const landingScrollTopBtn = document.getElementById('landingScrollTopBtn');
    if(landingScrollTopBtn) landingScrollTopBtn.onclick = ()=>{
      window.scrollTo({top:0, behavior:'smooth'});
    };
    // Bound once (not on every render) — just toggles a CSS class directly via
    // the DOM rather than calling render(), so scrolling never interrupts
    // typing or causes the page to flicker/rebuild.
    if(screenMode==='landing' && !landingScrollListenerBound){
      landingScrollListenerBound = true;
      window.addEventListener('scroll', ()=>{
        const btn = document.getElementById('landingScrollTopBtn');
        if(!btn) return;
        if(window.scrollY > 420) btn.classList.add('visible');
        else btn.classList.remove('visible');
      });
    }
    const customerBackToLandingBtn = document.getElementById('customerBackToLandingBtn');
    if(customerBackToLandingBtn) customerBackToLandingBtn.onclick = ()=>{
      screenMode = 'landing';
      history.pushState(null, '', window.location.pathname);
      render();
      window.scrollTo(0, 0);
    };
    const landingGalleryPrev = document.getElementById('landingGalleryPrev');
    if(landingGalleryPrev) landingGalleryPrev.onclick = ()=>{
      landingGalleryIndex -= 1;
      render();
    };
    const landingGalleryNext = document.getElementById('landingGalleryNext');
    if(landingGalleryNext) landingGalleryNext.onclick = ()=>{
      landingGalleryIndex += 1;
      render();
    };
    document.querySelectorAll('[data-gallery-lightbox-open]').forEach(img=>{
      img.onclick = ()=>{
        landingLightboxIndex = +img.dataset.galleryLightboxOpen;
        render();
      };
    });
    document.querySelectorAll('[data-faq-toggle]').forEach(el=>{
      el.onclick = ()=>{
        const i = +el.dataset.faqToggle;
        landingFaqOpenIndex = (landingFaqOpenIndex===i) ? null : i;
        render();
      };
    });
    document.querySelectorAll('[data-product-thumb]').forEach(btn=>{
      btn.onclick = ()=>{
        productPhotoIndex = +btn.dataset.productThumb;
        render();
      };
    });
    const productBackToLandingBtn = document.getElementById('productBackToLandingBtn');
    if(productBackToLandingBtn) productBackToLandingBtn.onclick = ()=>{
      // Client-side transition, not a real navigation - the /produktai/...
      // pages are separate real files (needed so Google can index/crawl
      // them directly), but they run the exact same JS as the root page,
      // so switching screenMode + updating the URL via pushState is enough
      // to show the landing page instantly, without a full reload.
      productRouteType = null;
      screenMode = 'landing';

    // VMVT food-safety production register: creates one log row per
    // product type in the order (large/small cake, large/small jar) the
    // moment an order becomes "paruošta atsiėmimui" (production date), and
    // stamps the serving date on those same rows once it becomes
    // "užbaigta" (completed/picked up). If an order somehow jumps straight
    // to "completed" without ever passing through "ready", it's logged
    // retroactively with both dates set to today rather than being missed.
    async function syncFoodProductionLogForOrder(order, prevStatus){
      const becamePagaminta = order.status==='pagaminta' && prevStatus!=='pagaminta';
      const becameIvykdyta = order.status==='ivykdyta' && prevStatus!=='ivykdyta';
      if(!becamePagaminta && !becameIvykdyta) return;
      const todayISO = fmtISO(new Date());
      const productDefs = [
        {key:'largeCake', name:'Didelis tortas', qty:(order.largeCakes||[]).length, weight:orderSettings.weightLargeCake},
        {key:'smallCake', name:'Mažas tortas', qty:(order.smallCakes||[]).length, weight:orderSettings.weightSmallCake},
        {key:'largeJar', name:'Didelis indelis', qty:order.jarQtyLarge||0, weight:orderSettings.weightLargeJar},
        {key:'smallJar', name:'Mažas indelis', qty:order.jarQtySmall||0, weight:orderSettings.weightSmallJar},
      ];
      if(becamePagaminta){
        for(const p of productDefs){
          if(p.qty<=0) continue;
          if(foodProductionLog.find(l=>l.orderId===order.id && l.productKey===p.key)) continue;
          const entry = {
            id: uid(), orderId: order.id, orderNumber: order.orderNumber,
            productKey: p.key, productName: p.name,
            weightGrams: Math.round((p.weight||0) * p.qty),
            productionDate: todayISO, servedDate: '',
            createdAt: new Date().toISOString(),
          };
          foodProductionLog.push(entry);
          try{ await createFoodProductionLogDoc(entry); }catch(e){ console.error('Nepavyko išsaugoti maisto gamybos įrašo', e); }
        }
      }
      if(becameIvykdyta){
        const existingEntries = foodProductionLog.filter(l=>l.orderId===order.id);
        if(existingEntries.length){
          for(const entry of existingEntries){
            entry.servedDate = todayISO;
            try{ await updateFoodProductionLogDoc(entry); }catch(e){ console.error('Nepavyko atnaujinti maisto gamybos įrašo', e); }
          }
        } else {
          for(const p of productDefs){
            if(p.qty<=0) continue;
            const entry = {
              id: uid(), orderId: order.id, orderNumber: order.orderNumber,
              productKey: p.key, productName: p.name,
              weightGrams: Math.round((p.weight||0) * p.qty),
              productionDate: todayISO, servedDate: todayISO,
              createdAt: new Date().toISOString(),
            };
            foodProductionLog.push(entry);
            try{ await createFoodProductionLogDoc(entry); }catch(e){ console.error('Nepavyko išsaugoti maisto gamybos įrašo', e); }
          }
        }
      }
    }

    async function saveQuickStatusChanges(){
      const o = orders.find(x=>x.id===quickStatusOrderId);
      if(!o || !quickStatusPending) { quickStatusOrderId = null; render(); return; }
      const wasPaid = !!o.paid;
      const prevStatus = o.status;
      o.status = quickStatusPending.status;
      o.paid = quickStatusPending.paid;
      if(quickStatusPending.isUrgent !== o.isUrgent){
        o.isUrgent = quickStatusPending.isUrgent;
        if(!o.priceManual) o.price = String(computeOrderPrice(o));
      }
      try{
        await updateOrderDoc(o);
        // auto-create a journal entry (invoice) the moment an order becomes marked as paid,
        // if it doesn't already have one on record (ensureInvoiceForOrder is a no-op
        // if the confirmation email already created one when the order was confirmed).
        if(o.paid && !wasPaid){
          await ensureInvoiceForOrder(o);
        }
        if(o.status==='aktyvus' && prevStatus!=='aktyvus'){
          try{ await sendOrderConfirmationEmail(o); }catch(err){ console.error('Nepavyko išsiųsti patvirtinimo laiško', err); }
        }
        await syncFoodProductionLogForOrder(o, prevStatus);
        if(o.status==='ivykdyta' && prevStatus!=='ivykdyta' && !o.stockDeducted){
          warehouse.packaging.large = Math.max(0, (warehouse.packaging.large||0) - (o.largeCakes||[]).length);
          warehouse.packaging.small = Math.max(0, (warehouse.packaging.small||0) - (o.smallCakes||[]).length);
          warehouse.packaging.jarsLarge = Math.max(0, (warehouse.packaging.jarsLarge||0) - (o.jarQtyLarge||0));
          warehouse.packaging.jarsSmall = Math.max(0, (warehouse.packaging.jarsSmall||0) - (o.jarQtySmall||0));
          o.stockDeducted = true;
          await saveWarehouse();
          await updateOrderDoc(o);
        } else if(o.status!=='ivykdyta' && prevStatus==='ivykdyta' && o.stockDeducted){
          warehouse.packaging.large = (warehouse.packaging.large||0) + (o.largeCakes||[]).length;
          warehouse.packaging.small = (warehouse.packaging.small||0) + (o.smallCakes||[]).length;
          warehouse.packaging.jarsLarge = (warehouse.packaging.jarsLarge||0) + (o.jarQtyLarge||0);
          warehouse.packaging.jarsSmall = (warehouse.packaging.jarsSmall||0) + (o.jarQtySmall||0);
          o.stockDeducted = false;
          await saveWarehouse();
          await updateOrderDoc(o);
        }
      }catch(e){
        console.error('Nepavyko išsaugoti būsenos', e);
        alert('Nepavyko išsaugoti pakeitimų.');
      }
      quickStatusPending = null;
      render();
    }

    const updateEmailTemplatePreviewFrame = ()=>{

      frame.srcdoc = fillEmailTemplateEditablePreview(codeInput.value, SAMPLE_EMAIL_TOKENS);

        try{
          const body = frame.contentDocument.body;
          body.contentEditable = 'true';
          body.style.outline = 'none';
          body.oninput = ()=>{
            // Edited directly in the preview - strip the token markers
            // back into {{tokens}} and write the result into the code
            // textarea + in-memory template, WITHOUT refreshing the
            // iframe itself (that would reset the cursor mid-typing).
            const rebuilt = stripEditablePreviewMarkers(body.innerHTML);
            const key = codeInput.dataset.emailTemplateKey;
            codeInput.value = rebuilt;
            if(!emailTemplates[key]) emailTemplates[key] = Object.assign({}, DEFAULT_EMAIL_TEMPLATES[key]);
            emailTemplates[key].html = rebuilt;

        const key = emailTemplateCodeInput.dataset.emailTemplateKey;

      // admin's Puslapis tab. Uses the native HTML5 drag API - the dragged

      // variable is needed just to track "which item is being dragged".
      let dragSrcIndex = null;
      document.querySelectorAll('[data-gallery-photo-drag]').forEach(el=>{
        el.ondragstart = (e)=>{
          dragSrcIndex = +el.dataset.galleryPhotoDrag;
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', String(dragSrcIndex));
          el.style.opacity = '0.4';
        };
        el.ondragend = ()=>{ el.style.opacity = ''; };
        el.ondragover = (e)=>{ e.preventDefault(); e.dataTransfer.dropEffect = 'move'; };
        el.ondrop = async (e)=>{
          e.preventDefault();
          const targetIndex = +el.dataset.galleryPhotoDrag;
          if(dragSrcIndex === null || dragSrcIndex === targetIndex) return;
          const photos = orderSettings.landingGalleryPhotos;
          const wasMain = orderSettings.landingHeroPhotoIndex||0;
          const [moved] = photos.splice(dragSrcIndex, 1);
          photos.splice(targetIndex, 0, moved);
          // Keep the "main photo" star pointing at the same actual photo,
          // not just the same slot, since everything just shifted around it.
          if(wasMain === dragSrcIndex) orderSettings.landingHeroPhotoIndex = targetIndex;
          else if(dragSrcIndex < wasMain && targetIndex >= wasMain) orderSettings.landingHeroPhotoIndex = wasMain - 1;
          else if(dragSrcIndex > wasMain && targetIndex <= wasMain) orderSettings.landingHeroPhotoIndex = wasMain + 1;

        if(inboxSearchQuery.trim() && !inboxSearchDropdownOpen){
          inboxSearchDropdownOpen = true;
          // Direct DOM update, NOT render(): a full render() here would
          // replace the input with a brand new DOM node mid-click, which
          // breaks the browser's native double-click "select word" gesture
          // (the second click of the double-click ends up landing on a
          // different element than the first).
          updateInboxSearchDropdown();
        }
      };

        sendOrderNotificationNtfy(data);
        if(screenMode==='customer' && window.fbq){
          const purchaseValue = parseFloat(String(data.price || autoPriceFallback(data) || '').replace(',', '.')) || 0;
          fbq('track', 'Purchase', {
            value: purchaseValue,
            currency: 'EUR',
            content_name: 'Užsakymas Nr. ' + formatOrderNumber(data.orderNumber),
          });
        }

        if(appliedDiscount){
          const usageRecord = {customerName: data.customerName, orderNumber: data.orderNumber, usedAt: new Date().toISOString()};
          if(appliedDiscount.kind==='discount'){
            appliedDiscount.ref.usedBy = appliedDiscount.ref.usedBy || [];
            appliedDiscount.ref.usedBy.push(usageRecord);
            await saveDiscountCodes();
          } else {
            appliedDiscount.ref.used = true;
            appliedDiscount.ref.usedBy = usageRecord;
            await saveGiftCoupons();
          }
        }

        if(data.appliedOfferId){
          const usedOffer = offersList.find(o=>o.id===data.appliedOfferId);
          if(usedOffer && usedOffer.usageType==='once' && !usedOffer.used){
            usedOffer.used = true;
            try{ await saveOffers(); }catch(e){ console.error('Nepavyko pažymėti pasiūlymo kaip panaudoto', e); }
          }
        }

        const submittedNumber = data.orderNumber;
        const submittedName = data.customerName;
        modalOrder = emptyOrderTemplate(nextOrderNumber());
        customerJustSubmitted = {orderNumber: submittedNumber, customerName: submittedName};
        showPaymentReminder = {orderNumber: submittedNumber};
        render();
      }catch(e){
        console.error('Nepavyko išsiųsti užsakymo', e);
        orders = orders.filter(o=>o.id!==data.id);
        submitError = 'Nepavyko išsiųsti užsakymo - patikrink interneto ryšį ir bandyk dar kartą.';
        submitOrderBtn.disabled = false;
        submitOrderBtn.textContent = submitOrderBtnOriginalText;
        render();
      }
    };


    const delBtn = document.getElementById('deleteOrder');
    if(delBtn) delBtn.onclick = async ()=>{
      if(!(await customConfirm('Ištrinti šį užsakymą? Šio veiksmo atšaukti negalėsi.', {danger:true}))) return;
      const existing = orders.find(o=>o.id===modalOrder.id);
      if(existing && existing.stockDeducted){
        warehouse.packaging.large = (warehouse.packaging.large||0) + (existing.largeCakes||[]).length;
        warehouse.packaging.small = (warehouse.packaging.small||0) + (existing.smallCakes||[]).length;
        warehouse.packaging.jarsLarge = (warehouse.packaging.jarsLarge||0) + (existing.jarQtyLarge||0);
        warehouse.packaging.jarsSmall = (warehouse.packaging.jarsSmall||0) + (existing.jarQtySmall||0);
        await saveWarehouse();
      }
      const deletedId = modalOrder.id;
      orders = orders.filter(o=>o.id!==deletedId);
      await deleteOrderDoc(deletedId);
      modalOrder = null;
      render();
    };

    if(prevId){
      const el = document.getElementById(prevId);
      if(el && typeof el.focus === 'function'){
        __restoringFocus = true;
        el.focus({preventScroll:true});
        __restoringFocus = false;
        if(prevCaret!==null && typeof el.setSelectionRange === 'function'){
          try{ el.setSelectionRange(prevCaret, (typeof prevCaretEnd==='number') ? prevCaretEnd : prevCaret); }catch(e){}
        }
      }
    }
  }

  function tryCommitJarSizeCombo(size){
    const flavorKey = size==='large' ? 'jarLargeDraftFlavor' : 'jarSmallDraftFlavor';
    const colorKey = size==='large' ? 'jarLargeDraftColor' : 'jarSmallDraftColor';
    const combosKey = size==='large' ? 'jarLargeCombos' : 'jarSmallCombos';

    const flavor = modalOrder[flavorKey], color = modalOrder[colorKey];
    if(!flavor || !color) return false;

    if(!modalOrder[combosKey]) modalOrder[combosKey] = [];
    const maxCombos = size==='large' ? orderSettings.maxJarLarge : orderSettings.maxJarSmall;
    if(modalOrder[combosKey].length >= maxCombos) return false;

    modalOrder[combosKey].push({flavor, color});
    modalOrder[flavorKey] = ''; modalOrder[colorKey] = '';
    recomputePrice();
    return true;
  }

  function pickCakeDraft(group, unitIdx, field, value){
    const arr = group==='large' ? modalOrder.largeCakes : modalOrder.smallCakes;
    if(!arr || !arr[unitIdx]) return;
    const unit = arr[unitIdx];
    const max = group==='large' ? orderSettings.maxLarge : orderSettings.maxSmall;
    unit[field] = (unit[field] === value) ? '' : value;
    if(unit.draftFlavor && unit.draftColor){
      if(!unit.combos) unit.combos = [];
      if(unit.combos.length < max){
        unit.combos.push({flavor:unit.draftFlavor, color:unit.draftColor});
      }
      unit.draftFlavor = '';
      unit.draftColor = '';
      recomputePrice();
    }
    render();
  }

  function formatDate(iso){
    const [y,m,d] = iso.split('-');
    return `${y}/${m.padStart(2,'0')}/${d.padStart(2,'0')}`;

  function formatDateLong(iso){
    const [y,m,d] = iso.split('-');
    return `${y}/${m.padStart(2,'0')}/${d.padStart(2,'0')}`;
  }
  function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function escapeAttr(s){ return escapeHtml(s); }

  // Keeps the browser's own Back/Forward buttons in sync with the
  // landing-page <-> customer-form transition (which uses pushState so the
  // URL hash reflects where the visitor is, without a full page reload).
  // Admin routing isn't handled here since /administravimas is a separate
  // page load with its own auth flow, not a client-side history entry.
  window.addEventListener('popstate', ()=>{
    if(isAdminPath()) return;
    if(window.location.hash === '#uzsakymas'){
      if(screenMode !== 'customer'){
        modalOrder = emptyOrderTemplate(nextOrderNumber());
        screenMode = 'customer';
        initFacebookPixel(orderSettings.fbPixelId);
        render();
      }
    } else if(currentProductRoute()){
      if(screenMode !== 'product' || productRouteType !== currentProductRoute()){
        productRouteType = currentProductRoute();
        productPhotoIndex = 0;
        screenMode = 'product';
        render();
      }
    } else if(screenMode !== 'landing'){
      screenMode = 'landing';
      render();
    }
  });

  // Dynamically loads a <script src="..."> and resolves once it's
  // downloaded and executed.
  function loadScript(src){
    return new Promise((resolve, reject)=>{
      const s = document.createElement('script');
      s.src = src;
      s.onload = ()=>resolve();
      s.onerror = ()=>reject(new Error('Nepavyko įkelti: ' + src));
      document.head.appendChild(s);
    });
  }

  // jsPDF/xlsx/exceljs/chart.js/pdf-lib, AND the admin-only section/modal
  // generator functions (admin.js), are only ever used inside the admin
  // panel. Triggering their download here - right at boot, but ONLY when
  // the admin path is being visited - means a normal customer never pays
  // that cost. Unlike the libraries (only needed once a specific button is
  // clicked later), admin.js defines functions render() calls immediately,
  // so it must be awaited before loadOrders() can trigger the first render.
  //
  // Same reasoning for the three fetches below: ROBOTO_REGULAR_B64 /
  // ROBOTO_BOLD_B64 (jsPDF font data for invoices) and LOGO_BASE64 (only
  // needed as raw base64 for jsPDF's addImage() in invoice/coupon PDFs -
  // every other, customer-facing use of the logo just points <img> at
  // /logo.png directly) used to be ~430KB of const string literals sitting
  // in this file, downloaded and parsed by every landing-page visitor even
  // though only the admin PDF export ever touches them. They're declared
  // as empty `let`s above (so admin.js's functions can still see them -
  // see the eval() scoping gotcha below) and only filled in here, in the
  // admin-only branch.
  if(isAdminPath()){
    try{
      await Promise.all([
        loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'),
        loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'),
        loadScript('https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js'),
        loadScript('https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js'),
        loadScript('https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js'),
        fetch('/roboto-regular.b64.txt').then(r=>r.text()).then(t=>{ ROBOTO_REGULAR_B64 = t; }),
        fetch('/roboto-bold.b64.txt').then(r=>r.text()).then(t=>{ ROBOTO_BOLD_B64 = t; }),
        fetch('/logo-base64.txt').then(r=>r.text()).then(t=>{ LOGO_BASE64 = t; }),
      ]);
      // admin.js must be executed with plain (direct) eval, NOT as a
      // separately loaded <script src> tag - the whole app lives inside
      // one big IIFE, so a normal <script src> would run in the global
      // scope and never see any of this file's functions/variables.
      // Direct eval() runs in THIS exact local scope instead, so the
      // admin-only FUNCTIONS it defines become first-class citizens here,
      // visible to render() and everything else, exactly as if this code
      // had always been in this file.
      //
      // IMPORTANT GOTCHA: this only applies to `function foo(){}` style
      // declarations. Any `let`/`const` written inside admin.js is scoped
      // to the eval() call itself and is INVISIBLE outside it (a quirk of
      // direct eval) - so admin.js must never declare its own state
      // variables. Any state a moved-out admin.js function needs (like a
      // modal's open/closed flag) must be declared here, in this shared
      // file, instead - exactly like offerModalOpen, addExpenseModalOpen,
      // etc. already are.
      const adminJsSource = await (await fetch('./admin.js')).text();
      eval(adminJsSource);
    }catch(err){
      console.error('Nepavyko įkelti administravimo bibliotekų', err);
    }
  }
  loadOrders();

  // The settings-style data below (prices, warehouse stock, vacations, discount
  // codes, etc.) lives in a simple key-value store that doesn't support Firebase's
  // real-time listeners the way the orders/invoices/expenses collections do. To
  // still keep it reasonably in sync across devices without a manual refresh,
  // poll for changes every 15 seconds while the admin screen is open - but never
  // while the person is actively typing somewhere, since re-loading the saved
  // (older) value mid-edit would otherwise overwrite what they're typing.
  setInterval(()=>{
    if(screenMode === 'admin' && !isUserTyping()){
      loadBlobSettings(false).then(render).catch(()=>{});
    }
  }, 15000);

  window.addEventListener('resize', syncSidebarHeight);

  document.addEventListener('keydown', (e)=>{
    if(e.key==='Escape' && landingLightboxIndex !== null){
      landingLightboxIndex = null;
      render();
    }
  });

  document.addEventListener('click', (e)=>{
    if(screenMode !== 'admin' || activeAdminTab !== 'orders') return;
    if(!selectedDate && !activeFilter && !reminderFilterType) return;
    const keepOpenSelectors = ['.cal-day', '.status-stat-card', '.day-panel', '#orderListAnchor', '.grid', '.overlay', '.modal', '.admin-sidebar', '.mobile-menu-btn', '.cal-nav', '.order-cards-switcher', '.reminders-banner'];
    if(keepOpenSelectors.some(sel=>e.target.closest(sel))) return;
    selectedDate = null;
    activeFilter = null;
    reminderFilterType = null;
    render();
  });

  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('./sw.js').catch(()=>{});
    });
  }
})();
</script>

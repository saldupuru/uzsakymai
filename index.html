<link rel="manifest" href="./manifest.json" id="pwaManifestLink">
<meta name="theme-color" content="#B8355F">
<link rel="apple-touch-icon" href="./icon-192.png" id="pwaTouchIconLink">
<script>
  // The manifest/icon links above use relative paths, which only resolve
  // correctly if the URL bar has a trailing slash (saldupuru.lt/administravimas/
  // works, but saldupuru.lt/administravimas without the slash makes the browser
  // treat "administravimas" as a filename and look for manifest.json at the
  // site root instead - silently loading the wrong PWA and the wrong start_url).
  // Rewriting both hrefs to absolute paths here removes that ambiguity entirely,
  // regardless of how the person typed or bookmarked the URL.
  (function(){
    var isAdmin = /\/administravimas\/?$/.test(window.location.pathname);
    var base = isAdmin ? '/administravimas/' : '/';
    var manifestLink = document.getElementById('pwaManifestLink');
    if(manifestLink) manifestLink.setAttribute('href', base + 'manifest.json');
    var iconLink = document.getElementById('pwaTouchIconLink');
    if(iconLink) iconLink.setAttribute('href', base + 'icon-192.png');
  })();
</script>

  <p style="margin:0;">Cukraus vatos tortai ir cukraus vatos indeliai Vilniuje. Rankų darbo, spalvingi ir saldūs skanėstai vaikų gimtadieniams, šventėms ir ypatingoms progoms. Užsisakykite internetu.</p>

<style>

:root{
  --cream:#FBF7F1;
  --box:#F4EBDD;
  --box-line:#E6D9C3;
  --choc:#33262A;
  --choc-soft:#7A6B66;
  --berry:#B8355F;
  --berry-deep:#8E2748;
  --sage:#7C8F5A;
  --sage-deep:#5E6E42;
  --gold:#C9932E;
  --muted-red:#A64B4B;
  --white:#FFFFFF;
  --line:rgba(51,38,42,0.10);
  --shadow-xs:0 1px 2px rgba(51,38,42,0.05);
  --shadow-sm:0 2px 8px rgba(51,38,42,0.06);
  --shadow-md:0 8px 24px rgba(51,38,42,0.10);
  --shadow-lg:0 20px 48px rgba(51,38,42,0.16);
  --ease:cubic-bezier(.2,.8,.2,1);
}

html{overflow-x:hidden;}
*{box-sizing:border-box;}
#app{
  font-family:'Inter','Noto Sans',sans-serif;
  color:var(--choc);
  background:var(--cream);
  min-height:100vh;
  padding:32px 20px 60px;
  -webkit-font-smoothing:antialiased;
  display:flex;
  flex-direction:column;
}
#app.app-centered{justify-content:center;}
#app.app-landing{padding:0;}

.wrap{max-width:1180px;margin:0 auto;}

/* header */
.header{display:flex;align-items:center;gap:14px;margin-bottom:32px;flex-wrap:wrap;}
.header svg{flex-shrink:0;}
.header-logo{width:80px;height:80px;object-fit:contain;border-radius:50%;flex-shrink:0;box-shadow:var(--shadow-sm);}
@media (max-width:640px){
  .header{flex-direction:column;align-items:center;text-align:center;gap:10px;}
  .header-logo{width:100px;height:100px;}
  .header h1{font-size:22px;}
  .header .btn{margin-left:0 !important;width:100%;max-width:300px;font-size:12px;padding:9px 10px;}
}
.header h1{font-family:'Noto Serif',serif;font-weight:600;font-size:29px;margin:0;letter-spacing:-0.015em;}
.header p{margin:3px 0 0;color:var(--choc-soft);font-size:14px;}

/* layout */
.layout{
  display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start;
  isolation:isolate;
}
@media (max-width:880px){ .layout{grid-template-columns:1fr;} }

/* panel (sidebar) */
.panel{
  background:var(--white);border-radius:18px;border:1px solid var(--line);
  padding:22px;position:relative;z-index:1;box-shadow:var(--shadow-sm);
}
@media (min-width:881px){ .panel{position:sticky;top:20px;} }
.message-card{
  background:var(--white);border-radius:16px;border:1px solid var(--box-line);
  padding:18px 20px;box-shadow:var(--shadow-xs);max-width:560px;margin-top:14px;
}
.message-card.unread{border-color:var(--berry);box-shadow:var(--shadow-sm);}
.search-dropdown-item{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--box-line);}
.search-dropdown-item:last-child{border-bottom:none;}
.search-dropdown-item:hover{background:var(--cream,#FAF6F0);}
.panel h2{font-family:'Noto Serif',serif;font-size:18px;font-weight:600;margin:0 0 4px;}
.panel .hint{font-size:12.5px;color:var(--choc-soft);margin:0 0 14px;line-height:1.5;}
textarea.paste{
  width:100%;min-height:100px;border:1.5px dashed var(--box-line);border-radius:12px;
  padding:10px 12px;font-family:'Inter','Noto Sans',sans-serif;font-size:13.5px;resize:vertical;
  background:var(--cream);color:var(--choc);transition:border-color .15s var(--ease);
}
textarea.paste:focus{outline:none;border-color:var(--berry);border-style:solid;}

.btn{
  font-family:'Inter','Noto Sans',sans-serif;font-weight:600;font-size:13.5px;border:none;
  border-radius:10px;padding:10px 16px;cursor:pointer;
  transition:transform .12s var(--ease), box-shadow .15s var(--ease), background .15s var(--ease), color .15s var(--ease), border-color .15s var(--ease);
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--berry);color:#fff;box-shadow:0 4px 12px rgba(184,53,95,0.28);}
.btn-primary:hover{background:var(--berry-deep);box-shadow:0 6px 16px rgba(184,53,95,0.34);}
.btn-ghost{background:transparent;color:var(--choc);border:1.5px solid var(--box-line);}
.btn-ghost:hover{border-color:var(--berry);color:var(--berry);background:rgba(184,53,95,0.05);}
.btn-danger{background:var(--muted-red);color:#fff;box-shadow:0 4px 12px rgba(166,75,75,0.28);}
.btn-danger:hover{background:#8a3d3d;box-shadow:0 6px 16px rgba(166,75,75,0.34);}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:8px;}
.btn-block{width:100%;margin-top:10px;}

.divider{border:none;border-top:1px solid var(--line);margin:18px 0;}

/* form */
.field{margin-bottom:12px;}
.field label{
  display:block;font-size:11.5px;font-weight:600;color:var(--choc-soft);
  margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em;
}
.field input,.field select,.field textarea{
  width:100%;border:1.5px solid var(--box-line);border-radius:10px;padding:9px 11px;
  font-family:'Inter','Noto Sans',sans-serif;font-size:13.5px;background:var(--cream);color:var(--choc);
  transition:border-color .15s var(--ease), box-shadow .15s var(--ease);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--berry);box-shadow:0 0 0 3px rgba(184,53,95,0.12);}
.field textarea{min-height:56px;resize:vertical;}
.seller-invoice-fields{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;}
.seller-invoice-fields .field{margin-bottom:10px;}
.seller-invoice-fields .field:first-child{grid-column:1 / -1;}
@media (max-width:560px){.seller-invoice-fields{grid-template-columns:1fr;}.seller-invoice-fields .field:first-child{grid-column:auto;}}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.row3 .field label{font-size:11px;}
.product-info-text{
  font-size:11.5px;color:var(--choc-soft);font-weight:400;font-style:italic;
  margin:-2px 0 5px;opacity:.85;
}
.product-icon-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px;}
.product-icon-tile{
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;
  border:1.5px solid var(--box-line);border-radius:14px;background:var(--cream);cursor:pointer;
  transition:all .15s var(--ease);
}
.product-icon-tile:hover{border-color:var(--berry);}
.product-icon-tile.active{border-color:var(--berry);background:var(--berry);}
.product-icon{font-size:26px;line-height:1;height:50px;display:flex;align-items:center;justify-content:center;}
.product-icon-label{font-size:10.5px;font-weight:600;color:var(--choc-soft);text-align:center;line-height:1.2;}
.product-icon-price{font-size:12.5px;font-weight:700;color:var(--berry-deep);margin-top:2px;}
.product-icon-tile.active .product-icon-price{color:#fff;}
.product-icon-tile.active .product-icon-label{color:#fff;}
.checkrow{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-top:2px;}
.offer-cards{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
.offer-card{
  position:relative;border:1.5px solid var(--box-line);border-radius:14px;background:var(--cream);
  padding:12px 14px;cursor:pointer;transition:all .15s var(--ease);
}
.offer-card:hover{border-color:var(--berry);}
.offer-card.applied{border-color:var(--berry);background:#FFF3F7;}
.offer-card-top{display:flex;justify-content:space-between;align-items:center;}
.offer-card-name{font-weight:700;font-size:14.5px;color:var(--choc);}
.offer-info-btn{background:none;border:none;cursor:pointer;font-size:15px;color:var(--berry);padding:2px 4px;line-height:1;}
.offer-card-price{font-size:14px;font-weight:600;color:var(--berry-deep);margin-top:2px;}
.offer-card-timer{font-size:12px;color:var(--choc-soft);margin-top:4px;}
.offer-card-applied-tag{font-size:12px;font-weight:700;color:var(--sage-deep,#5E8F6E);margin-top:4px;}
.offer-info-panel{margin-top:8px;padding-top:8px;border-top:1px solid var(--box-line);font-size:12.5px;color:var(--choc-soft);line-height:1.5;}

/* Admin "Pasiūlymai" list card (Akcijos tab) */
.offer-admin-card{
  background:var(--white);border-radius:14px;border:1px solid var(--box-line);
  padding:14px 16px;box-shadow:var(--shadow-xs);margin-top:10px;max-width:560px;
}
.offer-admin-row1{font-size:14.5px;color:var(--choc);line-height:1.5;}
.offer-admin-row2{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-top:10px;padding-top:10px;border-top:1px solid var(--box-line);}
.offer-admin-visible-label{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--choc-soft);cursor:pointer;}
.offer-admin-tag{font-size:12.5px;color:var(--choc-soft);background:var(--cream);border-radius:8px;padding:3px 9px;}
.offer-admin-actions{display:flex;align-items:center;gap:10px;margin-left:auto;}
.info-icon-wrap{position:relative;display:inline-flex;}
.info-icon-btn{
  width:18px;height:18px;border-radius:50%;border:1.5px solid var(--berry);background:var(--white);
  color:var(--berry);font-size:11px;font-weight:700;font-style:italic;font-family:Georgia,serif;
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;line-height:1;
}
.info-icon-tooltip{
  display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
  width:220px;background:var(--choc);color:#fff;font-size:12px;font-weight:400;line-height:1.5;
  padding:9px 12px;border-radius:10px;box-shadow:var(--shadow-md);z-index:20;text-align:left;
}
.info-icon-tooltip::after{
  content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:6px solid transparent;border-top-color:var(--choc);
}
.info-icon-wrap:hover .info-icon-tooltip,.info-icon-wrap.open .info-icon-tooltip{display:block;}
.checkrow input{width:auto;}

/* filter tabs */
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;position:relative;z-index:1;}
.tab{
  font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:20px;
  border:1.5px solid var(--box-line);background:var(--white);color:var(--choc-soft);
  cursor:pointer;white-space:nowrap;transition:all .15s var(--ease);
}
.tab:hover{border-color:var(--berry);color:var(--berry);}
.tab.active{background:var(--choc);color:var(--white);border-color:var(--choc);}
.searchbox{margin-left:auto;min-width:180px;}
.searchbox input{
  width:100%;border:1.5px solid var(--box-line);border-radius:20px;
  padding:7px 14px;font-size:13px;background:var(--white);transition:border-color .15s var(--ease);
}
.searchbox input:focus{outline:none;border-color:var(--berry);}

/* cards grid */
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;
  position:relative;z-index:1;
}

.ticket{
  background:var(--box);border-radius:16px;position:relative;padding:16px 16px 14px;
  border:1px solid var(--line);cursor:pointer;
  transition:box-shadow .2s var(--ease), transform .15s var(--ease);
}
.ticket:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
.ticket-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;}
.ticket-name{font-family:'Noto Serif',serif;font-weight:600;font-size:16.5px;line-height:1.25;}
.ticket-ordernum{
  font-family:'Inter','Noto Sans',sans-serif;font-size:11px;font-weight:600;color:var(--choc-soft);
  margin-left:8px;vertical-align:middle;
}
.invoice-needed-badge{
  font-size:11px;font-weight:700;background:#F3D3DE;color:var(--berry-deep);border-radius:8px;
  padding:3px 7px;white-space:nowrap;flex-shrink:0;
}
.invoice-needed-badge.invoice-issued{background:#DCE9D2;color:var(--sage-deep, #5E6E42);}
.stamp{
  font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  padding:4px 10px;border-radius:20px;transform:rotate(-2deg);white-space:nowrap;flex-shrink:0;
  box-shadow:var(--shadow-xs);
}
.stamp.laukia_patvirtinimo{background:#EAD4D4;color:var(--muted-red);}
.stamp.aktyvus{background:#F3E0B5;color:#8C6415;}
.stamp.pagaminta{background:#F3D3DE;color:var(--berry-deep);}
.stamp.ivykdyta{background:#CFE0BE;color:var(--sage-deep);}

.ticket-meta{font-size:12.5px;color:var(--choc-soft);margin:2px 0;}
.ticket-unit-line{padding-left:10px;}
.ticket-ordinal{font-weight:700;color:var(--choc);margin-top:6px;}
.ticket-date-line{
  font-size:14.5px;padding-bottom:9px;margin-bottom:8px;
  border-bottom:1.5px solid var(--line);
}
.ticket-meta b{color:var(--choc);font-weight:600;}
.perf{border-top:1.5px dashed var(--box-line);margin:10px 0;}
.ticket-bottom{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;gap:8px;}
.ticket-bottom-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
.phone-text{color:var(--choc-soft);font-weight:600;white-space:nowrap;}
.price-text{font-weight:700;white-space:nowrap;}
.paid-pill{font-weight:700;font-size:11px;padding:3px 9px;border-radius:12px;white-space:nowrap;}
.paid-pill.yes{background:#DCE6CC;color:var(--sage-deep);}
.paid-pill.no{background:#F3D3DE;color:var(--berry-deep);}
.paid-toggle-btn{
  width:100%;padding:11px;border-radius:10px;border:none;cursor:pointer;
  font-weight:700;font-size:13.5px;color:#fff;transition:background .15s var(--ease);
}
.paid-toggle-btn.is-unpaid{background:var(--muted-red);}
.paid-toggle-btn.is-paid{background:var(--sage-deep);}
.urgent-toggle-btn{
  width:100%;padding:11px;border-radius:10px;border:none;cursor:pointer;
  font-weight:700;font-size:13.5px;transition:background .15s var(--ease);
}
.urgent-toggle-btn.is-urgent{background:#E8823A;color:#fff;}
.urgent-toggle-btn.is-normal{background:var(--box-line);color:var(--choc-soft);}
.confirm-email-btn.is-sent{background:var(--sage-deep);color:#fff;border-color:var(--sage-deep);cursor:default;opacity:1;}
.urgent-badge{
  display:inline-flex;align-items:center;gap:3px;background:#E8823A;color:#fff;
  font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap;
}

/* Wraps every action button in the quick-status modal (paid toggle, urgent
   toggle, confirm/edit/delete, plus the call/SMS row) in one flex column
   with a single consistent gap, so spacing never drifts out of sync again
   as buttons are conditionally shown/hidden. */
.quick-status-actions{display:flex;flex-direction:column;gap:12px;margin-top:16px;}
.quick-status-actions > *{margin:0 !important;}

/* Quick call/SMS row in the order status modal — mobile only. On desktop the
   admin already has a mouse/keyboard and the customer's number is visible
   in the order details, so these shortcut buttons would just be clutter. */
.quick-contact-section{display:none;}
@media (max-width:900px){
  .quick-contact-section{display:block;}
  .quick-contact-toggle{
    display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    padding:12px 0;background:var(--berry);color:#fff;border:none;border-radius:10px;
    cursor:pointer;font-family:'Inter','Noto Sans',sans-serif;font-weight:600;font-size:13.5px;
    transition:background .15s var(--ease);
  }
  .quick-contact-toggle:hover,.quick-contact-toggle:active{background:var(--berry-deep);}
  .quick-contact-toggle svg{width:17px;height:17px;fill:#fff;flex-shrink:0;}
  .quick-contact-row{display:flex;width:100%;gap:12px;margin-top:12px;}
  .quick-contact-btn{
    flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
    padding:12px 0;background:var(--berry);color:#fff;text-decoration:none;
    border-radius:10px;font-family:'Inter','Noto Sans',sans-serif;font-weight:600;font-size:13.5px;
    transition:background .15s var(--ease);
  }
  .quick-contact-btn:hover,.quick-contact-btn:active{background:var(--berry-deep);}
  .quick-contact-btn svg{width:17px;height:17px;fill:#fff;flex-shrink:0;}
}

.empty{text-align:center;padding:60px 20px;color:var(--choc-soft);}
.empty svg{margin-bottom:10px;}
.empty-logo{width:72px;height:72px;object-fit:contain;border-radius:50%;margin-bottom:10px;opacity:.85;}
.empty h3{font-family:'Noto Serif',serif;font-size:19px;color:var(--choc);margin:0 0 6px;}
.empty p{font-size:13.5px;margin:0;}

/* modal */
.overlay{
  position:fixed;inset:0;background:rgba(51,38,42,0.45);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;z-index:70;padding:20px;
}
.modal{
  background:var(--white);border-radius:20px;max-width:520px;width:100%;
  max-height:88vh;overflow-y:auto;padding:26px;box-shadow:var(--shadow-lg);
}
.modal h2{font-family:'Noto Serif',serif;font-size:20px;margin:0 0 14px;}
.modal-close{
  position:absolute;top:14px;right:16px;background:none;border:none;
  font-size:20px;cursor:pointer;color:var(--choc-soft);transition:color .15s var(--ease);
}
.modal-close:hover{color:var(--berry);}
.modal-actions{display:flex;gap:8px;margin-top:16px;}

.status-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:6px;}
.confirm-order-row{
  background:#DCE6CC;border-radius:14px;padding:14px;margin-top:14px;
}
.confirm-order-btn{background:var(--sage-deep);box-shadow:0 4px 12px rgba(94,110,66,0.28);}
.confirm-order-btn:hover{background:var(--sage);}
.export-modal{max-width:480px;}
.confirm-modal{max-width:400px;}
.confirm-message{font-size:14.5px;line-height:1.5;margin:0;white-space:pre-line;}
.export-list{
  max-height:320px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:6px 10px;
}
.export-row{
  display:flex;align-items:center;gap:9px;padding:8px 4px;border-bottom:1px solid var(--line);
  font-size:13px;cursor:pointer;
}
.export-row:last-child{border-bottom:none;}
.export-row-num{font-weight:700;color:var(--berry-deep);min-width:34px;}
.export-row-name{flex:1;font-weight:600;color:var(--choc);}
.export-row-date{color:var(--choc-soft);font-size:12px;}
.export-row-status{color:var(--choc-soft);font-size:11.5px;background:var(--cream);border-radius:8px;padding:2px 7px;}
.reminders-banner{
  display:flex;flex-direction:column;gap:8px;margin-bottom:22px;
}
.reminder-item{
  display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;font-size:13.5px;font-weight:500;
  cursor:pointer;transition:filter .15s var(--ease);
}
.reminder-item:hover{filter:brightness(0.96);}
.reminder-icon{font-size:16px;flex-shrink:0;}
.reminder-item.rem-warn{background:#FBEFD6;color:#8C6415;}
.reminder-item.rem-info{background:#E1EAD2;color:var(--sage-deep, #5E6E42);}
.reminder-item.rem-danger{background:#F3D3DE;color:var(--berry-deep, #8E2748);}
.reminder-item.rem-urgent{background:var(--muted-red);color:#fff;font-weight:700;}
.stats-cards{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px;}
.stats-card{
  background:var(--cream, #FFF8EF);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;min-width:120px;flex:1;display:flex;flex-direction:column;gap:4px;
}
.cost-accordion{border-bottom:1px solid var(--line);}
.cost-accordion:last-child{border-bottom:none;}
.cost-accordion-head{cursor:pointer;}
.cost-components-panel{padding:0 0 12px 12px;}
.cost-components-panel .wh-stock-row{font-size:12.5px;}
.stats-card-label{font-size:11.5px;color:var(--choc-soft);text-transform:uppercase;letter-spacing:.03em;font-weight:600;}
.stats-card-value{font-size:17px;font-weight:700;color:var(--berry-deep);font-family:'Noto Serif',serif;}
.stats-card-value.stats-income,.stats-card-value.stats-positive{color:var(--sage-deep);}
.stats-card-value.stats-expense,.stats-card-value.stats-negative{color:var(--berry);}
.stats-chart-wrap{
  background:var(--white);border:1px solid var(--line);border-radius:12px;padding:16px;
  max-width:560px;height:260px;position:relative;
}
.year-switcher{display:flex;align-items:center;gap:8px;}
.journal-mode-switch{display:flex;gap:6px;}
.year-switcher-label{font-weight:700;color:var(--berry-deep);min-width:44px;text-align:center;font-family:'Noto Serif',serif;}
.year-switcher .btn-sm{padding:4px 10px;}
.discount-status-btn{
  background:none;border:1px dashed var(--line);border-radius:8px;cursor:pointer;
  font-size:11.5px;color:var(--choc-soft);padding:3px 8px;white-space:nowrap;
}
.discount-used-tag{font-size:11.5px;font-weight:700;background:#F3D3DE;color:var(--berry-deep);border-radius:8px;padding:3px 8px;white-space:nowrap;}
.discount-unused-tag{font-size:11.5px;font-weight:700;background:#DCE6CC;color:var(--sage-deep);border-radius:8px;padding:3px 8px;white-space:nowrap;}
.discount-users-panel{padding:0 0 10px 12px;}
.discount-users-panel .wh-stock-row{font-size:12px;}
.invoice-issued-box{
  background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:12px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;
}
.attach-add-btn{
  display:inline-block;cursor:pointer;color:var(--berry);font-size:12.5px;font-weight:600;
  border:1px dashed var(--berry);border-radius:12px;padding:1px 7px;margin-left:2px;
}
.attach-add-btn:hover{background:#FCEFF3;}
.status-btn{
  font-size:11.5px;font-weight:600;padding:8px 11px;border-radius:9px;text-align:center;
  border:1.5px solid var(--box-line);background:var(--cream);cursor:pointer;transition:all .15s var(--ease);
  display:flex;align-items:center;justify-content:center;min-height:36px;
}
.status-btn.current{border-color:var(--choc);background:var(--choc);color:#fff;}
.quick-status-row{gap:8px;}
.quick-status-row .status-btn{font-size:13px;padding:8px 13px;}

/* view toggle */
.view-toggle{display:flex;gap:6px;margin-bottom:16px;}
.view-btn{
  font-size:13px;font-weight:600;padding:8px 16px;border-radius:10px;
  border:1.5px solid var(--box-line);background:var(--white);color:var(--choc-soft);cursor:pointer;
  transition:all .15s var(--ease);
}
.view-btn.active{background:var(--choc);color:#fff;border-color:var(--choc);}

.status-stat-cards{
  display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;
}
.status-stat-card{
  border-radius:16px;padding:18px 16px;cursor:pointer;color:#fff;
  display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow-sm);
  transition:transform .15s var(--ease),box-shadow .15s var(--ease);
}
.status-stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
.status-stat-value{font-family:'Noto Serif',serif;font-size:30px;font-weight:700;line-height:1;}
.status-stat-label{font-size:12.5px;font-weight:600;opacity:.92;}
@media (max-width:640px){
  .status-stat-cards{grid-template-columns:repeat(2,1fr);}
}
.cal-section{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:28px;box-shadow:var(--shadow-sm);}
.section-title{font-family:'Noto Serif',serif;font-size:18px;font-weight:600;margin:0 0 12px;}
/* admin sidebar layout */
.admin-shell{
  width:100%;max-width:1400px;margin:0 auto;
  display:flex;align-items:flex-start;gap:20px;
}
.admin-sidebar{
  width:250px;flex-shrink:0;
  background:var(--white);border:1px solid var(--line);border-radius:18px;
  padding:20px 14px;box-shadow:var(--shadow-sm);
  position:sticky;top:32px;
  height:auto;max-height:none;
  display:flex;flex-direction:column;gap:16px;
  overflow:visible;
}
.sidebar-logo-row{display:flex;align-items:center;gap:10px;padding:0 6px;}
.sidebar-logo{width:40px;height:40px;object-fit:contain;border-radius:50%;flex-shrink:0;}
.sidebar-title{font-family:'Noto Serif',serif;font-weight:600;font-size:14px;color:var(--choc);line-height:1.2;}
.sidebar-logout-icon-btn{
  margin-left:auto;background:var(--cream);border:1px solid var(--line);border-radius:10px;
  font-size:15px;padding:6px 9px;cursor:pointer;line-height:1;flex-shrink:0;transition:background .15s var(--ease);
}
.sidebar-logout-icon-btn:hover{background:#F3D3DE;}
.sidebar-close-btn{display:none;margin-left:4px;background:none;border:none;font-size:22px;color:var(--choc-soft);cursor:pointer;line-height:1;}
.modal-x-close{
  position:absolute;top:16px;right:16px;background:none;border:none;font-size:24px;
  color:var(--choc-soft);cursor:pointer;line-height:1;padding:2px 6px;border-radius:8px;
  transition:background .15s var(--ease);
}
.modal-x-close:hover{background:var(--cream);}
.sidebar-nav{display:flex;flex-direction:column;gap:3px;}
.sidebar-item{
  display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:11px;
  font-size:14px;font-weight:600;color:var(--choc-soft);cursor:pointer;transition:background .15s var(--ease),color .15s var(--ease);
}
.sidebar-item:hover{background:var(--cream);}
.sidebar-item.active{background:var(--berry);color:#fff;}
.sidebar-item-icon{font-size:16px;flex-shrink:0;width:20px;text-align:center;}
.sidebar-drag-handle{
  font-size:13px;color:var(--choc-soft);opacity:0;flex-shrink:0;cursor:grab;width:12px;
  transition:opacity .15s var(--ease);
}
.sidebar-item:hover .sidebar-drag-handle{opacity:.55;}
.sidebar-item.active .sidebar-drag-handle{color:#fff;opacity:.7;}
.sidebar-item.dragging{opacity:.4;}
.sidebar-item.drag-over{box-shadow:inset 0 2px 0 var(--berry);}
.sidebar-badge{
  margin-left:auto;background:var(--muted-red);color:#fff;font-size:10.5px;font-weight:700;
  border-radius:999px;min-width:18px;height:18px;padding:0 5px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.sidebar-item.active .sidebar-badge{background:#fff;color:var(--berry-deep);}
.toggle-switch{position:relative;display:inline-block;width:44px;height:24px;flex-shrink:0;}
.toggle-switch input{opacity:0;width:0;height:0;position:absolute;}
.toggle-track{
  position:absolute;cursor:pointer;inset:0;background:var(--box-line);
  border-radius:999px;transition:background .18s var(--ease);display:block;
}
.toggle-track:before{
  content:"";position:absolute;height:18px;width:18px;left:3px;top:3px;
  background:#fff;border-radius:50%;transition:transform .18s var(--ease);box-shadow:var(--shadow-xs);
}
.toggle-switch input:checked + .toggle-track{background:var(--berry);}
.toggle-switch input:checked + .toggle-track:before{transform:translateX(20px);}
.toggle-row{display:flex;align-items:center;gap:12px;}
.sidebar-footer{display:flex;flex-direction:column;gap:7px;border-top:1px solid var(--line);padding-top:14px;margin-top:auto;}

/* Admin "Quick actions" floating button + popup panel */
.admin-fab{
  position:fixed;bottom:24px;right:24px;z-index:60;width:56px;height:56px;border-radius:50%;
  background:var(--berry);border:none;cursor:pointer;box-shadow:0 8px 20px rgba(184,53,95,0.35);
  display:flex;align-items:center;justify-content:center;transition:transform .2s ease,background .2s ease;
  color:#fff;font-size:26px;line-height:1;font-weight:400;
}
.admin-fab:hover{background:var(--berry-deep);transform:scale(1.06);}
.admin-quick-actions-panel{
  position:fixed;bottom:90px;right:24px;z-index:60;width:min(90vw,270px);background:var(--white);
  border-radius:18px;box-shadow:0 14px 34px rgba(51,38,42,0.2);padding:18px;
  animation:admin-quick-actions-slide-up .18s ease;
}
@keyframes admin-quick-actions-slide-up{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.admin-quick-actions-panel h3{font-family:'Noto Serif',serif;font-size:16px;margin:0 0 12px;color:var(--choc);}
.admin-quick-actions-close{position:absolute;top:12px;right:14px;background:none;border:none;font-size:18px;line-height:1;cursor:pointer;color:var(--choc-soft);}
.admin-quick-action-btn{
  width:100%;text-align:left;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;
  border:1px solid var(--line);background:var(--cream);margin-bottom:8px;cursor:pointer;
  font-family:'Inter','Noto Sans',sans-serif;font-size:14px;font-weight:600;color:var(--choc);transition:background .15s ease,color .15s ease;
}
.admin-quick-action-btn:last-child{margin-bottom:0;}
.admin-quick-action-btn:hover{background:var(--berry);color:#fff;border-color:var(--berry);}
.admin-quick-action-btn .qa-icon{font-size:18px;line-height:1;}
@media (max-width:480px){
  .admin-fab{bottom:18px;right:16px;width:50px;height:50px;}
  .admin-quick-actions-panel{bottom:78px;right:12px;left:12px;width:auto;}
}
.sidebar-footer-btn{width:100%;justify-content:center;font-size:12.5px;}
.admin-main{flex:1;min-width:0;}
.mobile-menu-btn{
  display:none;background:var(--white);border:1px solid var(--line);border-radius:10px;
  padding:9px;color:var(--choc);cursor:pointer;margin-bottom:16px;box-shadow:var(--shadow-xs);
}
.admin-sidebar-overlay{display:none;}
@media (max-width:900px){
  .admin-shell{display:block;}
  .mobile-menu-btn{display:inline-flex;}
  .admin-sidebar{
    position:fixed;top:0;left:0;bottom:0;z-index:60;
    width:280px;height:auto;max-height:none;border-radius:0;border:none;box-shadow:var(--shadow-lg);
    transform:translateX(-100%);transition:transform .25s var(--ease);
    overflow-y:auto;
  }
  .admin-sidebar.open{transform:translateX(0);}
  .sidebar-close-btn{display:block;}
  .admin-sidebar-overlay{
    display:block;position:fixed;inset:0;background:rgba(59,42,40,0.4);z-index:55;
    opacity:0;pointer-events:none;transition:opacity .25s var(--ease);
  }
  .admin-sidebar-overlay.open{opacity:1;pointer-events:auto;}
}
.list-header{
  display:flex;align-items:center;flex-wrap:wrap;gap:14px;
  margin-bottom:18px;
}
.add-order-row{
  display:flex;justify-content:center;margin-bottom:28px;
}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-head h3{font-family:'Inter','Noto Sans',sans-serif;font-size:19px;font-weight:700;margin:0;color:var(--choc);}
.cal-nav{display:flex;gap:6px;}
.cal-nav button{
  width:32px;height:32px;border-radius:9px;border:1.5px solid var(--box-line);
  background:var(--white);cursor:pointer;font-size:15px;color:var(--choc);transition:all .15s var(--ease);
}
.cal-nav button:hover{border-color:var(--berry);color:var(--berry);}
.cal-shrink{max-width:640px;margin:0 auto;container-type:inline-size;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:22px;}
.cal-dow{
  text-align:center;font-size:11px;font-weight:700;color:var(--choc-soft);
  text-transform:uppercase;letter-spacing:.03em;padding-bottom:4px;
}
.cal-day{
  width:100%;aspect-ratio:1/1;box-sizing:border-box;background:var(--white);border:1.5px solid var(--line);
  border-radius:22%;padding:5%;cursor:pointer;position:relative;display:flex;flex-direction:column;
  transition:border-color .15s var(--ease), background .15s var(--ease);
}
.cal-day.empty{background:transparent;border:none;cursor:default;}
.cal-day.today{border-color:var(--gold);border-width:2px;}
.cal-day-vacation{background:repeating-linear-gradient(135deg,var(--box) 0 6px,#EAD4D4 6px 12px);opacity:.75;}
.cal-day-vacation .cal-daynum{color:var(--muted-red);}
.vacation-warning{
  background:#F3D3DE;color:var(--berry-deep);border-radius:12px;padding:10px 12px;
  font-size:13px;line-height:1.5;margin:-6px 0 14px;
}
.date-suggest-btn{
  background:var(--white);border:1.5px solid var(--berry-deep);color:var(--berry-deep);
  border-radius:14px;padding:2px 9px;font-size:12.5px;font-weight:600;cursor:pointer;
  margin:0 2px;
}
.cal-day.selected{border-color:var(--berry);border-width:2px;}
.cal-day:hover:not(.empty){border-color:var(--berry);}
.cal-daynum{font-size:clamp(8px, 4.2cqw, 15px);font-weight:700;color:var(--choc);}
.cal-day.has-orders .cal-daynum{color:#fff;}
.cal-order-count{
  font-size:clamp(11px, 5.5cqw, 20px);font-weight:800;color:#fff;
  margin-top:auto;align-self:center;line-height:1;
}

.day-panel{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:18px;}
.day-panel h3{font-family:'Noto Serif',serif;font-size:17px;margin:0 0 12px;text-transform:capitalize;}

.raw-msg{
  background:var(--cream);border:1px solid var(--line);border-radius:10px;
  padding:10px;font-size:12.5px;color:var(--choc-soft);white-space:pre-wrap;
  max-height:100px;overflow-y:auto;margin-top:4px;
}
.loading{text-align:center;padding:40px;color:var(--choc-soft);font-size:13.5px;}
.loading-logo{width:240px;height:240px;max-width:60vw;max-height:60vw;object-fit:contain;border-radius:50%;margin-bottom:22px;animation:loading-pulse 1.6s ease-in-out infinite;}
@keyframes loading-pulse{0%,100%{opacity:1;}50%{opacity:.55;}}

/* warehouse / prices shared sections */
.wh-section{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:24px;margin-top:28px;box-shadow:var(--shadow-sm);}
.wh-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.wh-head-left{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;}
.wh-head .section-title{margin:0;}
.wh-chevron{transition:transform .15s var(--ease);color:var(--choc-soft);flex-shrink:0;}
.wh-chevron.open{transform:rotate(180deg);}
.sub-section{}
.inner-block{margin-top:16px;}
.inner-block + .inner-block{margin-top:24px;padding-top:22px;border-top:1px solid var(--line);}
.subsection-title{font-family:'Noto Serif',serif;font-size:16px;font-weight:600;margin:0;color:var(--choc);}
.wh-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:18px;max-width:560px;}
@media (max-width:760px){ .wh-grid{grid-template-columns:1fr;} }
.wh-col h4{font-family:'Noto Serif',serif;font-size:14.5px;font-weight:600;margin:0 0 10px;color:var(--choc);}
.section-h4{font-family:'Noto Serif',serif;font-size:14.5px;font-weight:600;margin:0 0 10px;color:var(--choc);}
.wh-add-row{display:flex;gap:6px;margin-bottom:10px;}
.wh-add-row input{
  flex:1;border:1.5px solid var(--box-line);border-radius:10px;padding:7px 10px;
  font-size:13px;background:var(--cream);color:var(--choc);transition:border-color .15s var(--ease);
}
.wh-add-row input:focus{outline:none;border-color:var(--berry);}
.wh-add-row button{border-radius:10px;padding:7px 13px;}
.chip-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:8px;min-height:20px;}
.wh-empty{font-size:12px;color:var(--choc-soft);margin:0;}
.chip{
  display:flex;align-items:center;gap:5px;background:var(--box);border:1px solid var(--line);
  border-radius:16px;padding:5px 7px 5px 11px;font-size:12.5px;color:var(--choc);
  justify-content:space-between;
}
.chip-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
.chip-dot{width:11px;height:11px;border-radius:50%;border:1px solid rgba(0,0,0,0.15);flex-shrink:0;}
.chip-actions{display:flex;align-items:center;gap:1px;flex-shrink:0;}
.chip-x{
  border:none;background:transparent;color:var(--choc-soft);cursor:pointer;
  font-size:14px;line-height:1;padding:2px 4px;border-radius:50%;transition:all .15s var(--ease);
}
.chip-x:hover{background:rgba(184,53,95,0.15);color:var(--berry);}
.chip-eye{
  border:none;background:transparent;color:var(--choc-soft);cursor:pointer;
  font-size:12px;line-height:1;padding:2px 4px;border-radius:50%;transition:all .15s var(--ease);
  opacity:.65;
}
.chip-eye:hover{background:rgba(94,110,66,0.15);opacity:1;}
.chip.unavailable{background:var(--cream);border-style:dashed;opacity:.75;}
.chip.unavailable .chip-eye{opacity:1;color:var(--sage-deep);}

.vault-filter-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.vault-filter-btn{
  font-size:12px;font-weight:600;padding:7px 13px;border-radius:14px;
  border:1.5px solid var(--box-line);background:var(--white);color:var(--choc-soft);cursor:pointer;
  transition:all .15s var(--ease);
}
.vault-filter-btn.active{background:var(--berry);border-color:var(--berry);color:#fff;}
.vault-list{display:flex;flex-direction:column;gap:10px;}
.vault-card{
  background:var(--white);border:1px solid var(--line);border-radius:14px;padding:14px 16px;
  box-shadow:var(--shadow-xs);
}
.vault-card-head{display:flex;align-items:flex-start;gap:10px;}
.vault-card-icon{font-size:20px;flex-shrink:0;line-height:1.3;}
.vault-card-title{flex:1;min-width:0;}
.vault-card-type{font-size:10.5px;font-weight:700;color:var(--choc-soft);text-transform:uppercase;letter-spacing:.03em;}
.vault-card-desc{font-family:'Noto Serif',serif;font-size:14.5px;font-weight:600;color:var(--choc);margin-top:2px;word-break:break-word;}
.vault-card-actions{display:flex;gap:2px;flex-shrink:0;}
.vault-card-actions button{
  border:none;background:transparent;color:var(--choc-soft);cursor:pointer;
  font-size:14px;padding:4px 6px;border-radius:8px;transition:all .15s var(--ease);
}
.vault-card-actions button:hover{background:var(--cream);color:var(--berry);}
.vault-card-body{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--choc);}
.vault-card-body a{color:var(--berry-deep);word-break:break-all;}
.vault-card-image-preview{max-width:180px;max-height:140px;border-radius:10px;border:1px solid var(--line);display:block;cursor:pointer;}
.vault-card-row{display:flex;gap:6px;margin-top:4px;}
.vault-card-row span:first-child{color:var(--choc-soft);min-width:70px;flex-shrink:0;}
.vault-cred-mask{font-family:monospace;letter-spacing:1px;}
.vault-type-picker{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
.vault-type-tile{
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;
  border:1.5px solid var(--box-line);border-radius:12px;background:var(--cream);cursor:pointer;
  transition:all .15s var(--ease);
}
.vault-type-tile:hover{border-color:var(--berry);}
.vault-type-tile.selected{border-color:var(--berry);background:var(--berry);}
.vault-type-tile.selected .vault-type-label{color:#fff;}
.vault-type-icon{font-size:20px;}
.vault-type-label{font-size:10px;font-weight:600;color:var(--choc-soft);text-align:center;line-height:1.2;}
.wh-stock-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;
}
.wh-stock-row:last-child{border-bottom:none;}
.wh-stock-row input{
  width:70px;border:1.5px solid var(--box-line);border-radius:8px;padding:6px 8px;
  font-size:13px;text-align:center;background:var(--cream);color:var(--choc);
}
.wh-stock-row input:focus{outline:none;border-color:var(--berry);}
.price-input-wrap{display:flex;align-items:center;gap:5px;}
.price-input{
  width:78px;border:1.5px solid var(--box-line);border-radius:8px;padding:6px 8px;
  font-size:13px;text-align:right;background:var(--cream);color:var(--choc);
}
.price-input:focus{outline:none;border-color:var(--berry);}
.extra-row{
  border-bottom:1px solid var(--line);padding:10px 0;
}
.extra-row:last-child{border-bottom:none;}
.extra-row-top{
  display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;
}
.extra-row-name{font-size:13.5px;font-weight:600;color:var(--choc);word-break:break-word;}
.extra-row-prices{display:flex;flex-wrap:wrap;gap:14px;}
.extra-price-field{
  display:flex;align-items:center;gap:6px;font-size:12px;color:var(--choc-soft);
}
.price-eur{font-size:12.5px;color:var(--choc-soft);}

/* per-unit flavor/color pickers */
.unit-block{background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px;margin-bottom:10px;}
.product-group-label{
  font-family:'Noto Serif',serif;font-weight:600;font-size:13.5px;color:var(--berry-deep);
  text-transform:uppercase;letter-spacing:.04em;margin:4px 0 8px;
}
.product-divider{
  border:none;border-top:1.5px dashed var(--box-line);margin:20px 0;
}
.ticket-divider{
  border:none;border-top:1px dashed rgba(51,38,42,0.16);margin:6px 0;
}
.unit-title{font-family:'Noto Serif',serif;font-weight:600;font-size:13.5px;margin-bottom:8px;}
.combo-list{margin-top:10px;}
.combo-line{
  display:flex;align-items:center;gap:10px;padding:7px 2px;
  border-bottom:1px solid var(--line);font-size:13px;
}
.combo-line:last-child{border-bottom:none;}
.combo-line-label{color:var(--choc-soft);font-size:12px;min-width:64px;flex-shrink:0;}
.combo-line-text{color:var(--berry-deep);font-weight:700;flex:1;}
.chip-x-mini{
  border:none;background:transparent;color:var(--choc-soft);cursor:pointer;
  font-size:15px;line-height:1;padding:2px 6px;border-radius:50%;transition:all .15s var(--ease);
}
.chip-x-mini:hover{background:rgba(184,53,95,0.15);color:var(--berry);}
.pick-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--choc-soft);margin:6px 0 5px;}
.chip-picker{display:flex;flex-wrap:wrap;gap:6px;}
.pick-chip{
  border:1.5px solid var(--box-line);background:var(--white);color:var(--choc);
  border-radius:16px;padding:5px 12px;font-size:12.5px;cursor:pointer;transition:all .15s var(--ease);
}
.pick-chip:hover{border-color:var(--berry);}
.pick-chip.selected{background:var(--berry);border-color:var(--berry);color:#fff;}
.unit-result{margin-top:8px;font-size:12.5px;font-weight:600;color:var(--berry-deep);}
.qty-inline{width:80px;flex-shrink:0;}
.combo-hint{font-size:12px;color:var(--choc-soft);margin:4px 0 0;line-height:1.4;}
.extras-picker{margin-top:8px;display:flex;flex-direction:column;gap:2px;}
.size-toggle-row{display:flex;gap:14px;margin-bottom:2px;}
.size-toggle{
  display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:500;
  cursor:pointer;color:var(--choc);
}
.size-toggle input{width:auto;}
.extras-check-row{
  display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;
  border-bottom:1px solid var(--line);cursor:pointer;
}
.extras-check-row:last-child{border-bottom:none;}
.extras-check-row input{width:auto;flex-shrink:0;}
.extras-check-row span:first-of-type{flex:1;}
.extras-price{color:var(--berry-deep);font-weight:600;font-size:12px;white-space:nowrap;}

/* color bubbles */
.color-bubbles{display:flex;flex-wrap:wrap;gap:9px;}
.color-bubble{
  width:28px;height:28px;border-radius:50%;border:2px solid var(--box-line);
  cursor:pointer;padding:0;position:relative;flex-shrink:0;transition:border-color .15s var(--ease);
}
.color-bubble:hover{border-color:var(--choc-soft);}
.color-bubble.selected{border-color:var(--berry);box-shadow:0 0 0 2px var(--berry);}
.color-bubble.selected::after{
  content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--choc);font-size:13px;font-weight:700;text-shadow:0 0 3px rgba(255,255,255,0.9), 0 0 1px rgba(255,255,255,0.9);
}

/* quantity badges on ticket */
.qty-row{display:flex;gap:10px;margin:8px 0 2px;flex-wrap:wrap;}
.qty-badge{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--choc-soft);font-weight:600;}
.qty-badge svg{color:var(--berry);}

.price-hint-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:-6px 0 12px;font-size:12px;color:var(--choc-soft);}
.price-auto-btn{font-size:11.5px;background:none;border:none;color:var(--berry);cursor:pointer;font-weight:600;text-decoration:underline;padding:0;}

/* customer-facing order screen */
.customer-wrap{max-width:560px;}
.customer-back-link{
  display:block;background:none;border:none;cursor:pointer;
  font-family:'Inter','Noto Sans',sans-serif;font-weight:600;font-size:13.5px;color:var(--berry-deep);
  margin:0 auto 14px;padding:4px 0;
}
.customer-back-link:hover{text-decoration:underline;}
.customer-logo-wrap{display:flex;justify-content:center;margin-bottom:24px;}
.customer-logo{width:180px;height:180px;object-fit:contain;border-radius:50%;box-shadow:var(--shadow-sm);}
.customer-form-card{
  background:var(--white);border:1px solid var(--line);border-radius:22px;
  padding:30px 26px;box-shadow:var(--shadow-md);
}
.customer-title{
  font-family:'Noto Serif',serif;font-weight:600;font-size:24px;margin:0 0 4px;text-align:center;
}
.customer-ordernum{
  text-align:center;font-size:13px;color:var(--choc-soft);font-weight:600;margin:0 0 20px;
}
.thank-you-banner{
  background:#DCE6CC;color:var(--sage-deep);border-radius:12px;padding:12px 14px;
  font-size:13.5px;font-weight:500;margin-bottom:18px;line-height:1.5;
}
.customer-price-row{
  text-align:center;font-size:15px;color:var(--choc);margin:18px 0 14px;
  padding:12px;background:var(--cream);border-radius:12px;
}
.customer-footer{display:flex;justify-content:center;margin-top:18px;}
.payment-reminder-modal{max-width:380px;text-align:center;}
.payment-reminder-modal h2{margin-bottom:14px;font-family:'Inter','Noto Sans',sans-serif;font-weight:700;}
.payment-reminder-text{font-size:14px;line-height:1.6;margin:0 0 14px;color:var(--choc);}
.admin-link-btn{
  background:none;border:none;color:var(--choc-soft);font-size:12px;
  text-decoration:underline;cursor:pointer;padding:4px;
}
.login-card{max-width:360px;margin:0 auto;}

@media (max-width:480px){
  #app{padding:20px 14px 40px;}
  .customer-logo{width:130px;height:130px;}
  .customer-form-card{padding:22px 16px;}
  .customer-title{font-size:21px;}
  .row2{grid-template-columns:1fr;}
  .row3{grid-template-columns:1fr;}
}
@media (min-width:481px) and (max-width:820px){
  .customer-logo{width:170px;height:170px;}
}
.login-error{
  background:#F3D3DE;color:var(--berry-deep);border-radius:10px;padding:9px 12px;
  font-size:13px;margin:4px 0 14px;
}

/* ---------- Landing page (redesigned per brand brief: pastel, boutique, Instagram-friendly) ---------- */
.landing{
  --l-cream:#FFF9F3; --l-cream-dark:#F8EFE7;
  --l-pink:#F7C6D0; --l-pink-light:#FCECEF;
  --l-blue:#BBDDE8; --l-blue-light:#EAF6F8;
  --l-yellow:#F7E5B5; --l-yellow-light:#FFF8E5;
  --l-lavender:#DCCBE8; --l-lavender-light:#F5F0F8;
  --l-text:#4B3A40; --l-text-soft:#806F75;
  --l-primary:#D96A8A; --l-primary-dark:#C55677;
  --l-white:#FFFFFF;
  background:var(--l-cream);color:var(--l-text);min-height:100vh;
  font-family:'Inter','Noto Sans',sans-serif;
}
@media (max-width:759px){.landing{padding-bottom:66px;}}

/* Shared pill CTA button, used everywhere on the landing page */
.landing-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--l-primary);color:#fff;font-family:'Inter','Noto Sans',sans-serif;font-weight:600;font-size:14.5px;
  padding:13px 30px;border:none;border-radius:999px;cursor:pointer;min-height:44px;box-sizing:border-box;
  box-shadow:0 4px 14px rgba(217,106,138,0.28);text-decoration:none;white-space:nowrap;
  transition:background .2s ease,transform .2s ease,box-shadow .2s ease;
}
.landing-btn:hover{background:var(--l-primary-dark);transform:translateY(-2px);box-shadow:0 8px 20px rgba(197,86,119,0.32);}
.landing-btn:active{transform:translateY(0);}
@media (prefers-reduced-motion:reduce){.landing-btn:hover{transform:none;}}

/* Header / nav */
.landing-header{
  position:sticky;top:0;z-index:40;background:rgba(255,249,243,0.9);backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(75,58,64,0.08);
}
.landing-header-inner{max-width:1220px;margin:0 auto;padding:13px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px;}
.landing-header-logo{display:flex;align-items:center;gap:10px;}
.landing-header-logo img{width:40px;height:40px;border-radius:50%;object-fit:cover;}
.landing-header-logo span{font-family:'Noto Serif',serif;font-weight:600;font-size:17px;color:var(--l-text);}
.landing-nav{display:none;align-items:center;gap:30px;}
.landing-nav a{font-family:'Inter','Noto Sans',sans-serif;font-size:14px;font-weight:500;color:var(--l-text-soft);text-decoration:none;transition:color .2s ease;}
.landing-nav a:hover{color:var(--l-primary);}
.landing-header-cta{display:none;}
.landing-hamburger{display:flex;align-items:center;justify-content:center;width:40px;height:40px;background:none;border:none;cursor:pointer;flex-direction:column;gap:5px;}
.landing-hamburger span{width:21px;height:2px;background:var(--l-text);border-radius:2px;}
.landing-mobile-menu{max-width:1220px;margin:0 auto;padding:0 24px 18px;display:flex;flex-direction:column;gap:4px;}
.landing-mobile-menu a{font-family:'Inter','Noto Sans',sans-serif;font-size:15px;font-weight:500;color:var(--l-text);text-decoration:none;padding:9px 0;}
.landing-mobile-menu .landing-btn{align-self:flex-start;margin-top:8px;}
@media (min-width:860px){
  .landing-nav{display:flex;}
  .landing-header-cta{display:inline-flex;}
  .landing-hamburger{display:none;}
}

/* Soft decorative background shapes (replaces the old dark swirl blob) */
.landing-bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
.landing-deco{position:absolute;opacity:0.55;animation:landing-deco-float 8s ease-in-out infinite;}
.landing-deco.pos-1{top:9%;right:6%;width:64px;animation-delay:0s;}
.landing-deco.pos-2{top:26%;left:4%;width:46px;animation-delay:1.1s;}
.landing-deco.pos-3{top:52%;right:9%;width:56px;animation-delay:2.2s;}
.landing-deco.pos-4{top:76%;left:7%;width:40px;animation-delay:.5s;}
.landing-deco.pos-5{top:38%;right:24%;width:32px;animation-delay:1.7s;}
@keyframes landing-deco-float{0%,100%{transform:translateY(0);}50%{transform:translateY(-14px);}}
@media (prefers-reduced-motion:reduce){.landing-deco{animation:none;}}

/* Hero */
@keyframes landing-fade-up{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.landing-hero{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:24px 24px 64px;}
.landing-logo{width:64px;height:64px;border-radius:50%;object-fit:cover;box-shadow:0 4px 14px rgba(75,58,64,0.12);margin-bottom:18px;}
.landing-hero-label{
  display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.85);color:var(--l-primary-dark);
  font-family:'Inter','Noto Sans',sans-serif;font-weight:600;font-size:12px;letter-spacing:0.03em;
  padding:6px 16px;border-radius:999px;margin-bottom:16px;
}
.landing-title{font-family:'Dancing Script','Noto Serif',cursive,serif;font-weight:700;font-size:clamp(34px,6vw,56px);line-height:1.25;letter-spacing:0;margin:0 0 16px;color:#5C3A21;}
.landing-subtitle{font-family:'Dancing Script','Noto Serif',cursive,serif;font-weight:600;font-size:22px;line-height:1.4;color:var(--l-text-soft);margin:0 0 24px;}
.landing-hero-tagline{font-family:'Inter','Noto Sans',sans-serif;font-size:13px;color:var(--l-text-soft);margin:16px 0 0;}

/* Text-only hero (no photo set yet) — plain centered layout */
.landing-hero-text-only{max-width:560px;margin:0 auto;text-align:center;animation:landing-fade-up .5s ease both;}
@media (prefers-reduced-motion:reduce){.landing-hero-text-only{animation:none;}}

/* Photo-banner hero — full section width, text overlaid on top of the image.
   Text color defaults to white (readable against the dark gradient scrim);
   JS measures the image's average brightness after it loads and adds
   .text-dark here if the photo turns out to be light overall. */
.landing-hero-banner{
  position:relative;width:100%;min-height:440px;border-radius:32px;overflow:hidden;
  box-shadow:0 20px 44px rgba(75,58,64,0.16);display:flex;align-items:flex-end;
  animation:landing-fade-up .5s ease both;
}
@media (prefers-reduced-motion:reduce){.landing-hero-banner{animation:none;}}
.landing-hero-banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;}
.landing-hero-banner::after{
  content:'';position:absolute;inset:0;z-index:1;
  background:linear-gradient(180deg, rgba(20,12,10,0.08) 0%, rgba(20,12,10,0.32) 55%, rgba(20,12,10,0.6) 100%);
}
.landing-hero-overlay{position:relative;z-index:2;padding:40px 32px;max-width:600px;width:100%;box-sizing:border-box;text-align:center;margin:0 auto;}
.landing-hero-banner .landing-title,
.landing-hero-banner .landing-subtitle,
.landing-hero-banner .landing-hero-tagline{color:#fff;text-shadow:0 2px 14px rgba(0,0,0,0.28);}
.landing-hero-banner.text-dark .landing-title,
.landing-hero-banner.text-dark .landing-hero-tagline{color:#3A2A1E;text-shadow:none;}
.landing-hero-banner.text-dark .landing-subtitle{color:#5C4A42;text-shadow:none;}
.landing-hero-banner.text-dark::after{
  background:linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.25) 55%, rgba(255,255,255,0.55) 100%);
}
@media (min-width:760px){.landing-hero-banner{min-height:520px;}}
@media (max-width:759px){
  .landing-hero-banner{min-height:300px;}
  .landing-hero-overlay{padding:28px 22px;}
}
@media (max-width:759px){
  .landing-hero-overlay #landingOrderBtn{display:flex;width:fit-content;margin-left:auto;margin-right:auto;}
}

/* Scroll-triggered reveal — sections/cards fade + rise into place once as
   they first enter the viewport (never replays on repeat scroll). */
.landing-reveal{opacity:0;transform:translateY(26px);transition:opacity .65s cubic-bezier(.2,.8,.2,1),transform .65s cubic-bezier(.2,.8,.2,1);}
.landing-reveal.in-view{opacity:1;transform:translateY(0);}
.landing-why-card.landing-reveal:nth-child(1){transition-delay:0s;}
.landing-why-card.landing-reveal:nth-child(2){transition-delay:.09s;}
.landing-why-card.landing-reveal:nth-child(3){transition-delay:.18s;}
.landing-why-card.landing-reveal:nth-child(4){transition-delay:.27s;}
@media (prefers-reduced-motion:reduce){.landing-reveal{opacity:1;transform:none;transition:none;}}

/* Intro / about card */
.landing-intro{position:relative;z-index:1;padding:16px 24px 64px;}
.landing-intro-inner{
  max-width:1040px;margin:0 auto;background:var(--l-white);border-radius:32px;padding:40px 28px;
  box-shadow:0 10px 30px rgba(75,58,64,0.08);display:flex;flex-direction:column;gap:26px;align-items:center;text-align:center;
}
.landing-intro-text{max-width:440px;}
.landing-intro-title{font-family:'Noto Serif',serif;font-weight:600;font-size:24px;color:var(--l-text);margin:0 0 14px;line-height:1.28;}
.landing-intro-text p{font-family:'Inter','Noto Sans',sans-serif;font-size:15px;line-height:1.75;color:var(--l-text-soft);margin:0 0 22px;white-space:pre-line;}
.landing-intro-photo{
  width:min(86vw,340px);aspect-ratio:4/3;border-radius:26px;overflow:hidden;
  box-shadow:0 12px 28px rgba(75,58,64,0.12);background:var(--l-pink-light);
}
.landing-intro-photo img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .22s ease;cursor:zoom-in;}
@media (min-width:820px){.landing-intro-inner{flex-direction:row-reverse;text-align:left;justify-content:space-between;gap:48px;padding:50px 54px;}}

/* Section heading helper (shared by Why Us / Products / Occasions / Gallery) */
.landing-section-title{font-family:'Noto Serif',serif;font-weight:600;font-size:25px;text-align:center;color:var(--l-text);margin:0 0 10px;}
.landing-section-subtitle{font-family:'Inter','Noto Sans',sans-serif;font-size:14.5px;text-align:center;color:var(--l-text-soft);max-width:460px;margin:0 auto 34px;}

/* Why choose us */
.landing-why{position:relative;z-index:1;padding:8px 24px 64px;max-width:1100px;margin:0 auto;}
.landing-why-grid{display:grid;grid-template-columns:1fr;gap:16px;}
.landing-why-card{background:var(--l-white);border-radius:22px;padding:26px 22px;text-align:center;box-shadow:0 6px 16px rgba(75,58,64,0.06);transition:transform .22s ease,box-shadow .22s ease;}
.landing-why-card:hover{transform:translateY(-4px);box-shadow:0 12px 24px rgba(75,58,64,0.1);}
.landing-why-card .icon-wrap{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:23px;margin:0 auto 14px;}
.landing-why-card:nth-child(1) .icon-wrap{background:var(--l-pink-light);}
.landing-why-card:nth-child(2) .icon-wrap{background:var(--l-blue-light);}
.landing-why-card:nth-child(3) .icon-wrap{background:var(--l-yellow-light);}
.landing-why-card:nth-child(4) .icon-wrap{background:var(--l-lavender-light);}
.landing-why-card h3{font-family:'Noto Serif',serif;font-size:16px;font-weight:600;margin:0 0 8px;color:var(--l-text);}
.landing-why-card p{font-family:'Inter','Noto Sans',sans-serif;font-size:13.5px;line-height:1.55;color:var(--l-text-soft);margin:0;}
@media (min-width:640px){.landing-why-grid{grid-template-columns:repeat(2,1fr);}}
@media (min-width:960px){.landing-why-grid{grid-template-columns:repeat(4,1fr);}}
.landing-testimonial-card{display:flex;flex-direction:column;align-items:center;}
.landing-testimonial-quote{font-family:'Noto Serif',serif;font-size:34px;line-height:1;color:var(--l-pink-light, #F7C6D0);margin:0 0 2px;}
.landing-testimonial-stars{color:var(--gold,#C9932E);font-size:15px;letter-spacing:2px;margin:0 0 10px;}
.landing-testimonial-text{font-style:italic;}
.landing-testimonial-name{margin-top:12px !important;}

/* Products */
.landing-products{position:relative;z-index:1;padding:8px 24px 64px;max-width:1100px;margin:0 auto;}
.landing-products-grid{display:flex;flex-direction:column;gap:20px;}
.landing-product-card{background:var(--l-white);border-radius:24px;overflow:hidden;box-shadow:0 6px 16px rgba(75,58,64,0.07);transition:transform .22s ease,box-shadow .22s ease;}
.landing-product-card:hover{transform:translateY(-4px);box-shadow:0 14px 26px rgba(75,58,64,0.12);}
.landing-product-photo{width:100%;aspect-ratio:4/3;background:var(--l-pink-light);overflow:hidden;}

<!-- firebase-auth-compat.js used to be a third blocking <script src> tag right

<script>
  // Firebase config for this shop's project (safe to expose publicly - access is
  // controlled by Firestore security rules, not by keeping this key secret)
  const firebaseConfig = {

    authDomain: "torto-uzsakymas.firebaseapp.com",

    appId: "1:741595549793:web:e9c7dc3e4cfc3c5d3e5a20"
  };
  firebase.initializeApp(firebaseConfig);
  const fsDb = firebase.firestore();
  // order documents are now written directly as JS objects (not JSON-stringified
  // like the rest of appData), so tolerate stray `undefined` fields the way
  // JSON.stringify used to (it silently dropped them) instead of throwing
  fsDb.settings({ ignoreUndefinedProperties: true });
  // firebase-auth-compat.js is no longer a blocking <script> tag (see the
  // comment above the <script src> tags) - it's fetched dynamically instead,
  // so `fbAuth` starts out null and only becomes usable once that fetch

  let fbAuth = null;

  const ADMIN_EMAIL_DOMAIN = 'saldusaldu-admin.local'; // usernames are turned into fake emails for Firebase Auth
  const FS_COLLECTION = 'appData';

  // NOTE: EmailJS was used here previously (order notification, order
  // confirmation, message/inbox replies). All email sending has since moved
  // to a small script running on a home server, which polls the
  // "outgoingEmails" Firestore collection and sends over SMTP through the
  // business's own mailbox - see email_to_firestore.py. This removed the
  // EmailJS template-count limits and the ~700KB of extra JS every visitor

  // Drop-in replacement for the Claude-artifact-only `window.storage` API,
  // backed by Firestore instead, so the rest of the app (which only ever
  // calls window.storage.get/set with this exact shape) needs no changes.
  window.storage = {
    async get(key, shared){
      const snap = await fsDb.collection(FS_COLLECTION).doc(key).get();
      if(!snap.exists) return null;
      const data = snap.data();
      return { key, value: data.value, shared: !!shared };
    },
    async set(key, value, shared){
      await fsDb.collection(FS_COLLECTION).doc(key).set({ value, updatedAt: Date.now() });
      return { key, value, shared: !!shared };
    },
    async delete(key, shared){
      await fsDb.collection(FS_COLLECTION).doc(key).delete();
      return { key, deleted:true, shared: !!shared };
    },
    async list(prefix, shared){
      const snap = await fsDb.collection(FS_COLLECTION).get();
      const keys = [];
      snap.forEach(d=>{ if(!prefix || d.id.startsWith(prefix)) keys.push(d.id); });
      return { keys, prefix, shared: !!shared };

  // Measures the hero photo's average brightness (via an offscreen canvas,
  // downsampled to a tiny grid for speed) and toggles .text-dark on the
  // banner so the overlaid title/subtitle/button always stay readable,
  // regardless of whether the photo is mostly light or mostly dark.
  // On narrow (mobile) screens, shrinks the hero title's font-size just
  // enough to fit on a single line — the title text is admin-editable and
  // can be any length, so a fixed CSS size can't guarantee this by itself.
  // Desktop is left completely untouched (function returns immediately).
  function fitHeroTitleToOneLine(){
    const title = document.querySelector('.landing-title');
    if(!title) return;
    if(window.innerWidth >= 760){
      title.style.whiteSpace = '';
      return;
    }
    const container = title.closest('.landing-hero-overlay, .landing-hero-text-only');
    if(!container) return;
    const shrink = ()=>{
      title.style.whiteSpace = 'nowrap';
      title.style.fontSize = ''; // start from the CSS/admin-configured size each time
      let fontSize = parseFloat(window.getComputedStyle(title).fontSize);
      const minSize = 16;
      // clientWidth includes the container's own padding, but that padding
      // isn't available space for the title's text — subtract it, or the
      // loop stops shrinking before the text actually clears the padded
      // edges and still visually overflows.
      const cs = window.getComputedStyle(container);
      const availableWidth = container.clientWidth - parseFloat(cs.paddingLeft||0) - parseFloat(cs.paddingRight||0);
      let guard = 0;
      while(title.scrollWidth > availableWidth && fontSize > minSize && guard < 80){
        fontSize -= 1;
        title.style.fontSize = fontSize + 'px';
        guard++;

    if(document.fonts && document.fonts.load){

  function applyHeroBannerTextColor(){
    const banner = document.getElementById('landingHeroBanner');
    const img = document.getElementById('landingHeroBannerImg');
    if(!banner || !img) return;
    const analyze = ()=>{
      try{
        const w = 24, h = 24;
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const data = ctx.getImageData(0, 0, w, h).data;
        let total = 0, count = 0;
        for(let i=0;i<data.length;i+=4){
          total += 0.299*data[i] + 0.587*data[i+1] + 0.114*data[i+2];
          count++;
        }
        const avgBrightness = total / count;
        // Higher threshold than a plain 128 midpoint — the gradient scrim
        // already darkens the lower portion where the text sits, so only
        // switch to dark text once the photo is clearly light overall.
        banner.classList.toggle('text-dark', avgBrightness > 165);
      }catch(e){
        // Canvas read can fail (e.g. tainted by a non-data-URL image) —
        // silently keep the default white text, which stays legible thanks
        // to the gradient scrim regardless of the photo's actual colors.
      }
    };
    if(img.complete && img.naturalWidth) analyze();
    else img.addEventListener('load', analyze, {once:true});
  }

  function setupLandingReveal(){
    const els = document.querySelectorAll('.landing-reveal');
    if(!els.length) return;
    if(!('IntersectionObserver' in window)){
      els.forEach(el=>el.classList.add('in-view'));
      return;
    }
    const observer = new IntersectionObserver((entries)=>{
      entries.forEach(entry=>{
        if(entry.isIntersecting){
          const key = entry.target.dataset.revealKey;
          if(key) landingRevealedKeys.add(key);
          entry.target.classList.add('in-view');
          observer.unobserve(entry.target);
        }
      });
    }, {threshold:0.15, rootMargin:'0px 0px -40px 0px'});
    els.forEach(el=>{
      const key = el.dataset.revealKey;
      if(key && landingRevealedKeys.has(key)) el.classList.add('in-view');
      else observer.observe(el);
    });
  }

  // incomingEmails documents can be written by an external script (not this
  // app), so "receivedAt" might come in as a plain ISO string (this app's
  // usual convention) OR as a native Firestore Timestamp object (has a
  // .toDate() method, or {seconds, nanoseconds} shape). Normalizing here,
  // once, means the rest of the app can always treat it as a plain string.
  function normalizeIncomingEmail(docId, data){
    const out = Object.assign({id: docId}, data);
    const r = out.receivedAt;
    if(r && typeof r === 'object'){
      if(typeof r.toDate === 'function'){
        out.receivedAt = r.toDate().toISOString();
      } else if(typeof r.seconds === 'number'){
        out.receivedAt = new Date(r.seconds*1000).toISOString();
      } else {
        out.receivedAt = '';
      }
    } else if(typeof r !== 'string'){
      out.receivedAt = '';
    }
    return out;
  }

  function migrateCakeArr(arr, legacyQty){
    const src = (arr && arr.length) ? arr : (legacyQty ? Array.from({length:legacyQty}, ()=>({})) : []);
    return src.map(unit=>{
      let combos = [];
      if(unit.combos && unit.combos.length) combos = unit.combos.filter(c=>c.flavor||c.color).map(c=>({flavor:c.flavor||'', color:c.color||''}));
      else if(unit.flavor || unit.color) combos = [{flavor:unit.flavor||'', color:unit.color||''}];
      let decorIds = [];
      if(Array.isArray(unit.decorIds)) decorIds = unit.decorIds.slice();
      else if(unit.decorId) decorIds = [unit.decorId];
      return {combos, draftFlavor:'', draftColor:'', decorEnabled: !!unit.decorEnabled, decorIds};
    });
  }
  function migrateOrder(o){
    o = Object.assign({}, o);
    const statusMap = {
      naujas:'aktyvus', patvirtintas:'aktyvus', gaminamas:'aktyvus',
      paruostas:'pagaminta', atiduotas:'ivykdyta', atsauktas:'ivykdyta'
    };
    if(statusMap[o.status]) o.status = statusMap[o.status];
    if(!STATUS_ORDER.includes(o.status)) o.status = 'aktyvus';

    o.largeCakes = migrateCakeArr(o.largeCakes, o.qtyLarge);
    o.smallCakes = migrateCakeArr(o.smallCakes, o.qtySmall);

    o.jarQtyLarge = (o.jarQtyLarge!==undefined) ? o.jarQtyLarge : (o.jarQty!==undefined ? o.jarQty : (o.qtyJars || 0));
    o.jarQtySmall = (o.jarQtySmall!==undefined) ? o.jarQtySmall : 0;
    o.jarLargeCombos = (o.jarLargeCombos && o.jarLargeCombos.length)
      ? o.jarLargeCombos.filter(c=>c.flavor||c.color).map(c=>({flavor:c.flavor||'', color:c.color||''}))
      : [];
    o.jarSmallCombos = (o.jarSmallCombos && o.jarSmallCombos.length)
      ? o.jarSmallCombos.filter(c=>c.flavor||c.color).map(c=>({flavor:c.flavor||'', color:c.color||''}))
      : [];
    delete o.jarGroups; delete o.jarQty; delete o.jarSize; delete o.jarCombos;
    delete o.jarDraftFlavor; delete o.jarDraftColor;
    delete o.jarLargeDraftQty; delete o.jarSmallDraftQty;
    o.jarLargeDraftFlavor=''; o.jarLargeDraftColor='';

    return o;

        const snap = await fsDb.collection('orders').get();
        const migrated = await migrateBlobToCollectionIfEmpty('orders', 'orders', snap);
        orders = (migrated || snap.docs.map(d=>d.data())).map(migrateOrder);
        if(orders.length) clearStaleLegacyBlob('orders');
        // Live sync: after the initial load, keep listening for changes made from
        // any device/session (e.g. deleting an order on the phone) so the admin
        // screen updates automatically, without needing a manual page refresh.
        if(ordersUnsubscribe) ordersUnsubscribe();
        try{
          ordersUnsubscribe = fsDb.collection('orders').onSnapshot(liveSnap=>{
            orders = liveSnap.docs.map(d=>d.data()).map(migrateOrder);
            renderIfNotTyping();
          }, err=>console.error('Nepavyko sinchronizuoti užsakymų realiu laiku', err));

        // numbering continues where it left off (admin session only, since
        // that's the only place the full order list is loaded)
        if(!isCustomerMode && orders.length){

          orders.forEach(o=>{ if(o.orderNumber && o.orderNumber > max) max = o.orderNumber; });

    // preview only (shown before the order is actually submitted) - the
    // authoritative number is assigned atomically by claimNextOrderNumber()
    // at the moment an order is actually created, so two people submitting
    // at once can never end up with the same number
    return (orderCounterCache||0) + 1;
  }
  async function claimNextOrderNumber(){
    const ref = fsDb.collection('appData').doc('orderCounter');
    const next = await fsDb.runTransaction(async tx=>{
      const snap = await tx.get(ref);
      const current = (snap.exists && typeof snap.data().value === 'number') ? snap.data().value : 0;
      const n = current + 1;
      tx.set(ref, {value: n, updatedAt: Date.now()});
      return n;
    });
    orderCounterCache = next;
    return next;
  }

  // one-time migration: orders/invoices/expenses used to live as a single
  // JSON blob under appData/<key>. If the new per-document collection is
  // still empty, pull that old blob (if any) and copy each item into its
  // own document, so existing history isn't silently hidden by the switch.
  let clearedLegacyBlobs = {};
  async function clearStaleLegacyBlob(blobKey){
    // Only attempt this once per blob per page session - no need to keep
    // re-writing an already-empty key on every load.
    if(clearedLegacyBlobs[blobKey]) return;
    clearedLegacyBlobs[blobKey] = true;
    try{
      const res = await window.storage.get(blobKey, true);
      if(res && res.value){
        let parsed = [];
        try{ parsed = JSON.parse(res.value); }catch(e2){}
        if(Array.isArray(parsed) && parsed.length){
          await window.storage.set(blobKey, JSON.stringify([]), true);
        }
      }
    }catch(e){}
  }

  async function migrateBlobToCollectionIfEmpty(blobKey, collectionName, snap){
    if(!snap.empty) return null;
    try{
      const blobRes = await window.storage.get(blobKey, true);
      const items = (blobRes && blobRes.value) ? JSON.parse(blobRes.value) : [];
      if(!Array.isArray(items) || !items.length) return null;
      for(let i=0; i<items.length; i+=450){
        const chunk = items.slice(i, i+450);
        const batch = fsDb.batch();
        chunk.forEach(item=>{
          if(!item.id) item.id = uid();
          batch.set(fsDb.collection(collectionName).doc(item.id), item);
        });
        await batch.commit();
      }
      // Clear the old blob now that everything has been copied into the new
      // per-document collection - otherwise, if the collection is ever emptied
      // again later (e.g. the user deletes every item), this function would see
      // an "empty" collection and re-import the stale blob, resurrecting
      // records the user had deliberately deleted.
      try{ await window.storage.set(blobKey, JSON.stringify([]), true); }catch(e2){}
      return items;
    }catch(e){
      console.error('Nepavyko perkelti senų duomenų: '+collectionName, e);
      return null;
    }
  }

  async function storageSetWithRetry(key, value, attempts){
    attempts = attempts || 3;
    let lastErr;
    for(let i=0; i<attempts; i++){
      try{ await window.storage.set(key, value, true); return; }
      catch(e){ lastErr = e; if(i < attempts-1){ await new Promise(r=>setTimeout(r, 400*(i+1))); } }
    }
    throw lastErr;
  }

  // Preliminarus individualios veiklos GPM ir "Sodros" (VSD+PSD) skaičiavimas,
  // pagal 2026 m. Lietuvos mokesčių tvarką. Naudoja tą pačią pajamų/išlaidų
  // sumą, kurią skaičiuoja computeFinancialReport() (Apskaitos/Žurnalo tabuose).
  // SVARBU: tai tik APYTIKSLIS skaičiavimas - žr. disclaimeris UI. Neatsižvelgia
  // į: kitas asmens pajamas (darbo užmokestį ir pan., kurios virš 42 500 EUR MIVAP
  // ribos susumuojamos į bendrą progresinę GPM skalę), VSD/PSD minimalias/
  // maksimalias įmokų bazes, NPD, vaiko mokesčio kreditą ir kitas individualias
  // aplinkybes.
  function computeIndividualVeiklaTax(year, use30PercentDeduction, includeSodra){
    const start = `${year}-01-01`, end = `${year}-12-31`;
    const report = computeFinancialReport(start, end);
    const income = report.totalIncome;
    const expenses = use30PercentDeduction ? Math.round(income*0.30*100)/100 : report.totalExpenses;
    const mivap = Math.max(0, Math.round((income-expenses)*100)/100);

    let gpm = 0;
    let overLimit = false;
    if(mivap <= 20000){
      gpm = mivap * 0.05;
    } else if(mivap <= 42500){
      const pmk = mivap * (0.10 - (2/300000) * (mivap - 20000));
      gpm = mivap*0.15 - Math.max(0, pmk);
    } else {
      overLimit = true;
      gpm = 42500 * 0.15; // riba, kur kreditas jau = 0; virš šios sumos GPM priklauso nuo bendrų metinių pajamų (žr. įspėjimą UI)
    }
    gpm = Math.round(gpm*100)/100;

    const sodra = includeSodra ? Math.round(mivap*0.90*(0.1252+0.0698)*100)/100 : 0;

    return {
      year, income, expenses, mivap, gpm, sodra,
      total: Math.round((gpm+sodra)*100)/100,
      overLimit, overLimitAmount: overLimit ? Math.round((mivap-42500)*100)/100 : 0,
    };
  }

  // Looks up a code (discount % or gift coupon) and returns its current status.
  // status: 'not_found' | 'used' | 'valid'
  function lookupDiscountCode(codeRaw){
    const code = (codeRaw||'').trim().toUpperCase();
    if(!code) return {status:'not_found'};
    const disc = discountCodes.find(d=>d.code.toUpperCase()===code);
    if(disc){
      if(!disc.multiUse && disc.usedBy && disc.usedBy.length>0) return {status:'used', kind:'discount', ref:disc};
      return {status:'valid', kind:'discount', percent:disc.percent, ref:disc};
    }
    const gift = giftCoupons.find(g=>g.code.toUpperCase()===code);
    if(gift){
      if(gift.used) return {status:'used', kind:'gift', ref:gift};
      return {status:'valid', kind:'gift', amount:gift.amount, ref:gift};
    }
    return {status:'not_found'};
  }

  function applyDiscountToPrice(basePrice, lookup){
    if(!lookup || lookup.status!=='valid') return basePrice;
    if(lookup.kind==='discount') return Math.max(0, Math.round(basePrice*(1-lookup.percent/100)*100)/100);
    if(lookup.kind==='gift') return Math.max(0, Math.round((basePrice-lookup.amount)*100)/100);
    return basePrice;
  }

  // Display formatting only - the underlying stored value stays a plain
  // integer (used for max-tracking / sorting), these just control how the
  // number is shown to people: invoices as "SP0001", orders as "0001".
  //
  // The series is snapshotted onto EACH invoice at the moment it's issued
  // (see the `series:` field set alongside `invoiceNumber` when an invoice
  // is created) rather than read live from settings, so changing the series
  // later never rewrites the series shown on invoices already issued - only
  // new ones pick up the new value. Invoices created before this feature
  // existed have no stored series, so they fall back to the literal 'SP'
  // that was hardcoded at the time - never to today's current setting.
  function formatInvoiceNumber(inv){
    const series = (inv && inv.series) || 'SP';
    const n = (inv && inv.invoiceNumber) || 0;
    return `${series}${String(n).padStart(4,'0')}`;
  }

  // ---- Backup: export everything currently loaded in memory (which mirrors
  // Firestore live) into one downloadable JSON file, and restore from such
  // a file back into Firestore. ----
  async function downloadBackup(){
    const backup = {
      version: 1,
      exportedAt: new Date().toISOString(),
      collections: { orders, invoices, expenses, messages, reviews, vaultItems },
      appData: {
        warehouse, prices, costComponents, discountCodes, giftCoupons, offers: offersList, landingFaq: landingFaqList, emailTemplates,
        extras: extrasList, decors: decorsList, expenseCategories,
        vacations, orderSettings, orderCounter: orderCounterCache,
        sidebarNavOrder: navOrder,
      },
    };
    const dateStr = new Date().toISOString().slice(0,10);
    const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;

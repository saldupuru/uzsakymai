<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Saldu Puru - Cukraus vatos skanėstai</title>
<meta property="og:title" content="Užsakymo forma">
<meta property="og:description" content="Saldų Puru — užsisakykite tortus ir cukraus vatos indelius internetu.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://saldupuru.lt/#uzsakymas">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#B8355F">
<link rel="apple-touch-icon" href="./icon-192.png">
</head>
<body>
<div id="app"></div>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Noto+Serif:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --cream:#FBF7F1;
  --box:#F4EBDD;
  --box-line:#E6D9C3;
  --choc:#33262A;
  --choc-soft:#7A6B66;
  --berry:#B8355F;
  --berry-deep:#8E2748;
  --sage:#7C8F5A;
  --sage-deep:#5E6E42;
  --gold:#C9932E;
  --muted-red:#A64B4B;
  --white:#FFFFFF;
  --line:rgba(51,38,42,0.10);
  --shadow-xs:0 1px 2px rgba(51,38,42,0.05);
  --shadow-sm:0 2px 8px rgba(51,38,42,0.06);
  --shadow-md:0 8px 24px rgba(51,38,42,0.10);
  --shadow-lg:0 20px 48px rgba(51,38,42,0.16);
  --ease:cubic-bezier(.2,.8,.2,1);
}

html{scrollbar-gutter:stable;}
*{box-sizing:border-box;}
#app{
  font-family:'Inter',sans-serif;
  color:var(--choc);
  background:var(--cream);
  min-height:100vh;
  padding:32px 20px 60px;
  -webkit-font-smoothing:antialiased;
  display:flex;
  flex-direction:column;
}
#app.app-centered{justify-content:center;}

.wrap{max-width:1180px;margin:0 auto;}

/* header */
.header{display:flex;align-items:center;gap:14px;margin-bottom:32px;flex-wrap:wrap;}
.header svg{flex-shrink:0;}
.header-logo{width:80px;height:80px;object-fit:contain;border-radius:50%;flex-shrink:0;box-shadow:var(--shadow-sm);}
@media (max-width:640px){
  .header{flex-direction:column;align-items:center;text-align:center;gap:10px;}
  .header-logo{width:100px;height:100px;}
  .header h1{font-size:22px;}
  .header .btn{margin-left:0 !important;width:100%;max-width:300px;font-size:12px;padding:9px 10px;}
}
.header h1{font-family:'Fraunces','Noto Serif',serif;font-weight:600;font-size:29px;margin:0;letter-spacing:-0.015em;}
.header p{margin:3px 0 0;color:var(--choc-soft);font-size:14px;}

/* layout */
.layout{
  display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start;
  isolation:isolate;
}
@media (max-width:880px){ .layout{grid-template-columns:1fr;} }

/* panel (sidebar) */
.panel{
  background:var(--white);border-radius:18px;border:1px solid var(--line);
  padding:22px;position:relative;z-index:1;box-shadow:var(--shadow-sm);
}
@media (min-width:881px){ .panel{position:sticky;top:20px;} }
.panel h2{font-family:'Fraunces','Noto Serif',serif;font-size:18px;font-weight:600;margin:0 0 4px;}
.panel .hint{font-size:12.5px;color:var(--choc-soft);margin:0 0 14px;line-height:1.5;}
textarea.paste{
  width:100%;min-height:100px;border:1.5px dashed var(--box-line);border-radius:12px;
  padding:10px 12px;font-family:'Inter',sans-serif;font-size:13.5px;resize:vertical;
  background:var(--cream);color:var(--choc);transition:border-color .15s var(--ease);
}
textarea.paste:focus{outline:none;border-color:var(--berry);border-style:solid;}

.btn{
  font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;border:none;
  border-radius:10px;padding:10px 16px;cursor:pointer;
  transition:transform .12s var(--ease), box-shadow .15s var(--ease), background .15s var(--ease), color .15s var(--ease), border-color .15s var(--ease);
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--berry);color:#fff;box-shadow:0 4px 12px rgba(184,53,95,0.28);}
.btn-primary:hover{background:var(--berry-deep);box-shadow:0 6px 16px rgba(184,53,95,0.34);}
.btn-ghost{background:transparent;color:var(--choc);border:1.5px solid var(--box-line);}
.btn-ghost:hover{border-color:var(--berry);color:var(--berry);background:rgba(184,53,95,0.05);}
.btn-danger{background:var(--muted-red);color:#fff;box-shadow:0 4px 12px rgba(166,75,75,0.28);}
.btn-danger:hover{background:#8a3d3d;box-shadow:0 6px 16px rgba(166,75,75,0.34);}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:8px;}
.btn-block{width:100%;margin-top:10px;}

.divider{border:none;border-top:1px solid var(--line);margin:18px 0;}

/* form */
.field{margin-bottom:12px;}
.field label{
  display:block;font-size:11.5px;font-weight:600;color:var(--choc-soft);
  margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em;
}
.field input,.field select,.field textarea{
  width:100%;border:1.5px solid var(--box-line);border-radius:10px;padding:9px 11px;
  font-family:'Inter',sans-serif;font-size:13.5px;background:var(--cream);color:var(--choc);
  transition:border-color .15s var(--ease), box-shadow .15s var(--ease);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--berry);box-shadow:0 0 0 3px rgba(184,53,95,0.12);}
.field textarea{min-height:56px;resize:vertical;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.row3 .field label{font-size:11px;}
.product-info-text{
  font-size:11.5px;color:var(--choc-soft);font-weight:400;font-style:italic;
  margin:-2px 0 5px;opacity:.85;
}
.product-icon-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px;}
.product-icon-tile{
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;
  border:1.5px solid var(--box-line);border-radius:14px;background:var(--cream);cursor:pointer;
  transition:all .15s var(--ease);
}
.product-icon-tile:hover{border-color:var(--berry);}
.product-icon-tile.active{border-color:var(--berry);background:var(--berry);}
.product-icon{font-size:26px;line-height:1;height:30px;display:flex;align-items:center;justify-content:center;}
.product-icon-label{font-size:10.5px;font-weight:600;color:var(--choc-soft);text-align:center;line-height:1.2;}
.product-icon-tile.active .product-icon-label{color:#fff;}
.checkrow{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-top:2px;}
.info-icon-wrap{position:relative;display:inline-flex;}
.info-icon-btn{
  width:18px;height:18px;border-radius:50%;border:1.5px solid var(--berry);background:var(--white);
  color:var(--berry);font-size:11px;font-weight:700;font-style:italic;font-family:Georgia,serif;
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;line-height:1;
}
.info-icon-tooltip{
  display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
  width:220px;background:var(--choc);color:#fff;font-size:12px;font-weight:400;line-height:1.5;
  padding:9px 12px;border-radius:10px;box-shadow:var(--shadow-md);z-index:20;text-align:left;
}
.info-icon-tooltip::after{
  content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:6px solid transparent;border-top-color:var(--choc);
}
.info-icon-wrap:hover .info-icon-tooltip,.info-icon-wrap.open .info-icon-tooltip{display:block;}
.checkrow input{width:auto;}

/* filter tabs */
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;position:relative;z-index:1;}
.tab{
  font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:20px;
  border:1.5px solid var(--box-line);background:var(--white);color:var(--choc-soft);
  cursor:pointer;white-space:nowrap;transition:all .15s var(--ease);
}
.tab:hover{border-color:var(--berry);color:var(--berry);}
.tab.active{background:var(--choc);color:var(--white);border-color:var(--choc);}
.searchbox{margin-left:auto;min-width:180px;}
.searchbox input{
  width:100%;border:1.5px solid var(--box-line);border-radius:20px;
  padding:7px 14px;font-size:13px;background:var(--white);transition:border-color .15s var(--ease);
}
.searchbox input:focus{outline:none;border-color:var(--berry);}

/* cards grid */
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;
  position:relative;z-index:1;
}

.ticket{
  background:var(--box);border-radius:16px;position:relative;padding:16px 16px 14px;
  border:1px solid var(--line);cursor:pointer;
  transition:box-shadow .2s var(--ease), transform .15s var(--ease);
}
.ticket:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
.ticket-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;}
.ticket-name{font-family:'Fraunces','Noto Serif',serif;font-weight:600;font-size:16.5px;line-height:1.25;}
.ticket-ordernum{
  font-family:'Inter',sans-serif;font-size:11px;font-weight:600;color:var(--choc-soft);
  margin-left:8px;vertical-align:middle;
}
.invoice-needed-badge{
  font-size:11px;font-weight:700;background:#F3D3DE;color:var(--berry-deep);border-radius:8px;
  padding:3px 7px;white-space:nowrap;flex-shrink:0;
}
.invoice-needed-badge.invoice-issued{background:#DCE9D2;color:var(--sage-deep, #5E6E42);}
.stamp{
  font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  padding:4px 10px;border-radius:20px;transform:rotate(-2deg);white-space:nowrap;flex-shrink:0;
  box-shadow:var(--shadow-xs);
}
.stamp.laukia_patvirtinimo{background:#EAD4D4;color:var(--muted-red);}
.stamp.aktyvus{background:#F3E0B5;color:#8C6415;}
.stamp.pagaminta{background:#F3D3DE;color:var(--berry-deep);}
.stamp.ivykdyta{background:#CFE0BE;color:var(--sage-deep);}

.ticket-meta{font-size:12.5px;color:var(--choc-soft);margin:2px 0;}
.ticket-unit-line{padding-left:10px;}
.ticket-ordinal{font-weight:700;color:var(--choc);margin-top:6px;}
.ticket-date-line{
  font-size:14.5px;padding-bottom:9px;margin-bottom:8px;
  border-bottom:1.5px solid var(--line);
}
.ticket-meta b{color:var(--choc);font-weight:600;}
.perf{border-top:1.5px dashed var(--box-line);margin:10px 0;}
.ticket-bottom{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;gap:8px;}
.ticket-bottom-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
.phone-text{color:var(--choc-soft);font-weight:600;white-space:nowrap;}
.price-text{font-weight:700;white-space:nowrap;}
.paid-pill{font-weight:700;font-size:11px;padding:3px 9px;border-radius:12px;white-space:nowrap;}
.paid-pill.yes{background:#DCE6CC;color:var(--sage-deep);}
.paid-pill.no{background:#F3D3DE;color:var(--berry-deep);}
.paid-toggle-btn{
  width:100%;padding:11px;border-radius:10px;border:none;cursor:pointer;
  font-weight:700;font-size:13.5px;color:#fff;transition:background .15s var(--ease);
}
.paid-toggle-btn.is-unpaid{background:var(--muted-red);}
.paid-toggle-btn.is-paid{background:var(--sage-deep);}

.empty{text-align:center;padding:60px 20px;color:var(--choc-soft);}
.empty svg{margin-bottom:10px;}
.empty-logo{width:72px;height:72px;object-fit:contain;border-radius:50%;margin-bottom:10px;opacity:.85;}
.empty h3{font-family:'Fraunces','Noto Serif',serif;font-size:19px;color:var(--choc);margin:0 0 6px;}
.empty p{font-size:13.5px;margin:0;}

/* modal */
.overlay{
  position:fixed;inset:0;background:rgba(51,38,42,0.45);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;z-index:70;padding:20px;
}
.modal{
  background:var(--white);border-radius:20px;max-width:520px;width:100%;
  max-height:88vh;overflow-y:auto;padding:26px;box-shadow:var(--shadow-lg);
}
.modal h2{font-family:'Noto Serif',serif;font-size:20px;margin:0 0 14px;}
.modal-close{
  position:absolute;top:14px;right:16px;background:none;border:none;
  font-size:20px;cursor:pointer;color:var(--choc-soft);transition:color .15s var(--ease);
}
.modal-close:hover{color:var(--berry);}
.modal-actions{display:flex;gap:8px;margin-top:16px;}

.status-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:6px;}
.confirm-order-row{
  background:#DCE6CC;border-radius:14px;padding:14px;margin-top:14px;
}
.confirm-order-btn{background:var(--sage-deep);box-shadow:0 4px 12px rgba(94,110,66,0.28);}
.confirm-order-btn:hover{background:var(--sage);}
.export-modal{max-width:480px;}
.confirm-modal{max-width:400px;}
.confirm-message{font-size:14.5px;line-height:1.5;margin:0;white-space:pre-line;}
.export-list{
  max-height:320px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:6px 10px;
}
.export-row{
  display:flex;align-items:center;gap:9px;padding:8px 4px;border-bottom:1px solid var(--line);
  font-size:13px;cursor:pointer;
}
.export-row:last-child{border-bottom:none;}
.export-row-num{font-weight:700;color:var(--berry-deep);min-width:34px;}
.export-row-name{flex:1;font-weight:600;color:var(--choc);}
.export-row-date{color:var(--choc-soft);font-size:12px;}
.export-row-status{color:var(--choc-soft);font-size:11.5px;background:var(--cream);border-radius:8px;padding:2px 7px;}
.reminders-banner{
  display:flex;flex-direction:column;gap:8px;margin-bottom:22px;
}
.reminder-item{
  display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;font-size:13.5px;font-weight:500;
}
.reminder-icon{font-size:16px;flex-shrink:0;}
.reminder-item.rem-warn{background:#FBEFD6;color:#8C6415;}
.reminder-item.rem-info{background:#E1EAD2;color:var(--sage-deep, #5E6E42);}
.reminder-item.rem-danger{background:#F3D3DE;color:var(--berry-deep, #8E2748);}
.stats-cards{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px;}
.stats-card{
  background:var(--cream, #FFF8EF);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;min-width:120px;flex:1;display:flex;flex-direction:column;gap:4px;
}
.cost-accordion{border-bottom:1px solid var(--line);}
.cost-accordion:last-child{border-bottom:none;}
.cost-accordion-head{cursor:pointer;}
.cost-components-panel{padding:0 0 12px 12px;}
.cost-components-panel .wh-stock-row{font-size:12.5px;}
.stats-card-label{font-size:11.5px;color:var(--choc-soft);text-transform:uppercase;letter-spacing:.03em;font-weight:600;}
.stats-card-value{font-size:17px;font-weight:700;color:var(--berry-deep);font-family:'Fraunces','Noto Serif',serif;}
.stats-card-value.stats-income,.stats-card-value.stats-positive{color:var(--sage-deep);}
.stats-card-value.stats-expense,.stats-card-value.stats-negative{color:var(--berry);}
.stats-chart-wrap{
  background:var(--white);border:1px solid var(--line);border-radius:12px;padding:16px;
  max-width:560px;height:260px;position:relative;
}
.year-switcher{display:flex;align-items:center;gap:8px;}
.journal-mode-switch{display:flex;gap:6px;}
.year-switcher-label{font-weight:700;color:var(--berry-deep);min-width:44px;text-align:center;font-family:'Noto Serif',serif;}
.year-switcher .btn-sm{padding:4px 10px;}
.discount-status-btn{
  background:none;border:1px dashed var(--line);border-radius:8px;cursor:pointer;
  font-size:11.5px;color:var(--choc-soft);padding:3px 8px;white-space:nowrap;
}
.discount-used-tag{font-size:11.5px;font-weight:700;background:#F3D3DE;color:var(--berry-deep);border-radius:8px;padding:3px 8px;white-space:nowrap;}
.discount-unused-tag{font-size:11.5px;font-weight:700;background:#DCE6CC;color:var(--sage-deep);border-radius:8px;padding:3px 8px;white-space:nowrap;}
.discount-users-panel{padding:0 0 10px 12px;}
.discount-users-panel .wh-stock-row{font-size:12px;}
.invoice-issued-box{
  background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:12px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;
}
.attach-add-btn{
  display:inline-block;cursor:pointer;color:var(--berry);font-size:12.5px;font-weight:600;
  border:1px dashed var(--berry);border-radius:12px;padding:1px 7px;margin-left:2px;
}
.attach-add-btn:hover{background:#FCEFF3;}
.status-btn{
  font-size:11.5px;font-weight:600;padding:8px 11px;border-radius:9px;text-align:center;
  border:1.5px solid var(--box-line);background:var(--cream);cursor:pointer;transition:all .15s var(--ease);
}
.status-btn.current{border-color:var(--choc);background:var(--choc);color:#fff;}
.quick-status-row{gap:8px;}
.quick-status-row .status-btn{font-size:13px;padding:8px 13px;}

/* view toggle */
.view-toggle{display:flex;gap:6px;margin-bottom:16px;}
.view-btn{
  font-size:13px;font-weight:600;padding:8px 16px;border-radius:10px;
  border:1.5px solid var(--box-line);background:var(--white);color:var(--choc-soft);cursor:pointer;
  transition:all .15s var(--ease);
}
.view-btn.active{background:var(--choc);color:#fff;border-color:var(--choc);}

.status-stat-cards{
  display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;
}
.status-stat-card{
  border-radius:16px;padding:18px 16px;cursor:pointer;color:#fff;
  display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow-sm);
  transition:transform .15s var(--ease),box-shadow .15s var(--ease);
}
.status-stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
.status-stat-value{font-family:'Fraunces','Noto Serif',serif;font-size:30px;font-weight:700;line-height:1;}
.status-stat-label{font-size:12.5px;font-weight:600;opacity:.92;}
@media (max-width:640px){
  .status-stat-cards{grid-template-columns:repeat(2,1fr);}
}
.cal-section{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:28px;box-shadow:var(--shadow-sm);}
.section-title{font-family:'Fraunces','Noto Serif',serif;font-size:18px;font-weight:600;margin:0 0 12px;}
/* admin sidebar layout */
.admin-shell{
  width:100%;max-width:1400px;margin:0 auto;
  display:flex;align-items:flex-start;gap:20px;
}
.admin-sidebar{
  width:250px;flex-shrink:0;
  background:var(--white);border:1px solid var(--line);border-radius:18px;
  padding:20px 14px;box-shadow:var(--shadow-sm);
  position:sticky;top:32px;
  height:calc(100vh - 64px);max-height:calc(100vh - 64px);
  display:flex;flex-direction:column;gap:16px;
  overflow-y:auto;
}
.sidebar-logo-row{display:flex;align-items:center;gap:10px;padding:0 6px;}
.sidebar-logo{width:40px;height:40px;object-fit:contain;border-radius:50%;flex-shrink:0;}
.sidebar-title{font-family:'Fraunces','Noto Serif',serif;font-weight:600;font-size:14px;color:var(--choc);line-height:1.2;}
.sidebar-logout-icon-btn{
  margin-left:auto;background:var(--cream);border:1px solid var(--line);border-radius:10px;
  font-size:15px;padding:6px 9px;cursor:pointer;line-height:1;flex-shrink:0;transition:background .15s var(--ease);
}
.sidebar-logout-icon-btn:hover{background:#F3D3DE;}
.sidebar-close-btn{display:none;margin-left:4px;background:none;border:none;font-size:22px;color:var(--choc-soft);cursor:pointer;line-height:1;}
.modal-x-close{
  position:absolute;top:16px;right:16px;background:none;border:none;font-size:24px;
  color:var(--choc-soft);cursor:pointer;line-height:1;padding:2px 6px;border-radius:8px;
  transition:background .15s var(--ease);
}
.modal-x-close:hover{background:var(--cream);}
.sidebar-nav{display:flex;flex-direction:column;gap:3px;}
.sidebar-item{
  display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:11px;
  font-size:14px;font-weight:600;color:var(--choc-soft);cursor:pointer;transition:background .15s var(--ease),color .15s var(--ease);
}
.sidebar-item:hover{background:var(--cream);}
.sidebar-item.active{background:var(--berry);color:#fff;}
.sidebar-item-icon{font-size:16px;flex-shrink:0;width:20px;text-align:center;}
.sidebar-drag-handle{
  font-size:13px;color:var(--choc-soft);opacity:0;flex-shrink:0;cursor:grab;width:12px;
  transition:opacity .15s var(--ease);
}
.sidebar-item:hover .sidebar-drag-handle{opacity:.55;}
.sidebar-item.active .sidebar-drag-handle{color:#fff;opacity:.7;}
.sidebar-item.dragging{opacity:.4;}
.sidebar-item.drag-over{box-shadow:inset 0 2px 0 var(--berry);}
.sidebar-footer{display:flex;flex-direction:column;gap:7px;border-top:1px solid var(--line);padding-top:14px;margin-top:auto;}
.sidebar-footer-btn{width:100%;justify-content:center;font-size:12.5px;}
.admin-main{flex:1;min-width:0;}
.mobile-menu-btn{
  display:none;background:var(--white);border:1px solid var(--line);border-radius:10px;
  padding:9px;color:var(--choc);cursor:pointer;margin-bottom:16px;box-shadow:var(--shadow-xs);
}
.admin-sidebar-overlay{display:none;}
@media (max-width:900px){
  .admin-shell{display:block;}
  .mobile-menu-btn{display:inline-flex;}
  .admin-sidebar{
    position:fixed;top:0;left:0;bottom:0;z-index:60;
    width:280px;height:auto;max-height:none;border-radius:0;border:none;box-shadow:var(--shadow-lg);
    transform:translateX(-100%);transition:transform .25s var(--ease);
    overflow-y:auto;
  }
  .admin-sidebar.open{transform:translateX(0);}
  .sidebar-close-btn{display:block;}
  .admin-sidebar-overlay{
    display:block;position:fixed;inset:0;background:rgba(59,42,40,0.4);z-index:55;
    opacity:0;pointer-events:none;transition:opacity .25s var(--ease);
  }
  .admin-sidebar-overlay.open{opacity:1;pointer-events:auto;}
}
.list-header{
  display:flex;align-items:center;flex-wrap:wrap;gap:14px;
  margin-bottom:18px;
}
.add-order-row{
  display:flex;justify-content:center;margin-bottom:28px;
}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-head h3{font-family:'Inter',sans-serif;font-size:19px;font-weight:700;margin:0;color:var(--choc);}
.cal-nav{display:flex;gap:6px;}
.cal-nav button{
  width:32px;height:32px;border-radius:9px;border:1.5px solid var(--box-line);
  background:var(--white);cursor:pointer;font-size:15px;color:var(--choc);transition:all .15s var(--ease);
}
.cal-nav button:hover{border-color:var(--berry);color:var(--berry);}
.cal-shrink{max-width:640px;margin:0 auto;container-type:inline-size;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:22px;}
.cal-dow{
  text-align:center;font-size:11px;font-weight:700;color:var(--choc-soft);
  text-transform:uppercase;letter-spacing:.03em;padding-bottom:4px;
}
.cal-day{
  width:100%;aspect-ratio:1/1;box-sizing:border-box;background:var(--white);border:1.5px solid var(--line);
  border-radius:22%;padding:5%;cursor:pointer;position:relative;display:flex;flex-direction:column;
  transition:border-color .15s var(--ease), background .15s var(--ease);
}
.cal-day.empty{background:transparent;border:none;cursor:default;}
.cal-day.today{border-color:var(--gold);border-width:2px;}
.cal-day-vacation{background:repeating-linear-gradient(135deg,var(--box) 0 6px,#EAD4D4 6px 12px);opacity:.75;}
.cal-day-vacation .cal-daynum{color:var(--muted-red);}
.vacation-warning{
  background:#F3D3DE;color:var(--berry-deep);border-radius:12px;padding:10px 12px;
  font-size:13px;line-height:1.5;margin:-6px 0 14px;
}
.date-suggest-btn{
  background:var(--white);border:1.5px solid var(--berry-deep);color:var(--berry-deep);
  border-radius:14px;padding:2px 9px;font-size:12.5px;font-weight:600;cursor:pointer;
  margin:0 2px;
}
.cal-day.selected{border-color:var(--berry);border-width:2px;}
.cal-day:hover:not(.empty){border-color:var(--berry);}
.cal-daynum{font-size:clamp(8px, 4.2cqw, 15px);font-weight:700;color:var(--choc);}
.cal-day.has-orders .cal-daynum{color:#fff;}
.cal-order-count{
  font-size:clamp(11px, 5.5cqw, 20px);font-weight:800;color:#fff;
  margin-top:auto;align-self:center;line-height:1;
}

.day-panel{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:18px;}
.day-panel h3{font-family:'Fraunces','Noto Serif',serif;font-size:17px;margin:0 0 12px;text-transform:capitalize;}

.raw-msg{
  background:var(--cream);border:1px solid var(--line);border-radius:10px;
  padding:10px;font-size:12.5px;color:var(--choc-soft);white-space:pre-wrap;
  max-height:100px;overflow-y:auto;margin-top:4px;
}
.loading{text-align:center;padding:40px;color:var(--choc-soft);font-size:13.5px;}
.loading-logo{width:240px;height:240px;max-width:60vw;max-height:60vw;object-fit:contain;border-radius:50%;margin-bottom:22px;animation:loading-pulse 1.6s ease-in-out infinite;}
@keyframes loading-pulse{0%,100%{opacity:1;}50%{opacity:.55;}}

/* warehouse / prices shared sections */
.wh-section{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:24px;margin-top:28px;box-shadow:var(--shadow-sm);}
.wh-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.wh-head-left{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;}
.wh-head .section-title{margin:0;}
.wh-chevron{transition:transform .15s var(--ease);color:var(--choc-soft);flex-shrink:0;}
.wh-chevron.open{transform:rotate(180deg);}
.sub-section{}
.inner-block{margin-top:16px;}
.inner-block + .inner-block{margin-top:24px;padding-top:22px;border-top:1px solid var(--line);}
.subsection-title{font-family:'Fraunces','Noto Serif',serif;font-size:16px;font-weight:600;margin:0;color:var(--choc);}
.wh-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:18px;max-width:560px;}
@media (max-width:760px){ .wh-grid{grid-template-columns:1fr;} }
.wh-col h4{font-family:'Fraunces','Noto Serif',serif;font-size:14.5px;font-weight:600;margin:0 0 10px;color:var(--choc);}
.section-h4{font-family:'Fraunces','Noto Serif',serif;font-size:14.5px;font-weight:600;margin:0 0 10px;color:var(--choc);}
.wh-add-row{display:flex;gap:6px;margin-bottom:10px;}
.wh-add-row input{
  flex:1;border:1.5px solid var(--box-line);border-radius:10px;padding:7px 10px;
  font-size:13px;background:var(--cream);color:var(--choc);transition:border-color .15s var(--ease);
}
.wh-add-row input:focus{outline:none;border-color:var(--berry);}
.wh-add-row button{border-radius:10px;padding:7px 13px;}
.chip-list{display:flex;flex-wrap:wrap;gap:6px;min-height:20px;}
.wh-empty{font-size:12px;color:var(--choc-soft);margin:0;}
.chip{
  display:inline-flex;align-items:center;gap:6px;background:var(--box);border:1px solid var(--line);
  border-radius:16px;padding:4px 6px 4px 11px;font-size:12.5px;color:var(--choc);
}
.chip-dot{width:11px;height:11px;border-radius:50%;border:1px solid rgba(0,0,0,0.15);flex-shrink:0;}
.chip-x{
  border:none;background:transparent;color:var(--choc-soft);cursor:pointer;
  font-size:14px;line-height:1;padding:2px 4px;border-radius:50%;transition:all .15s var(--ease);
}
.chip-x:hover{background:rgba(184,53,95,0.15);color:var(--berry);}
.wh-stock-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;
}
.wh-stock-row:last-child{border-bottom:none;}
.wh-stock-row input{
  width:70px;border:1.5px solid var(--box-line);border-radius:8px;padding:6px 8px;
  font-size:13px;text-align:center;background:var(--cream);color:var(--choc);
}
.wh-stock-row input:focus{outline:none;border-color:var(--berry);}
.price-input-wrap{display:flex;align-items:center;gap:5px;}
.price-input{
  width:78px;border:1.5px solid var(--box-line);border-radius:8px;padding:6px 8px;
  font-size:13px;text-align:right;background:var(--cream);color:var(--choc);
}
.price-input:focus{outline:none;border-color:var(--berry);}
.extra-row{
  border-bottom:1px solid var(--line);padding:10px 0;
}
.extra-row:last-child{border-bottom:none;}
.extra-row-top{
  display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;
}
.extra-row-name{font-size:13.5px;font-weight:600;color:var(--choc);word-break:break-word;}
.extra-row-prices{display:flex;flex-wrap:wrap;gap:14px;}
.extra-price-field{
  display:flex;align-items:center;gap:6px;font-size:12px;color:var(--choc-soft);
}
.price-eur{font-size:12.5px;color:var(--choc-soft);}

/* per-unit flavor/color pickers */
.unit-block{background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px;margin-bottom:10px;}
.product-group-label{
  font-family:'Fraunces','Noto Serif',serif;font-weight:600;font-size:13.5px;color:var(--berry-deep);
  text-transform:uppercase;letter-spacing:.04em;margin:4px 0 8px;
}
.product-divider{
  border:none;border-top:1.5px dashed var(--box-line);margin:20px 0;
}
.ticket-divider{
  border:none;border-top:1px dashed rgba(51,38,42,0.16);margin:6px 0;
}
.unit-title{font-family:'Fraunces','Noto Serif',serif;font-weight:600;font-size:13.5px;margin-bottom:8px;}
.combo-list{margin-top:10px;}
.combo-line{
  display:flex;align-items:center;gap:10px;padding:7px 2px;
  border-bottom:1px solid var(--line);font-size:13px;
}
.combo-line:last-child{border-bottom:none;}
.combo-line-label{color:var(--choc-soft);font-size:12px;min-width:64px;flex-shrink:0;}
.combo-line-text{color:var(--berry-deep);font-weight:700;flex:1;}
.chip-x-mini{
  border:none;background:transparent;color:var(--choc-soft);cursor:pointer;
  font-size:15px;line-height:1;padding:2px 6px;border-radius:50%;transition:all .15s var(--ease);
}
.chip-x-mini:hover{background:rgba(184,53,95,0.15);color:var(--berry);}
.pick-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--choc-soft);margin:6px 0 5px;}
.chip-picker{display:flex;flex-wrap:wrap;gap:6px;}
.pick-chip{
  border:1.5px solid var(--box-line);background:var(--white);color:var(--choc);
  border-radius:16px;padding:5px 12px;font-size:12.5px;cursor:pointer;transition:all .15s var(--ease);
}
.pick-chip:hover{border-color:var(--berry);}
.pick-chip.selected{background:var(--berry);border-color:var(--berry);color:#fff;}
.unit-result{margin-top:8px;font-size:12.5px;font-weight:600;color:var(--berry-deep);}
.qty-inline{width:80px;flex-shrink:0;}
.combo-hint{font-size:12px;color:var(--choc-soft);margin:4px 0 0;line-height:1.4;}
.extras-picker{margin-top:8px;display:flex;flex-direction:column;gap:2px;}
.size-toggle-row{display:flex;gap:14px;margin-bottom:2px;}
.size-toggle{
  display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:500;
  cursor:pointer;color:var(--choc);
}
.size-toggle input{width:auto;}
.extras-check-row{
  display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;
  border-bottom:1px solid var(--line);cursor:pointer;
}
.extras-check-row:last-child{border-bottom:none;}
.extras-check-row input{width:auto;flex-shrink:0;}
.extras-check-row span:first-of-type{flex:1;}
.extras-price{color:var(--berry-deep);font-weight:600;font-size:12px;white-space:nowrap;}

/* color bubbles */
.color-bubbles{display:flex;flex-wrap:wrap;gap:9px;}
.color-bubble{
  width:28px;height:28px;border-radius:50%;border:2px solid var(--box-line);
  cursor:pointer;padding:0;position:relative;flex-shrink:0;transition:border-color .15s var(--ease);
}
.color-bubble:hover{border-color:var(--choc-soft);}
.color-bubble.selected{border-color:var(--berry);box-shadow:0 0 0 2px var(--berry);}
.color-bubble.selected::after{
  content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--choc);font-size:13px;font-weight:700;text-shadow:0 0 3px rgba(255,255,255,0.9), 0 0 1px rgba(255,255,255,0.9);
}

/* quantity badges on ticket */
.qty-row{display:flex;gap:10px;margin:8px 0 2px;flex-wrap:wrap;}
.qty-badge{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--choc-soft);font-weight:600;}
.qty-badge svg{color:var(--berry);}

.price-hint-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:-6px 0 12px;font-size:12px;color:var(--choc-soft);}
.price-auto-btn{font-size:11.5px;background:none;border:none;color:var(--berry);cursor:pointer;font-weight:600;text-decoration:underline;padding:0;}

/* customer-facing order screen */
.customer-wrap{max-width:560px;}
.customer-logo-wrap{display:flex;justify-content:center;margin-bottom:24px;}
.customer-logo{width:180px;height:180px;object-fit:contain;border-radius:50%;box-shadow:var(--shadow-sm);}
.customer-form-card{
  background:var(--white);border:1px solid var(--line);border-radius:22px;
  padding:30px 26px;box-shadow:var(--shadow-md);
}
.customer-title{
  font-family:'Fraunces','Noto Serif',serif;font-weight:600;font-size:24px;margin:0 0 4px;text-align:center;
}
.customer-ordernum{
  text-align:center;font-size:13px;color:var(--choc-soft);font-weight:600;margin:0 0 20px;
}
.thank-you-banner{
  background:#DCE6CC;color:var(--sage-deep);border-radius:12px;padding:12px 14px;
  font-size:13.5px;font-weight:500;margin-bottom:18px;line-height:1.5;
}
.customer-price-row{
  text-align:center;font-size:15px;color:var(--choc);margin:18px 0 14px;
  padding:12px;background:var(--cream);border-radius:12px;
}
.customer-footer{display:flex;justify-content:center;margin-top:18px;}
.payment-reminder-modal{max-width:380px;text-align:center;}
.payment-reminder-modal h2{margin-bottom:14px;font-family:'Inter',sans-serif;font-weight:700;}
.payment-reminder-text{font-size:14px;line-height:1.6;margin:0 0 14px;color:var(--choc);}
.admin-link-btn{
  background:none;border:none;color:var(--choc-soft);font-size:12px;
  text-decoration:underline;cursor:pointer;padding:4px;
}
.login-card{max-width:360px;margin:0 auto;}

@media (max-width:480px){
  #app{padding:20px 14px 40px;}
  .customer-logo{width:130px;height:130px;}
  .customer-form-card{padding:22px 16px;}
  .customer-title{font-size:21px;}
  .row2{grid-template-columns:1fr;}

}

  window.storage = {
    async get(key, shared){
      const snap = await fsDb.collection(FS_COLLECTION).doc(key).get();
      if(!snap.exists) return null;
      const data = snap.data();
      return { key, value: data.value, shared: !!shared };
    },
    async set(key, value, shared){
      await fsDb.collection(FS_COLLECTION).doc(key).set({ value, updatedAt: Date.now() });
      return { key, value, shared: !!shared };
    },
    async delete(key, shared){
      await fsDb.collection(FS_COLLECTION).doc(key).delete();
      return { key, deleted:true, shared: !!shared };
    },
    async list(prefix, shared){
      const snap = await fsDb.collection(FS_COLLECTION).get();
      const keys = [];
      snap.forEach(d=>{ if(!prefix || d.id.startsWith(prefix)) keys.push(d.id); });
      return { keys, prefix, shared: !!shared };
    }
  };

  // ---------- migration (keeps old saved orders working with the new shape) ----------
  function migrateCakeArr(arr, legacyQty){
    const src = (arr && arr.length) ? arr : (legacyQty ? Array.from({length:legacyQty}, ()=>({})) : []);
    return src.map(unit=>{
      let combos = [];
      if(unit.combos && unit.combos.length) combos = unit.combos.filter(c=>c.flavor||c.color).map(c=>({flavor:c.flavor||'', color:c.color||''}));
      else if(unit.flavor || unit.color) combos = [{flavor:unit.flavor||'', color:unit.color||''}];
      let decorIds = [];
      if(Array.isArray(unit.decorIds)) decorIds = unit.decorIds.slice();
      else if(unit.decorId) decorIds = [unit.decorId];
      return {combos, draftFlavor:'', draftColor:'', decorEnabled: !!unit.decorEnabled, decorIds};
    });
  }
  function migrateOrder(o){
    o = Object.assign({}, o);
    const statusMap = {
      naujas:'aktyvus', patvirtintas:'aktyvus', gaminamas:'aktyvus',
      paruostas:'pagaminta', atiduotas:'ivykdyta', atsauktas:'ivykdyta'
    };
    if(statusMap[o.status]) o.status = statusMap[o.status];
    if(!STATUS_ORDER.includes(o.status)) o.status = 'aktyvus';

    o.largeCakes = migrateCakeArr(o.largeCakes, o.qtyLarge);
    o.smallCakes = migrateCakeArr(o.smallCakes, o.qtySmall);

    o.jarQtyLarge = (o.jarQtyLarge!==undefined) ? o.jarQtyLarge : (o.jarQty!==undefined ? o.jarQty : (o.qtyJars || 0));
    o.jarQtySmall = (o.jarQtySmall!==undefined) ? o.jarQtySmall : 0;
    o.jarLargeCombos = (o.jarLargeCombos && o.jarLargeCombos.length)
      ? o.jarLargeCombos.filter(c=>c.flavor||c.color).map(c=>({flavor:c.flavor||'', color:c.color||''}))
      : [];
    o.jarSmallCombos = (o.jarSmallCombos && o.jarSmallCombos.length)
      ? o.jarSmallCombos.filter(c=>c.flavor||c.color).map(c=>({flavor:c.flavor||'', color:c.color||''}))
      : [];
    delete o.jarGroups; delete o.jarQty; delete o.jarSize; delete o.jarCombos;
    delete o.jarDraftFlavor; delete o.jarDraftColor;
    delete o.jarLargeDraftQty; delete o.jarSmallDraftQty;
    o.jarLargeDraftFlavor=''; o.jarLargeDraftColor='';
    o.jarSmallDraftFlavor=''; o.jarSmallDraftColor='';

    if(o.jarLargeExtras && Array.isArray(o.jarLargeExtras.selectedIds)){
      o.jarLargeExtras = {enabled: !!o.jarLargeExtras.enabled, selectedIds: o.jarLargeExtras.selectedIds.slice()};
    } else if(o.jarExtras && Array.isArray(o.jarExtras.selectedIds)){
      // carry the old shared selection over to both sizes as a starting point
      o.jarLargeExtras = {enabled: !!o.jarExtras.enabled, selectedIds: o.jarExtras.selectedIds.slice()};
    } else {
      o.jarLargeExtras = {enabled: false, selectedIds: []};
    }
    if(o.jarSmallExtras && Array.isArray(o.jarSmallExtras.selectedIds)){
      o.jarSmallExtras = {enabled: !!o.jarSmallExtras.enabled, selectedIds: o.jarSmallExtras.selectedIds.slice()};
    } else if(o.jarExtras && Array.isArray(o.jarExtras.selectedIds)){
      o.jarSmallExtras = {enabled: !!o.jarExtras.enabled, selectedIds: o.jarExtras.selectedIds.slice()};
    } else {
      o.jarSmallExtras = {enabled: false, selectedIds: []};
    }
    delete o.jarExtras;

    o.customerPhone = o.customerPhone || '';
    o.priceManual = (o.priceManual !== undefined) ? o.priceManual : !!o.price;
    o.paid = !!o.paid;
    o.stockDeducted = !!o.stockDeducted;
    o.needsInvoice = !!o.needsInvoice;
    o.invBuyerName = o.invBuyerName || '';
    o.invBuyerCode = o.invBuyerCode || '';
    o.invBuyerVat = o.invBuyerVat || '';
    o.invBuyerAddress = o.invBuyerAddress || '';
    o.discountCode = o.discountCode || '';
    o.discountType = o.discountType || '';
    o.discountValue = o.discountValue || 0;
    return o;
  }

  async function loadBlobSettings(isCustomerMode){
    try{
      const wres = await window.storage.get('warehouse', true);
      if(wres && wres.value){
        const p = JSON.parse(wres.value);
        const pkg = Object.assign({large:0,small:0,jarsLarge:0,jarsSmall:0}, p.packaging||{});
        if(pkg.jars !== undefined){
          pkg.jarsLarge = (pkg.jarsLarge||0) + pkg.jars;
          delete pkg.jars;
        }
        warehouse = {
          flavors: p.flavors || [],
          colors: p.colors || [],
          packaging: pkg
        };
      }
    }catch(e){}
    try{
      const pres = await window.storage.get('prices', true);
      if(pres && pres.value){
        prices = Object.assign({large_cake:0,small_cake:0,large_jar:0,small_jar:0,delivery_vilnius:0,delivery_bus:0,cost_large_cake:0,cost_small_cake:0,cost_large_jar:0,cost_small_jar:0}, JSON.parse(pres.value));
        delete prices.extras;
      }
    }catch(e){}
    try{
      const ccres = await window.storage.get('costComponents', true);
      if(ccres && ccres.value){
        costComponents = Object.assign({large_cake:[],small_cake:[],large_jar:[],small_jar:[]}, JSON.parse(ccres.value));
      }
    }catch(e){}
    try{
      const dcres = await window.storage.get('discountCodes', true);
      discountCodes = (dcres && dcres.value) ? JSON.parse(dcres.value) : [];
    }catch(e){ discountCodes = []; }
    try{
      const gcres = await window.storage.get('giftCoupons', true);
      giftCoupons = (gcres && gcres.value) ? JSON.parse(gcres.value) : [];
    }catch(e){ giftCoupons = []; }
    try{
      const norderres = await window.storage.get('sidebarNavOrder', true);

    try{

      extrasList = parsed.map(ex=>({
        id: ex.id,

        priceLarge: (ex.priceLarge!==undefined) ? ex.priceLarge : (ex.price||0),

    try{
      const dcres2 = await window.storage.get('decors', true);

    }catch(e){ decorsList = []; }
    try{ if(!isCustomerMode){

      if(dres && dres.value){
        const oldDeliveryList = JSON.parse(dres.value);
        if(oldDeliveryList.length){
          let vilniusId = null, busId = null;
          oldDeliveryList.forEach(d=>{
            const n = (d.name||'').toLowerCase();

  async function claimNextOrderNumber(){
    const ref = fsDb.collection('appData').doc('orderCounter');
    const next = await fsDb.runTransaction(async tx=>{
      const snap = await tx.get(ref);
      const current = (snap.exists && typeof snap.data().value === 'number') ? snap.data().value : 0;
      const n = current + 1;
      tx.set(ref, {value: n, updatedAt: Date.now()});
      return n;
    });
    orderCounterCache = next;
    return next;
  }

  // one-time migration: orders/invoices/expenses used to live as a single
  // JSON blob under appData/<key>. If the new per-document collection is
  // still empty, pull that old blob (if any) and copy each item into its
  // own document, so existing history isn't silently hidden by the switch.
  async function migrateBlobToCollectionIfEmpty(blobKey, collectionName, snap){
    if(!snap.empty) return null;
    try{
      const blobRes = await window.storage.get(blobKey, true);
      const items = (blobRes && blobRes.value) ? JSON.parse(blobRes.value) : [];
      if(!Array.isArray(items) || !items.length) return null;
      for(let i=0; i<items.length; i+=450){
        const chunk = items.slice(i, i+450);
        const batch = fsDb.batch();
        chunk.forEach(item=>{
          if(!item.id) item.id = uid();
          batch.set(fsDb.collection(collectionName).doc(item.id), item);
        });
        await batch.commit();
      }
      // Clear the old blob now that everything has been copied into the new
      // per-document collection — otherwise, if the collection is ever emptied
      // again later (e.g. the user deletes every item), this function would see
      // an "empty" collection and re-import the stale blob, resurrecting
      // records the user had deliberately deleted.
      try{ await window.storage.set(blobKey, JSON.stringify([]), true); }catch(e2){}
      return items;
    }catch(e){
      console.error('Nepavyko perkelti senų duomenų: '+collectionName, e);
      return null;
    }
  }

  // Looks up a code (discount % or gift coupon) and returns its current status.
  // status: 'not_found' | 'used' | 'valid'
  function lookupDiscountCode(codeRaw){
    const code = (codeRaw||'').trim().toUpperCase();
    if(!code) return {status:'not_found'};
    const disc = discountCodes.find(d=>d.code.toUpperCase()===code);
    if(disc){
      if(!disc.multiUse && disc.usedBy && disc.usedBy.length>0) return {status:'used', kind:'discount', ref:disc};
      return {status:'valid', kind:'discount', percent:disc.percent, ref:disc};
    }
    const gift = giftCoupons.find(g=>g.code.toUpperCase()===code);
    if(gift){
      if(gift.used) return {status:'used', kind:'gift', ref:gift};
      return {status:'valid', kind:'gift', amount:gift.amount, ref:gift};
    }
    return {status:'not_found'};
  }

  function applyDiscountToPrice(basePrice, lookup){
    if(!lookup || lookup.status!=='valid') return basePrice;
    if(lookup.kind==='discount') return Math.max(0, Math.round(basePrice*(1-lookup.percent/100)*100)/100);
    if(lookup.kind==='gift') return Math.max(0, Math.round((basePrice-lookup.amount)*100)/100);
    return basePrice;
  }

  // ---------- parsing ----------
  const MONTHS = {
    'sausio':1,'vasario':2,'kovo':3,'balandžio':4,'balandzio':4,'gegužės':5,'geguzes':5,
    'birželio':6,'birzelio':6,'liepos':7,'rugpjūčio':8,'rugpjucio':8,'rugsėjo':9,'rugsejo':9,
    'spalio':10,'lapkričio':11,'lapkricio':11,'gruodžio':12,'gruodzio':12
  };
  const COLOR_ROOTS = ['rožin','rozin','balt','mėlyn','melyn','žal','zal','gelton',
    'raudon','violetin','auksin','sidabrin','juod','rud','pastelin','oranžin','oranzin',
    'rusv','alyv','turkio','purpurin','bordo','krem','perlamutrin'];
  const FILLER_WORDS = /\b(sveiki|laba diena|labas|reikia|reikėtų|reiketu|norėčiau|noreciau|norėtume|noretume|užsisakyti|uzsisakyti|užsakyti|uzsakyti|prašau|prasau|ačiū|aciu|tortas|tortą|torta|torto|tortui|man|norim|reik|galėtumėt|galetumet|galit|galėtumėte|prašyčiau|prasyciau|šiaip|siaip|labai|noriu|prašyt|spalvos|spalva|spalvų|spalvu|skonio|skoniai|skonis|skonių|skoniu|d\.)\b/g;
  const STOP_WORDS = ['pati','pats','pačiam','pacia','pačiai','asmeniškai','asmeniskai','viena','vienas','namo'];

  function classifyToken(tok){
    if(!tok) return null;
    tok = tok.trim();
    if(tok.length < 3) return null;
    if(/^\d+([.,]\d+)?$/.test(tok)) return null;
    if(/€|eur\b/.test(tok)) return null;
    if(/autobus|siunt|pristat|atvež|atvez|atsiim|pasiim|vilniu/.test(tok)) return null;
    if(STOP_WORDS.includes(tok)) return null;
    for(const root of COLOR_ROOTS){ if(tok.includes(root)) return {type:'color', value:tok}; }
    if(/^didel/.test(tok)) return {type:'size', value:'didelis'};
    if(/^maž|^maz/.test(tok)) return {type:'size', value:'mazas'};
    return {type:'flavor', value:tok};
  }

  function parseMessage(text){
    const t = text.toLowerCase();
    const result = { neededDate:'', flavor:'', colors:'', fulfillment:'', address:'', price:'', customerPhone:'' };
    let workingText = t;

    let m = t.match(/\b(\d{1,2})[.\-\/](\d{1,2})(?:[.\-\/](\d{2,4}))?\b/);
    if(m){
      const day = parseInt(m[1],10), mon = parseInt(m[2],10);
      let year = m[3] ? parseInt(m[3],10) : new Date().getFullYear();
      if(year < 100) year += 2000;
      if(day>=1&&day<=31&&mon>=1&&mon<=12){
        result.neededDate = `${year}-${String(mon).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        workingText = workingText.replace(m[0], ' ');
      }
    }
    if(!result.neededDate){
      for(const [name,num] of Object.entries(MONTHS)){
        const re1 = new RegExp('(\\d{1,2})\\s*'+name+'[a-zė]*');
        const re2 = new RegExp(name+'[a-zė]*\\s*(\\d{1,2})');
        let mm = t.match(re1) || t.match(re2);
        if(mm){
          const day = parseInt(mm[1],10);
          let year = new Date().getFullYear();
          result.neededDate = `${year}-${String(num).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
          workingText = workingText.replace(mm[0], ' ');
          break;
        }
      }
    }

    if(/autobus|siunt/.test(t)) result.fulfillment = 'autobusas';
    else if(/pristat|atvež|atvez/.test(t)) result.fulfillment = 'pristatymas';
    else if(/atsiim|pasiim/.test(t)) result.fulfillment = 'atsiemimas';

    let pm = t.match(/(\d+(?:[.,]\d{1,2})?)\s?(€|eur)/);
    if(pm){ result.price = pm[1].replace(',','.'); workingText = workingText.replace(pm[0], ' '); }

    let phoneMatch = workingText.match(/(\+370[\s\-]?\d{3}[\s\-]?\d{5}|\b8\d{8}\b|\b0?6\d{7}\b)/);
    if(phoneMatch){
      result.customerPhone = phoneMatch[0].replace(/[\s\-]/g,'');
      workingText = workingText.replace(phoneMatch[0], ' ');
    }

    workingText = workingText.replace(FILLER_WORDS, ' ');
    const segments = workingText.split(/[,;\n]/);
    const flavors = [];
    const colors = [];
    segments.forEach(seg=>{
      seg.split(/\s+ir\s+|\s+bei\s+/).forEach(rawTok=>{
        const cls = classifyToken(rawTok);
        if(!cls) return;
        if(cls.type==='color' && !colors.includes(cls.value)) colors.push(cls.value);
        else if(cls.type==='flavor' && !flavors.includes(cls.value)) flavors.push(cls.value);
      });
    });
    result.flavor = flavors.join(', ');
    result.colors = colors.join(', ');
    return result;
  }

  // ---------- price calc ----------
  function extrasSumForSize(extrasState, size, jarQty){
    if(!extrasState || !extrasState.enabled || !extrasState.selectedIds || !extrasState.selectedIds.length) return 0;
    const priceKey = size==='large' ? 'priceLarge' : 'priceSmall';
    const perJar = extrasState.selectedIds.reduce((sum,id)=>{
      const ex = extrasList.find(e=>e.id===id);
      return sum + (ex ? (ex[priceKey]||0) : 0);
    }, 0);
    return perJar * (jarQty||0);
  }
  function extrasSumFor(o){
    return extrasSumForSize(o.jarLargeExtras, 'large', o.jarQtyLarge) + extrasSumForSize(o.jarSmallExtras, 'small', o.jarQtySmall);
  }
  function deliveryPriceFor(fulfillment){
    if(fulfillment==='pristatymas') return prices.delivery_vilnius||0;
    if(fulfillment==='autobusas') return prices.delivery_bus||0;
    return 0;
  }
  function fulfillmentLabel(fulfillment){
    if(fulfillment==='atsiemimas') return 'Atsiimsiu pats (Vilnius, Viršilų g. 11)';
    if(fulfillment==='pristatymas') return 'Pristatymas Vilniuje';
    if(fulfillment==='autobusas') return 'Siuntimas autobusu';
    return null;
  }
  function decorSumFor(o){
    let sum = 0;
    [].concat(o.largeCakes||[], o.smallCakes||[]).forEach(unit=>{
      if(unit.decorEnabled && unit.decorIds && unit.decorIds.length){
        unit.decorIds.forEach(id=>{
          const d = decorsList.find(x=>x.id===id);
          if(d) sum += (d.price||0);
        });
      }
    });
    return sum;
  }
  function computeOrderPrice(o){
    const lc = (o.largeCakes||[]).length;
    const sc = (o.smallCakes||[]).length;
    const jl = o.jarQtyLarge || 0;
    const js = o.jarQtySmall || 0;
    const jarCost = jl*(prices.large_jar||0) + js*(prices.small_jar||0);
    let total = lc*(prices.large_cake||0) + sc*(prices.small_cake||0) + jarCost;
    total += extrasSumFor(o);
    total += decorSumFor(o);
    total += deliveryPriceFor(o.fulfillment);
    if(o.discountType==='percent' && o.discountValue){
      total = total*(1-o.discountValue/100);
    } else if(o.discountType==='gift' && o.discountValue){
      total = total - o.discountValue;
    }
    total = Math.max(0, total);
    return Math.round(total*100)/100;
  }
  function recomputePrice(){
    if(!modalOrder || modalOrder.priceManual) return;
    const total = computeOrderPrice(modalOrder);
    modalOrder.price = total ? String(total) : '';
  }

  // ---------- color helper ----------
  function colorNameToHex(name){
    const n = (name||'').toLowerCase();
    const map = [
      [/rožin|rozin/, '#F2A6C6'], [/raudon/, '#C0392B'], [/balt/, '#FFFFFF'],
      [/mėlyn|melyn/, '#3B6FC4'], [/žal|zal/, '#5B8C3A'], [/gelton/, '#EFC94C'],
      [/violetin/, '#8E5FBF'], [/auksin/, '#C9932E'], [/sidabrin/, '#B9BEC4'],
      [/juod/, '#2B2320'], [/rud/, '#7A5230'], [/pastelin/, '#F4E3E8'],
      [/oranžin|oranzin/, '#E8823A'], [/rusv/, '#8A6E4B'], [/alyv/, '#7C8F5A'],
      [/turkio/, '#3FB6A8'], [/purpurin/, '#9B2D6E'], [/bordo/, '#6E1F32'],
      [/krem/, '#F6E9D3'], [/perlamutrin/, '#EDEDF2'],
    ];
    for(const [re,hex] of map){ if(re.test(n)) return hex; }
    let hash=0; for(let i=0;i<n.length;i++) hash = n.charCodeAt(i) + ((hash<<5)-hash);
    return `hsl(${Math.abs(hash)%360},55%,65%)`;
  }

  function calendarView(){
    const first = new Date(calYear, calMonth, 1);
    const startOffset = (first.getDay() + 6) % 7;
    const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
    const todayStr = fmtISO(new Date());

    const byDate = {};
    orders.forEach(o=>{
      if(!o.neededDate) return;
      (byDate[o.neededDate] = byDate[o.neededDate] || []).push(o);
    });

    const CAL_DAY_STATUS_COLOR = {
      laukia_patvirtinimo: 'var(--muted-red)',
      aktyvus: 'var(--gold)',
      pagaminta: 'var(--berry)',
      ivykdyta: 'var(--sage-deep)',
    };
    const CAL_DAY_STATUS_PRIORITY = ['laukia_patvirtinimo', 'aktyvus', 'pagaminta', 'ivykdyta'];

    let cells = '';
    for(let i=0;i<startOffset;i++) cells += `<div class="cal-day empty"></div>`;
    for(let d=1; d<=daysInMonth; d++){
      const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const dayOrders = byDate[dateStr] || [];
      const dominantStatus = CAL_DAY_STATUS_PRIORITY.find(s=>dayOrders.some(o=>o.status===s));
      const cellColor = dominantStatus ? CAL_DAY_STATUS_COLOR[dominantStatus] : '';
      const countBadge = dayOrders.length>1 ? `<span class="cal-order-count">${dayOrders.length}</span>` : '';
      const onVacation = !!vacationRangeFor(dateStr);
      cells += `<div class="cal-day ${dateStr===todayStr?'today':''} ${dateStr===selectedDate?'selected':''} ${onVacation?'cal-day-vacation':''} ${dominantStatus?'has-orders':''}" data-date="${dateStr}" ${cellColor?`style="background:${cellColor};"`:''}>
        <span class="cal-daynum">${d}</span>
        ${countBadge}
      </div>`;
    }

    const selectedOrders = selectedDate ? (byDate[selectedDate]||[]) : [];
    const selectedVacation = selectedDate ? vacationRangeFor(selectedDate) : null;

    return `
      <div class="cal-shrink">
        <div class="cal-head">
          <h3>${capitalizeFirst(MONTH_NAMES[calMonth])} ${calYear}</h3>
          <div class="cal-nav"><button id="calPrev">‹</button><button id="calNext">›</button></div>
        </div>
        <div class="cal-grid">
          ${DOW_NAMES.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
          ${cells}
        </div>
      </div>
      ${selectedDate ? `
      <div class="day-panel">
        <h3>${formatDateLong(selectedDate)}</h3>
        ${selectedVacation ? `<p class="vacation-warning" style="margin-bottom:10px;">🌴 Atostogaujama nuo ${formatDate(selectedVacation.start)} iki ${formatDate(selectedVacation.end)} — šią dieną užsakymų nepriimame.</p>` : ''}
        ${selectedOrders.length===0 ? `<p style="color:var(--choc-soft);font-size:13.5px;margin:0;">Šiai dienai užsakymų nėra.</p>` :
          `<div class="grid">${selectedOrders.map(ticketCard).join('')}</div>`}
      </div>` : ''}
    `;
  }

  function fmtISO(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
  function dateFromISO(iso){ const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); }
  function addDaysISO(iso, days){ const d = dateFromISO(iso); d.setDate(d.getDate()+days); return fmtISO(d); }
  function vacationRangeFor(iso){
    if(!iso) return null;
    return vacations.find(v => iso >= v.start && iso <= v.end) || null;
  }
  function suggestedDatesFor(range){
    return { before: addDaysISO(range.start, -1), after: addDaysISO(range.end, 1) };
  }
  function capitalizeFirst(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

  function syncSidebarHeight(){
    const sidebar = document.getElementById('adminSidebar');

    const hero = document.getElementById('calendarHeroBlock');
    if(hero){
      // measure once from the calendar view and cache it, so switching tabs never changes it again
      cachedSidebarHeight = Math.max(hero.getBoundingClientRect().height, 300);
    }
    if(cachedSidebarHeight){
      sidebar.style.height = cachedSidebarHeight + 'px';
    }
  }

  function orderProductSummaryPlain(arr, singular, plural){
    if(!arr || !arr.length) return '';
    return arr.map((unit,i)=>{
      const combos = (unit.combos||[]).filter(c=>c.flavor||c.color);
      const txt = combos.length ? combos.map(c=>`${c.color||'?'} - ${c.flavor||'?'}`).join(' | ') : 'nepasirinkta';
      const decor = decorLabelFor(unit);
      return `#${i+1}: ${txt}${decor ? ` (${decor})` : ''}`;
    }).join('; ');
  }

  function buildOrdersExportRows(list){
    return list.map(o=>{
      const jarLargeTxt = (o.jarLargeCombos||[]).filter(c=>c.flavor||c.color).map(c=>`${c.color||'?'} - ${c.flavor||'?'}`).join(' | ');
      const jarSmallTxt = (o.jarSmallCombos||[]).filter(c=>c.flavor||c.color).map(c=>`${c.color||'?'} - ${c.flavor||'?'}`).join(' | ');

  async function exportOrdersToExcel(list){
    const rows = buildOrdersExportRows(list);
    const ws = XLSX.utils.json_to_sheet(rows);
    const colCount = rows.length ? Object.keys(rows[0]).length : 0;
    const lastCol = XLSX.utils.encode_col(Math.max(0, colCount-1));
    ws['!autofilter'] = { ref: `A1:${lastCol}1` };
    ws['!freeze'] = { xSplit: "0", ySplit: "1", topLeftCell: "A2", activePane: "bottomLeft", state: "frozen" };
    ws['!cols'] = Object.keys(rows[0]||{}).map(k=>({ wch: Math.max(12, Math.min(40, k.length+4)) }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Užsakymai');

    const filename = `uzsakymai_${fmtISO(new Date())}.xlsx`;
    const wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});
    const blob = new Blob([wbout], {type:'application/octet-stream'});

    if(window.showSaveFilePicker){
      try{
        const handle = await window.showSaveFilePicker({
          suggestedName: filename,
          types: [{ description:'Excel failas', accept: {'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx']} }],
        });
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return;
      }catch(e){
        if(e && e.name === 'AbortError') return; // user cancelled the save dialog
        console.error('showSaveFilePicker nepavyko, naudoju įprastą atsisiuntimą', e);
      }
    }
    XLSX.writeFile(wb, filename);
  }

  function plainTextOrderSummary(data){
    const SEPARATOR = '－'.repeat(28);
    const blocks = [];

    if(data.largeCakes && data.largeCakes.length){
      const lines = [`Dideli tortai (${data.largeCakes.length} vnt.):`];
      data.largeCakes.forEach((unit,i)=>{
        const combos = (unit.combos||[]).filter(c=>c.flavor||c.color);
        const txt = combos.length ? combos.map(c=>`${c.color||'?'} - ${c.flavor||'?'}`).join(' | ') : 'nepasirinkta';
        lines.push(`  #${i+1}: Skonių ir spalvų deriniai: ${txt}`);
        const decorLabel = decorLabelFor(unit);
        if(decorLabel) lines.push(`    ${decorLabel}`);
      });
      blocks.push(lines.join('\n'));
    }
    if(data.smallCakes && data.smallCakes.length){
      const lines = [`Maži tortai (${data.smallCakes.length} vnt.):`];
      data.smallCakes.forEach((unit,i)=>{
        const combos = (unit.combos||[]).filter(c=>c.flavor||c.color);
        const txt = combos.length ? combos.map(c=>`${c.color||'?'} - ${c.flavor||'?'}`).join(' | ') : 'nepasirinkta';
        lines.push(`  #${i+1}: Skonių ir spalvų deriniai: ${txt}`);
        const decorLabel2 = decorLabelFor(unit);
        if(decorLabel2) lines.push(`    ${decorLabel2}`);
      });
      blocks.push(lines.join('\n'));
    }
    if(data.jarQtyLarge){
      const combos = (data.jarLargeCombos||[]).filter(c=>c.flavor||c.color);
      const lines = [`Dideli indeliai (${data.jarQtyLarge} vnt.): Skonių ir spalvų deriniai: ` + (combos.length ? combos.map(c=>`${c.color||'?'} - ${c.flavor||'?'}`).join(', ') : 'skoniai nenurodyti')];
      const extrasLine = formatExtrasLineFor(data.jarLargeExtras, 'Didelių');
      if(extrasLine) lines.push(`  ${extrasLine}`);
      blocks.push(lines.join('\n'));
    }
    if(data.jarQtySmall){
      const combos = (data.jarSmallCombos||[]).filter(c=>c.flavor||c.color);
      const lines = [`Maži indeliai (${data.jarQtySmall} vnt.): Skonių ir spalvų deriniai: ` + (combos.length ? combos.map(c=>`${c.color||'?'} - ${c.flavor||'?'}`).join(', ') : 'skoniai nenurodyti')];
      const extrasLine2 = formatExtrasLineFor(data.jarSmallExtras, 'Mažų');
      if(extrasLine2) lines.push(`  ${extrasLine2}`);
      blocks.push(lines.join('\n'));
    }
    return blocks.length ? blocks.join(`\n${SEPARATOR}\n`) : '—';
  }

  function openAttachment(dataUrl){
    try{
      const [header, b64] = dataUrl.split(',');
      const mimeMatch = header.match(/data:(.*?);base64/);
      const mime = mimeMatch ? mimeMatch[1] : 'application/octet-stream';
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
      const blob = new Blob([bytes], {type: mime});
      const blobUrl = URL.createObjectURL(blob);
      window.open(blobUrl, '_blank');
      setTimeout(()=>URL.revokeObjectURL(blobUrl), 60000);
    }catch(e){
      console.error('Nepavyko atidaryti priedo', e);
      alert('Nepavyko atidaryti prisegto failo.');
    }
  }

  function generateExpensePdf(expense){
    const isPdfAttachment = expense.attachmentDataUrl && expense.attachmentDataUrl.startsWith('data:application/pdf');
    if(isPdfAttachment){
      // already a PDF — just download it as-is, no need to regenerate
      downloadDataUrl(expense.attachmentDataUrl, `islaida_${expense.date}.pdf`);
      return;
    }

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'mm', format:'a4'});
    doc.addFileToVFS('Roboto-Regular.ttf', ROBOTO_REGULAR_B64);
    doc.addFont('Roboto-Regular.ttf', 'Roboto', 'normal');
    doc.addFileToVFS('Roboto-Bold.ttf', ROBOTO_BOLD_B64);
    doc.addFont('Roboto-Bold.ttf', 'Roboto', 'bold');
    const berry=[184,53,95], choc=[59,42,40], chocSoft=[110,90,82];
    const marginL=15, marginR=195;
    let y = 20;

    doc.setFont('Roboto','bold'); doc.setFontSize(16); doc.setTextColor(...berry);
    doc.text('Išlaidos įrašas', marginL, y);
    y += 10;
    doc.setDrawColor(...berry); doc.line(marginL, y, marginR, y);
    y += 8;

    doc.setFont('Roboto','normal'); doc.setFontSize(10.5); doc.setTextColor(...choc);
    doc.text(`Data: ${formatDate(expense.date)}`, marginL, y); y += 6;
    doc.text(`Aprašymas: ${expense.description||'—'}`, marginL, y); y += 6;
    doc.text(`Kategorija: ${expense.category||'—'}`, marginL, y); y += 6;
    doc.setFont('Roboto','bold'); doc.setTextColor(...berry);
    doc.text(`Suma: ${(expense.amount||0).toFixed(2)} €`, marginL, y);
    y += 12;

    if(expense.attachmentDataUrl && expense.attachmentDataUrl.startsWith('data:image')){
      doc.setFont('Roboto','normal'); doc.setFontSize(9.5); doc.setTextColor(...chocSoft);
      doc.text('Prisegtas dokumentas:', marginL, y);
      y += 5;
      try{
        const imgProps = doc.getImageProperties(expense.attachmentDataUrl);
        const maxW = marginR - marginL;
        const maxH = 260 - y;
        let w = maxW, h = (imgProps.height * w) / imgProps.width;
        if(h > maxH){ h = maxH; w = (imgProps.width * h) / imgProps.height; }
        doc.addImage(expense.attachmentDataUrl, 'JPEG', marginL, y, w, h);
      }catch(e){ console.error('Nepavyko įterpti nuotraukos į PDF', e); }
    }

    doc.save(`islaida_${expense.date}.pdf`);
  }

  function readFileCompressed(file){
    return new Promise((resolve, reject)=>{
      if(file.type.startsWith('image/')){
        const reader = new FileReader();
        reader.onload = (e)=>{
          const img = new Image();
          img.onload = ()=>{
            const maxDim = 1000;
            let w = img.width, h = img.height;
            if(w > maxDim || h > maxDim){
              const scale = maxDim / Math.max(w,h);
              w = Math.round(w*scale); h = Math.round(h*scale);
            }
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.72));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      } else {
        const reader = new FileReader();
        reader.onload = (e)=> resolve(e.target.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      }
    });
  }

  function computeReminders(){
    const todayStr = fmtISO(new Date());
    const tomorrowStr = fmtISO(new Date(Date.now() + 24*60*60*1000));
    const activeOrders = orders.filter(o=>o.status!=='ivykdyta');

    const tomorrowProduction = activeOrders.filter(o=>o.neededDate===tomorrowStr && o.status!=='pagaminta');
    const todayPickup = activeOrders.filter(o=>o.neededDate===todayStr);
    const unpaid = activeOrders.filter(o=>!o.paid && o.neededDate && o.neededDate<=tomorrowStr);

    return { tomorrowProduction, todayPickup, unpaid };
  }

  function reminderBannerHtml(){
    const r = computeReminders();
    const items = [];
    r.tomorrowProduction.forEach(o=>items.push({icon:'🎂', text:`Rytoj reikia pagaminti: ${escapeHtml(o.customerName||'Be vardo')} (Nr. ${o.orderNumber||'—'})`, cls:'rem-warn'}));

    if(!items.length) return '';
    return `<div class="reminders-banner">
      ${items.map(it=>`<div class="reminder-item ${it.cls}"><span class="reminder-icon">${it.icon}</span><span>${it.text}</span></div>`).join('')}
    </div>`;
  }

  function computeProductStats(datePrefix){
    const productCounts = { 'Didelis tortas':0, 'Mažas tortas':0, 'Didelis indelis':0, 'Mažas indelis':0 };
    orders.forEach(o=>{
      if(!o.neededDate || !o.neededDate.startsWith(datePrefix)) return;
      productCounts['Didelis tortas'] += (o.largeCakes||[]).length;
      productCounts['Mažas tortas'] += (o.smallCakes||[]).length;
      productCounts['Didelis indelis'] += (o.jarQtyLarge||0);
      productCounts['Mažas indelis'] += (o.jarQtySmall||0);
    });
    return Object.entries(productCounts).sort((a,b)=>b[1]-a[1]);
  }

  function computeBusinessStats(year){
    year = year || new Date().getFullYear();
    const months = [];
    for(let m=0; m<12; m++){
      months.push({ key: `${year}-${String(m+1).padStart(2,'0')}`, label: `${MONTH_SHORT[m]} ${year}`, income:0, cogs:0, expenses:0, orderCount:0 });
    }
    const monthIndex = {}; months.forEach((m,i)=>monthIndex[m.key]=i);
    const yearPrefix = `${year}-`;

    function costForOrder(o){
      return (o.largeCakes||[]).length*computeProductCost('large_cake')
        + (o.smallCakes||[]).length*computeProductCost('small_cake')
        + (o.jarQtyLarge||0)*computeProductCost('large_jar')
        + (o.jarQtySmall||0)*computeProductCost('small_jar');
    }

    let totalIncome = 0, totalOrders = 0, totalCogs = 0;
    const productCounts = { 'Didelis tortas':0, 'Mažas tortas':0, 'Didelis indelis':0, 'Mažas indelis':0 };
    const flavorCounts = {};

    orders.forEach(o=>{
      if(!o.neededDate || !o.neededDate.startsWith(yearPrefix)) return;
      const key = o.neededDate.slice(0,7);
      const price = parseFloat(o.price)||0;
      const cogs = costForOrder(o);
      if(monthIndex[key]!==undefined){
        months[monthIndex[key]].income += price;
        months[monthIndex[key]].cogs += cogs;
        months[monthIndex[key]].orderCount += 1;
      }
      totalIncome += price; totalOrders += 1; totalCogs += cogs;
      productCounts['Didelis tortas'] += (o.largeCakes||[]).length;
      productCounts['Mažas tortas'] += (o.smallCakes||[]).length;
      productCounts['Didelis indelis'] += (o.jarQtyLarge||0);
      productCounts['Mažas indelis'] += (o.jarQtySmall||0);
      [].concat(o.largeCakes||[], o.smallCakes||[]).forEach(u=>{
        (u.combos||[]).forEach(c=>{ if(c.flavor){ flavorCounts[c.flavor] = (flavorCounts[c.flavor]||0)+1; } });
      });
      (o.jarLargeCombos||[]).concat(o.jarSmallCombos||[]).forEach(c=>{
        if(c.flavor){ flavorCounts[c.flavor] = (flavorCounts[c.flavor]||0)+1; }
      });
    });

    expenses.forEach(ex=>{
      if(!ex.date || !ex.date.startsWith(yearPrefix)) return;
      const key = ex.date.slice(0,7);
      if(monthIndex[key]!==undefined) months[monthIndex[key]].expenses += (ex.amount||0);
    });
    const totalExpenses = months.reduce((s,m)=>s+m.expenses, 0);

    const popularProducts = Object.entries(productCounts).sort((a,b)=>b[1]-a[1]);
    const popularFlavors = Object.entries(flavorCounts).sort((a,b)=>b[1]-a[1]).slice(0,6);

    return {
      year, months,
      totalIncome: Math.round(totalIncome*100)/100,
      totalOrders,
      avgOrder: totalOrders ? Math.round((totalIncome/totalOrders)*100)/100 : 0,
      totalCogs: Math.round(totalCogs*100)/100,
      totalExpenses: Math.round(totalExpenses*100)/100,
      netProfit: Math.round((totalIncome-totalCogs-totalExpenses)*100)/100,
      popularProducts, popularFlavors,
    };
  }

  function getJournalDateRange(){
    if(journalMode==='period'){
      return {start: reportStart || `${journalYear}-01-01`, end: reportEnd || `${journalYear}-12-31`};
    }
    if(journalMonth){
      const y = journalYear, m = parseInt(journalMonth,10);
      const lastDay = new Date(y, m, 0).getDate();
      return {start: `${y}-${journalMonth}-01`, end: `${y}-${journalMonth}-${String(lastDay).padStart(2,'0')}`};
    }
    return {start: `${journalYear}-01-01`, end: `${journalYear}-12-31`};
  }

  function computeFinancialReport(start, end){
    const incomeEntries = invoices.filter(inv=>inv.issueDate >= start && inv.issueDate <= end);
    const expenseEntries = expenses.filter(ex=>ex.date >= start && ex.date <= end);
    const totalIncome = incomeEntries.reduce((s,i)=>s+i.totalAmount, 0);
    const totalExpenses = expenseEntries.reduce((s,e)=>s+(e.amount||0), 0);
    const byCategory = {};
    expenseEntries.forEach(e=>{
      const cat = e.category || 'Be kategorijos';
      byCategory[cat] = (byCategory[cat]||0) + (e.amount||0);
    });
    return {
      start, end, incomeEntries, expenseEntries,
      totalIncome: Math.round(totalIncome*100)/100,
      totalExpenses: Math.round(totalExpenses*100)/100,
      netProfit: Math.round((totalIncome-totalExpenses)*100)/100,
      byCategory: Object.entries(byCategory).map(([name,amount])=>({name, amount: Math.round(amount*100)/100})),
    };
  }

  function buildLineItemsFromOrder(o){
    const items = [];
    (o.largeCakes||[]).forEach((unit,i)=>{
      const combos = (unit.combos||[]).filter(c=>c.flavor||c.color);
      const txt = combos.length ? combos.map(c=>`${c.color||'?'} - ${c.flavor||'?'}`).join(' | ') : '';
      items.push({description: `Didelis tortas${txt?` (${txt})`:''}`, qty:1, unitPrice: prices.large_cake||0, total: prices.large_cake||0});
      if(unit.decorEnabled && unit.decorIds && unit.decorIds.length){
        unit.decorIds.forEach(id=>{
          const d = decorsList.find(x=>x.id===id);
          if(d) items.push({description: `Dekoras: ${d.name}`, qty:1, unitPrice:d.price||0, total:d.price||0});
        });
      }
    });
    (o.smallCakes||[]).forEach((unit)=>{
      const combos = (unit.combos||[]).filter(c=>c.flavor||c.color);
      const txt = combos.length ? combos.map(c=>`${c.color||'?'} - ${c.flavor||'?'}`).join(' | ') : '';
      items.push({description: `Mažas tortas${txt?` (${txt})`:''}`, qty:1, unitPrice: prices.small_cake||0, total: prices.small_cake||0});
      if(unit.decorEnabled && unit.decorIds && unit.decorIds.length){
        unit.decorIds.forEach(id=>{
          const d = decorsList.find(x=>x.id===id);
          if(d) items.push({description: `Dekoras: ${d.name}`, qty:1, unitPrice:d.price||0, total:d.price||0});
        });
      }
    });
    if(o.jarQtyLarge){
      items.push({description:'Didelis indelis', qty:o.jarQtyLarge, unitPrice: prices.large_jar||0, total: (prices.large_jar||0)*o.jarQtyLarge});
      const el = formatExtrasLineFor(o.jarLargeExtras, '');
      if(el && o.jarLargeExtras && o.jarLargeExtras.selectedIds){
        o.jarLargeExtras.selectedIds.forEach(id=>{
          const ex = extrasList.find(e=>e.id===id);
          if(ex) items.push({description:`Priedas: ${ex.name} (dideliam indeliui)`, qty:o.jarQtyLarge, unitPrice:ex.priceLarge||0, total:(ex.priceLarge||0)*o.jarQtyLarge});
        });
      }
    }
    if(o.jarQtySmall){
      items.push({description:'Mažas indelis', qty:o.jarQtySmall, unitPrice: prices.small_jar||0, total: (prices.small_jar||0)*o.jarQtySmall});
      if(o.jarSmallExtras && o.jarSmallExtras.selectedIds){
        o.jarSmallExtras.selectedIds.forEach(id=>{
          const ex = extrasList.find(e=>e.id===id);
          if(ex) items.push({description:`Priedas: ${ex.name} (mažam indeliui)`, qty:o.jarQtySmall, unitPrice:ex.priceSmall||0, total:(ex.priceSmall||0)*o.jarQtySmall});
        });
      }
    }
    const delivPrice = deliveryPriceFor(o.fulfillment);
    if(delivPrice){
      items.push({description: fulfillmentLabel(o.fulfillment)||'Pristatymas', qty:1, unitPrice:delivPrice, total:delivPrice});
    }
    return items;
  }

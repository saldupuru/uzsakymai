  function decorLabelFor(unit){
    if(!unit.decorEnabled || !unit.decorIds || !unit.decorIds.length) return '';
    const names = unit.decorIds.map(id=>{
      const d = decorsList.find(x=>x.id===id);
      return d ? d.name : null;
    }).filter(Boolean);
    return names.length ? `Dekoras: ${names.join(', ')}` : '';
  }
  function formatUnitsBlock(arr, singular, plural, noun){
    if(!arr || !arr.length) return '';
    const n = arr.length;
    const headerText = n===1 ? `${singular} - 1 vnt.` : `${plural} - ${n} vnt.`;
    let html = `<div class="ticket-meta"><b>${escapeHtml(headerText)}</b></div>`;
    if(n===1){
      const combos = (arr[0].combos||[]).filter(c=>c.flavor||c.color);
      const txt = combos.length
        ? combos.map(c=>`${escapeHtml(c.color||'?')} - ${escapeHtml(c.flavor||'?')}`).join(' | ')
        : 'nepasirinkta';
      html += `<div class="ticket-meta ticket-unit-line">Skonių ir spalvų deriniai: ${txt}</div>`;
      const decorLabel = decorLabelFor(arr[0]);
      if(decorLabel) html += `<div class="ticket-meta ticket-unit-line">${escapeHtml(decorLabel)}</div>`;
    } else {
      arr.forEach((unit,i)=>{
        const combos = (unit.combos||[]).filter(c=>c.flavor||c.color);
        const txt = combos.length
          ? combos.map(c=>`${escapeHtml(c.color||'?')} - ${escapeHtml(c.flavor||'?')}`).join(' | ')
          : 'nepasirinkta';
        html += `<div class="ticket-meta ticket-ordinal">${ORDINALS[i]||('#'+(i+1))} ${noun}</div>`;
        html += `<div class="ticket-meta ticket-unit-line">Skonių ir spalvų deriniai: ${txt}</div>`;
        const decorLabel = decorLabelFor(unit);
        if(decorLabel) html += `<div class="ticket-meta ticket-unit-line">${escapeHtml(decorLabel)}</div>`;
      });
    }
    return html;
  }
  function formatJarSizeBlock(qty, combos, singular, plural){
    if(!qty) return '';
    const headerText = qty===1 ? `${singular} - 1 vnt.` : `${plural} - ${qty} vnt.`;
    let html = `<div class="ticket-meta"><b>${escapeHtml(headerText)}</b></div>`;
    const filtered = (combos||[]).filter(c=>c.flavor||c.color);
    if(filtered.length){
      html += `<div class="ticket-meta ticket-unit-line">Skonių ir spalvų deriniai: ${filtered.map(c=>`${escapeHtml(c.color||'?')} - ${escapeHtml(c.flavor||'?')}`).join(', ')}</div>`;
    }
    return html;
  }
  function formatExtrasLineFor(extrasState, label){
    if(!extrasState || !extrasState.enabled || !extrasState.selectedIds || !extrasState.selectedIds.length) return '';
    const names = extrasState.selectedIds.map(id=>{
      const ex = extrasList.find(e=>e.id===id);
      return ex ? ex.name : null;
    }).filter(Boolean);
    if(!names.length) return '';
    return `${label} indelių priedai: ${names.join(', ')}`;
  }

  function quickStatusModalHtml(o){
    const pending = quickStatusPending || {status:o.status, paid:!!o.paid};
    return `<div class="overlay" id="quickStatusOverlay">
      <div class="modal" style="max-width:440px;position:relative;">
        <button type="button" class="modal-x-close" id="closeQuickStatusModal">×</button>
        <h2>Keisti užsakymo būseną</h2>
        <p class="combo-hint" style="margin-bottom:10px;">${escapeHtml(o.customerName||'Be vardo')}${o.orderNumber ? ` — Nr. ${o.orderNumber}` : ''}</p>
        <div class="status-row quick-status-row">
          ${STATUS_ORDER.map(s=>`<div class="status-btn ${pending.status===s?'current':''}" data-quick-status="${s}">${STATUS_LABELS_SHORT[s]}</div>`).join('')}
        </div>
        <button type="button" class="paid-toggle-btn ${pending.paid?'is-paid':'is-unpaid'}" id="quickPaidToggleBtn" style="margin-top:16px;">${pending.paid?'✓ Apmokėta':'Neapmokėta'}</button>
        ${o.status==='laukia_patvirtinimo' ? `<button type="button" class="btn btn-primary btn-block confirm-order-btn" id="quickConfirmOrderBtn" style="margin-top:16px;">✓ Patvirtinti užsakymą</button>` : ''}
        <button type="button" class="btn btn-ghost btn-block" id="editFullOrderBtn" style="margin-top:20px;">⚙️ Redaguoti užsakymą</button>
        <button type="button" class="btn btn-ghost btn-block" id="quickDeleteOrderBtn" style="margin-top:8px;color:var(--muted-red);">🗑️ Ištrinti</button>
        <button type="button" class="btn btn-primary btn-block" id="saveQuickStatusBtn" style="margin-top:16px;">Išsaugoti</button>
      </div>
    </div>`;
  }

  function ticketCard(o){
    const dateStr = o.neededDate ? formatDate(o.neededDate) : 'Data nenurodyta';
    const largeBlock = formatUnitsBlock(o.largeCakes, 'Didelis tortas', 'Dideli tortai', 'tortas');
    const smallBlock = formatUnitsBlock(o.smallCakes, 'Mažas tortas', 'Maži tortai', 'tortas');
    const jarLargeBlock = formatJarSizeBlock(o.jarQtyLarge, o.jarLargeCombos, 'Didelis indelis', 'Dideli indeliai');
    const jarSmallBlock = formatJarSizeBlock(o.jarQtySmall, o.jarSmallCombos, 'Mažas indelis', 'Maži indeliai');

    const qtyBadges = [];
    if(o.largeCakes && o.largeCakes.length) qtyBadges.push(`<span class="qty-badge">${iconLargeCake()}${o.largeCakes.length}</span>`);
    if(o.smallCakes && o.smallCakes.length) qtyBadges.push(`<span class="qty-badge">${iconSmallCake()}${o.smallCakes.length}</span>`);
    if(o.jarQtyLarge) qtyBadges.push(`<span class="qty-badge">${iconLargeJar()}${o.jarQtyLarge}</span>`);
    if(o.jarQtySmall) qtyBadges.push(`<span class="qty-badge">${iconSmallJar()}${o.jarQtySmall}</span>`);

    const jarLargeExtrasLine = formatExtrasLineFor(o.jarLargeExtras,'Didelių');
    const jarSmallExtrasLine = formatExtrasLineFor(o.jarSmallExtras,'Mažų');
    const metaGroups = [];
    if(largeBlock) metaGroups.push(largeBlock);
    if(smallBlock) metaGroups.push(smallBlock);
    if(jarLargeBlock || jarLargeExtrasLine){
      metaGroups.push(
        jarLargeBlock +
        (jarLargeExtrasLine ? `<div class="ticket-meta">${jarLargeExtrasLine}</div>` : '')
      );
    }
    if(jarSmallBlock || jarSmallExtrasLine){
      metaGroups.push(
        jarSmallBlock +
        (jarSmallExtrasLine ? `<div class="ticket-meta">${jarSmallExtrasLine}</div>` : '')
      );
    }
    metaGroups.push(`<div class="ticket-meta"><b>Pristatymo būdas</b></div><div class="ticket-meta ticket-unit-line">${fulfillmentLabel(o.fulfillment) || 'Būdas nenurodytas'}</div>`);

    return `<div class="ticket" data-id="${o.id}">
      <div class="ticket-top">
        <div class="ticket-name">${escapeHtml(o.customerName || 'Be vardo')}${o.orderNumber ? `<span class="ticket-ordernum">Nr. ${o.orderNumber}</span>` : ''}</div>
        <div style="display:flex;align-items:center;gap:6px;">
          ${o.needsInvoice ? (
            invoices.find(inv=>inv.orderId===o.id)
              ? `<span class="invoice-needed-badge invoice-issued" title="Sąskaita faktūra išrašyta">🧾 SF</span>`
              : `<span class="invoice-needed-badge" title="Reikalinga sąskaita faktūra">🧾 SF</span>`
          ) : ''}
          <div class="stamp ${o.status}">${STATUS_LABELS_SHORT[o.status]}</div>
        </div>
      </div>
      <div class="ticket-meta ticket-date-line"><b>${dateStr}</b></div>
      ${metaGroups.join('<hr class="ticket-divider">')}
      ${qtyBadges.length ? `<hr class="ticket-divider"><div class="qty-row">${qtyBadges.join('')}</div>` : ''}
      <div class="perf"></div>
      <div class="ticket-bottom">
        <span class="paid-pill ${o.paid?'yes':'no'}">${o.paid ? 'Apmokėta' : 'Neapmokėta'}</span>
        <span class="ticket-bottom-right">
          ${o.customerPhone ? `<span class="phone-text">${iconPhone()}${escapeHtml(o.customerPhone)}</span>` : ''}
          <span class="price-text">${o.price ? o.price+' €' : ''}</span>
        </span>
      </div>
    </div>`;
  }

  function draftFlavorPicker(group, unitIdx, selected){
    if(!warehouse.flavors.length) return `<p class="combo-hint">Sandėlyje dar nėra įvestų skonių.</p>`;
    return `<div class="chip-picker" data-draft-flavor-pick data-group="${group}" data-unit="${unitIdx}">
      ${warehouse.flavors.map(f=>`<button type="button" class="pick-chip ${selected===f?'selected':''}" data-value="${escapeAttr(f)}">${escapeHtml(f)}</button>`).join('')}
    </div>`;
  }
  function draftColorPicker(group, unitIdx, selected){
    if(!warehouse.colors.length) return `<p class="combo-hint">Sandėlyje dar nėra įvestų spalvų.</p>`;
    return `<div class="color-bubbles" data-draft-color-pick data-group="${group}" data-unit="${unitIdx}">
      ${warehouse.colors.map(c=>`<button type="button" class="color-bubble ${selected===c?'selected':''}" style="background:${colorNameToHex(c)}" data-value="${escapeAttr(c)}" title="${escapeAttr(c)}"></button>`).join('')}
    </div>`;
  }
  function comboLine(c, extra, removeAttrs, idx, sizePrefix){
    return `<div class="combo-line">
      <span class="combo-line-label">Derinys ${idx+1}</span>
      <span class="combo-line-text">${sizePrefix?`${escapeHtml(sizePrefix)} · `:''}${escapeHtml(c.color||'?')} - ${escapeHtml(c.flavor||'?')}${extra?` ×${extra}`:''}</span>
      <button type="button" class="chip-x-mini" ${removeAttrs}>×</button>
    </div>`;
  }

  function cakeUnitBlock(cake, group, unitIdx, label){
    const combos = cake.combos || [];
    const max = group==='large' ? orderSettings.maxLarge : orderSettings.maxSmall;
    const maxReached = combos.length >= max;
    const decorChkId = `decorEnabled_${group}_${unitIdx}`;
    const decorIds = cake.decorIds || [];
    return `<div class="unit-block">
      <div class="unit-title">${label}</div>
      ${maxReached ? `<p class="combo-hint">Pasiektas maksimalus derinių skaičius (${max}).</p>` : `
      <div class="pick-label">Skonis</div>
      ${draftFlavorPicker(group, unitIdx, cake.draftFlavor)}
      <div class="pick-label">Spalva</div>
      ${draftColorPicker(group, unitIdx, cake.draftColor)}
      <p class="combo-hint">Pasirink skonį ir spalvą — derinys pridedamas automatiškai.</p>
      `}
      <div class="combo-list">
        ${combos.length
          ? combos.map((c,i)=>comboLine(c, null, `data-remove-combo data-group="${group}" data-unit="${unitIdx}" data-combo="${i}"`, i)).join('')
          : `<p class="combo-hint">Dar nepridėta jokio derinio.</p>`}
      </div>
      ${orderSettings.cakeDecorFeatureOn ? `
      <div class="checkrow" style="margin-top:10px;">
        <input type="checkbox" id="${decorChkId}" data-decor-enable data-group="${group}" data-unit="${unitIdx}" ${cake.decorEnabled?'checked':''}>
        <label for="${decorChkId}" style="margin:0;text-transform:none;font-weight:500;">Reikia dekoro</label>
        ${orderSettings.decorInfo ? `<span class="info-icon-wrap">
          <button type="button" class="info-icon-btn" data-info-toggle title="${escapeHtml(orderSettings.decorInfo)}">i</button>
          <span class="info-icon-tooltip">${escapeHtml(orderSettings.decorInfo)}</span>
        </span>` : ''}
      </div>
      ${cake.decorEnabled ? `<div class="extras-picker">
        ${decorsList.length ? decorsList.map(d=>`
          <label class="extras-check-row">
            <input type="checkbox" data-decor-pick="${d.id}" data-decor-pick-group="${group}" data-decor-pick-unit="${unitIdx}" ${decorIds.includes(d.id)?'checked':''}>
            <span>${escapeHtml(d.name)}</span>
            <span class="extras-price">+${(d.price||0).toFixed(2)} €</span>
          </label>`).join('') : `<p class="combo-hint">Kainų skiltyje dar nėra pridėtų dekoro variantų.</p>`}
      </div>` : ''}
      ` : ''}
    </div>`;
  }

  function jarSizeBlock(o, size){
    const qty = size==='large' ? (o.jarQtyLarge||0) : (o.jarQtySmall||0);
    if(!qty) return '';
    const combos = size==='large' ? (o.jarLargeCombos||[]) : (o.jarSmallCombos||[]);
    const draftFlavor = size==='large' ? o.jarLargeDraftFlavor : o.jarSmallDraftFlavor;
    const draftColor = size==='large' ? o.jarLargeDraftColor : o.jarSmallDraftColor;
    const maxCombos = size==='large' ? orderSettings.maxJarLarge : orderSettings.maxJarSmall;
    const capReached = combos.length >= maxCombos;
    const label = size==='large' ? 'Dideli' : 'Maži';
    const groupKey = size==='large' ? 'jarLarge' : 'jarSmall';

    const stateKey = size==='large' ? 'jarLargeExtras' : 'jarSmallExtras';
    const priceKey = size==='large' ? 'priceLarge' : 'priceSmall';
    const chkId = size==='large' ? 'f_jar_large_extras_enabled' : 'f_jar_small_extras_enabled';
    const extrasState = o[stateKey] || {enabled:false, selectedIds:[]};

    return `<div class="unit-block">
      <div class="unit-title">${label} indeliai — ${qty} vnt</div>
      ${capReached ? `<p class="combo-hint">Pasiektas maksimalus derinių skaičius (${maxCombos}).</p>` : `
      <div class="pick-label">Skonis</div>
      ${draftFlavorPicker(groupKey, 0, draftFlavor)}
      <div class="pick-label">Spalva</div>
      ${draftColorPicker(groupKey, 0, draftColor)}
      <p class="combo-hint">Pasirink skonį ir spalvą — derinys pridedamas automatiškai.</p>
      `}
      <div class="combo-list">
        ${combos.length
          ? combos.map((c,i)=>comboLine(c, null, `data-remove-jar-combo data-size="${size}" data-combo="${i}"`, i)).join('')
          : `<p class="combo-hint">Dar nepridėta jokio derinio.</p>`}
      </div>
      ${orderSettings.jarExtrasFeatureOn ? `
      <div class="checkrow" style="margin-top:10px;"><input type="checkbox" id="${chkId}" data-jar-extras-size="${size}" ${extrasState.enabled?'checked':''}><label for="${chkId}" style="margin:0;text-transform:none;font-weight:500;">Reikalingi priedai</label></div>
      ${extrasState.enabled ? `<div class="extras-picker">
        ${extrasList.length ? extrasList.map(ex=>`
          <label class="extras-check-row">
            <input type="checkbox" data-extra-pick="${ex.id}" data-extra-pick-size="${size}" ${extrasState.selectedIds.includes(ex.id)?'checked':''}>
            <span>${escapeHtml(ex.name)}</span>
            <span class="extras-price">+${(ex[priceKey]||0).toFixed(2)} €/indeliui</span>
          </label>`).join('') : `<p class="combo-hint">Kainų skiltyje dar nėra pridėtų priedų.</p>`}
      </div>` : ''}
      ` : ''}
    </div>`;
  }

  function customerScreenHtml(){
    const o = modalOrder || emptyOrderTemplate(nextOrderNumber());
    const largeCakes = o.largeCakes || [];
    const smallCakes = o.smallCakes || [];

    const discountLookup = o.hasDiscountCode ? lookupDiscountCode(o.discountCodeInput) : null;
    const autoPrice = applyDiscountToPrice(basePrice, discountLookup);

    const groups = [];
    if(largeCakes.length) groups.push(`<div class="product-group-label">Didelis tortas</div>` + largeCakes.map((c,i)=>cakeUnitBlock(c,'large',i,`Didelis tortas #${i+1}`)).join(''));
    if(smallCakes.length) groups.push(`<div class="product-group-label">Mažas tortas</div>` + smallCakes.map((c,i)=>cakeUnitBlock(c,'small',i,`Mažas tortas #${i+1}`)).join(''));

    if(o.jarQtySmall>0) groups.push(`<div class="product-group-label">Maži indeliai</div>` + jarSizeBlock(o,'small'));

        <div class="field"><label>Data, kada reikalingas užsakymas</label><input type="date" id="f_date" value="${o.neededDate||''}"></div>
        ${(()=>{

          const s = suggestedDatesFor(range);
          return `<p class="vacation-warning">Šiuo metu atostogaujame nuo ${formatDate(range.start)} iki ${formatDate(range.end)} — tomis dienomis užsakymų nepriimame. Artimiausios galimos datos:

            <button type="button" class="date-suggest-btn" data-suggest-date="${s.after}">${formatDate(s.after)}</button>.</p>`;

        <div class="field">

            </div>
            <div class="product-icon-tile ${(customerProductToggles.small_jar||o.jarQtySmall>0)?'active':''}" data-product-toggle="small_jar">
              <span class="product-icon">${JAR_ICON_SVG_OLD}</span>

  function invoiceSectionForOrder(o){
    const existing = invoices.find(inv=>inv.orderId===o.id);
    if(existing){
      return `<div class="field" style="margin-top:14px;">
        <div class="invoice-issued-box">
          <span>Išrašyta sąskaita SF Nr. <b>${existing.invoiceNumber}</b> (${formatDate(existing.issueDate)}), suma <b>${existing.totalAmount.toFixed(2)} €</b></span>

    const expanded = !!modalOrder.needsInvoice;
    return `<div class="field" style="margin-top:14px;">
      <div class="checkrow"><input type="checkbox" id="invFormToggle" ${expanded?'checked':''}><label for="invFormToggle" style="margin:0;text-transform:none;font-weight:600;font-size:13px;color:var(--choc);">Sąskaita faktūra</label></div>

      <p class="combo-hint" style="margin:8px 0;">Įrašyk pirkėjo rekvizitus. Šie duomenys bus išsaugoti kartu su užsakymu, o sąskaitą faktūrą gali išrašyti bet kada.</p>
      <div class="field"><input type="text" id="invBuyerName" placeholder="Pirkėjo vardas, pavardė / įmonės pavadinimas" value="${escapeAttr(modalOrder.invBuyerName||'')}"></div>
      <div class="row2">
        <div class="field"><input type="text" id="invBuyerCode" placeholder="Įmonės / asmens kodas (nebūtina)" value="${escapeAttr(modalOrder.invBuyerCode||'')}"></div>
        <div class="field"><input type="text" id="invBuyerVat" placeholder="PVM kodas (nebūtina)" value="${escapeAttr(modalOrder.invBuyerVat||'')}"></div>
      </div>
      <div class="field"><input type="text" id="invBuyerAddress" placeholder="Adresas (nebūtina)" value="${escapeAttr(modalOrder.invBuyerAddress||'')}"></div>
      ${o.id ? `<button type="button" class="btn btn-primary btn-sm" id="issueInvoiceBtn">Išrašyti sąskaitą faktūrą</button>` : `<p class="combo-hint">Pirmiausia išsaugok užsakymą — tada galėsi išrašyti sąskaitą faktūrą.</p>`}

            ${orderSettings.deliveryVilniusEnabled ? `<option value="pristatymas" ${o.fulfillment==='pristatymas'?'selected':''}>Pristatymas Vilniuje${prices.delivery_vilnius?` (+${prices.delivery_vilnius.toFixed(2)} €)`:''}</option>` : ''}

        <div class="field"><label>Papildomos pastabos</label><textarea id="f_notes">${escapeHtml(o.notes||'')}</textarea></div>

        <div class="field"><label>Kaina (€)</label><input id="f_price" value="${escapeAttr(o.price||'')}"></div>
        <div class="price-hint-row">
          <span>Apskaičiuota automatiškai: ${autoPrice.toFixed(2)} €</span>

        <button type="button" class="paid-toggle-btn ${o.paid?'is-paid':'is-unpaid'}" id="f_paidToggleBtn" style="margin-top:4px;">${o.paid?'✓ Apmokėta':'Neapmokėta'}</button>

        ${(!isNew && o.status==='laukia_patvirtinimo') ? `

          <p class="combo-hint" style="text-align:center;margin-top:6px;">Patvirtinus, klientui automatiškai bus išsiųstas laiškas su užsakymo informacija (jei jis paliko el. paštą).</p>

        ${!isNew ? `<div class="field" style="margin-top:14px;">
          <label>Būsena</label>
          <div class="status-row">
            ${STATUS_ORDER.map(s=>`<div class="status-btn ${o.status===s?'current':''}" data-status="${s}">${STATUS_LABELS_SHORT[s]}</div>`).join('')}
          </div>
        </div>` : ''}

        ${invoiceSectionForOrder(o)}

        ${o.rawMessage ? `<div class="field"><label>Originali žinutė</label><div class="raw-msg">${escapeHtml(o.rawMessage)}</div></div>` : ''}

        <div class="modal-actions">
          <button class="btn btn-primary" id="saveOrder">Išsaugoti</button>
          ${!isNew ? `<button class="btn btn-ghost" id="deleteOrder">Ištrinti</button>` : ''}

  function attachEvents(prevId, prevCaret){
    document.querySelectorAll('[data-admin-tab]').forEach(el=>{
      el.onclick = ()=>{
        const tab = el.dataset.adminTab;
        activeAdminTab = tab;
        if(tab==='warehouse') warehouseExpanded = true;
        else if(tab==='prices') pricesExpanded = true;
        else if(tab==='vacations') vacationsExpanded = true;
        else if(tab==='accounting') invoicesExpanded = true;
        else if(tab==='stats') statsExpanded = true;
        else if(tab==='discounts') discountsExpanded = true;
        else if(tab==='settings') settingsExpanded = true;
        mobileSidebarOpen = false;
        render();
        window.scrollTo(0, 0);
      };
      el.ondragstart = (e)=>{
        dragNavKey = el.dataset.navKey;
        el.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        try{ e.dataTransfer.setData('text/plain', el.dataset.navKey); }catch(err){}
      };
      el.ondragend = ()=>{
        el.classList.remove('dragging');
        document.querySelectorAll('.sidebar-item.drag-over').forEach(x=>x.classList.remove('drag-over'));
      };
      el.ondragover = (e)=>{
        e.preventDefault();
        if(el.dataset.navKey !== dragNavKey) el.classList.add('drag-over');
      };
      el.ondragleave = ()=>{ el.classList.remove('drag-over'); };
      el.ondrop = async (e)=>{
        e.preventDefault();
        el.classList.remove('drag-over');
        const targetKey = el.dataset.navKey;
        if(!dragNavKey || dragNavKey===targetKey) return;
        const current = getOrderedNavItems().map(i=>i.key);
        const fromIdx = current.indexOf(dragNavKey);
        const toIdx = current.indexOf(targetKey);
        if(fromIdx===-1 || toIdx===-1) return;
        current.splice(fromIdx,1);
        current.splice(toIdx,0,dragNavKey);
        navOrder = current;
        dragNavKey = null;
        await saveNavOrder();
        render();
      };
    });
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    if(mobileMenuBtn) mobileMenuBtn.onclick = ()=>{ mobileSidebarOpen = true; render(); };
    const sidebarCloseBtn = document.getElementById('sidebarCloseBtn');
    if(sidebarCloseBtn) sidebarCloseBtn.onclick = ()=>{ mobileSidebarOpen = false; render(); };
    const adminSidebarOverlay = document.getElementById('adminSidebarOverlay');
    if(adminSidebarOverlay) adminSidebarOverlay.onclick = ()=>{ mobileSidebarOpen = false; render(); };
    const loginBtn = document.getElementById('loginBtn');
    if(loginBtn){
      const doLogin = async ()=>{
        const u = (document.getElementById('loginUser').value||'').trim();
        const p = (document.getElementById('loginPass').value||'');
        if(!u || !p){
          loginError = 'Įrašyk slapyvardį ir slaptažodį.';
          render();
          return;
        }
        loginBtn.disabled = true;
        loginBtn.textContent = 'Jungiamasi…';
        const loginEmail = u.includes('@') ? u.toLowerCase() : `${u.toLowerCase()}@${ADMIN_EMAIL_DOMAIN}`;
        try{
          await fbAuth.signInWithEmailAndPassword(loginEmail, p);
          loginError = '';
          // screenMode flips to 'admin' via the onAuthStateChanged listener; render() there
        }catch(e){
          console.error('Prisijungimo klaida:', e.code, e.message);
          if(e.code === 'auth/unauthorized-domain'){
            loginError = 'Šis puslapio adresas neįtrauktas į Firebase leidžiamų domenų sąrašą (Authentication → Settings → Authorized domains).';
          } else if(e.code === 'auth/user-not-found' || e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential'){
            loginError = 'Neteisingas slapyvardis arba slaptažodis.';
          } else if(e.code === 'auth/invalid-email'){
            loginError = 'Neteisingas el. pašto/slapyvardžio formatas.';
          } else if(e.code === 'auth/operation-not-allowed'){
            loginError = 'El. pašto/slaptažodžio prisijungimas neįjungtas Firebase konsolėje (Authentication → Sign-in method).';
          } else {
            loginError = 'Prisijungimo klaida: ' + (e.code || e.message || 'nežinoma klaida');
          }
          render();
        }
      };
      loginBtn.onclick = doLogin;
      const passField = document.getElementById('loginPass');
      if(passField) passField.onkeydown = (e)=>{ if(e.key==='Enter') doLogin(); };
      const userField = document.getElementById('loginUser');
      if(userField) userField.onkeydown = (e)=>{ if(e.key==='Enter') doLogin(); };
    }
    const logoutBtn = document.getElementById('logoutBtn');
    if(logoutBtn) logoutBtn.onclick = async ()=>{
      try{ await fbAuth.signOut(); }catch(e){}
      screenMode = 'login';
      render();
    };
    const openAddExpenseBtn = document.getElementById('openAddExpenseBtn');
    if(openAddExpenseBtn) openAddExpenseBtn.onclick = ()=>{
      pendingModalExpenseAttachment = null;
      addExpenseModalOpen = true;
      mobileSidebarOpen = false;
      render();
    };
    const closeAddExpenseModal = document.getElementById('closeAddExpenseModal');
    if(closeAddExpenseModal) closeAddExpenseModal.onclick = ()=>{
      addExpenseModalOpen = false;
      pendingModalExpenseAttachment = null;
      render();
    };
    const addExpenseModalOverlay = document.getElementById('addExpenseModalOverlay');
    if(addExpenseModalOverlay) addExpenseModalOverlay.onclick = (e)=>{
      if(e.target.id==='addExpenseModalOverlay'){
        addExpenseModalOpen = false;
        pendingModalExpenseAttachment = null;
        render();
      }
    };
    const handleModalExpenseFile = async (fileInput)=>{
      if(!fileInput.files || !fileInput.files[0]) return;
      const nameEl = document.getElementById('modalExpenseFileName');
      try{
        const dataUrl = await readFileCompressed(fileInput.files[0]);
        if(dataUrl.length > 700000){
          alert('Prisegtas failas per didelis, jis nebus išsaugotas. Bandyk mažesnę nuotrauką.');
          return;
        }
        pendingModalExpenseAttachment = {dataUrl, name: fileInput.files[0].name};
        if(nameEl) nameEl.textContent = `Prisegta: ${fileInput.files[0].name}`;
      }catch(e){
        console.error('Nepavyko nuskaityti failo', e);
        alert('Nepavyko nuskaityti failo.');
      }
    };
    const modalExpenseFile = document.getElementById('modalExpenseFile');
    if(modalExpenseFile) modalExpenseFile.onchange = ()=>handleModalExpenseFile(modalExpenseFile);
    const modalExpenseCamera = document.getElementById('modalExpenseCamera');
    if(modalExpenseCamera) modalExpenseCamera.onchange = ()=>handleModalExpenseFile(modalExpenseCamera);
    const modalAddExpenseBtn = document.getElementById('modalAddExpenseBtn');
    if(modalAddExpenseBtn) modalAddExpenseBtn.onclick = async ()=>{
      const dateEl2 = document.getElementById('modalExpenseDate');
      const descEl = document.getElementById('modalExpenseDescription');
      const catEl = document.getElementById('modalExpenseCategory');
      const amtEl = document.getElementById('modalExpenseAmount');
      const date = dateEl2.value;
      const description = (descEl.value||'').trim();
      const amount = Math.max(0, parseFloat((amtEl.value||'0').replace(',','.')) || 0);
      if(!date || !description || !amount){
        alert('Užpildyk datą, aprašymą ir sumą.');
        return;
      }
      modalAddExpenseBtn.disabled = true;
      modalAddExpenseBtn.textContent = 'Pridedama…';
      const newExpense = {
        id: uid(), date, description, category: catEl.value||'', amount,
        attachmentDataUrl: pendingModalExpenseAttachment ? pendingModalExpenseAttachment.dataUrl : '',
        attachmentName: pendingModalExpenseAttachment ? pendingModalExpenseAttachment.name : '',
        createdAt: new Date().toISOString(),
      };
      try{
        expenses.push(newExpense);
        await createExpenseDoc(newExpense);
        addExpenseModalOpen = false;
        pendingModalExpenseAttachment = null;
        render();
      }catch(e){
        console.error('Nepavyko pridėti išlaidos', e);
        alert('Nepavyko pridėti išlaidos.');
        modalAddExpenseBtn.disabled = false;
        modalAddExpenseBtn.textContent = '+ Pridėti išlaidą';
      }
    };
    const backToAdminBtn = document.getElementById('backToAdminBtn');
    if(backToAdminBtn) backToAdminBtn.onclick = ()=>{
      screenMode = fbAuth.currentUser ? 'admin' : 'login';
      modalOrder = null;
      render();
    };
    const saveFormUrlBtn = document.getElementById('saveFormUrlBtn');
    if(saveFormUrlBtn) saveFormUrlBtn.onclick = async ()=>{
      const el = document.getElementById('setFormUrl');
      orderSettings.formUrl = (el.value||'').trim();
      await saveOrderSettings();
      const original = saveFormUrlBtn.textContent;
      saveFormUrlBtn.textContent = 'Išsaugota ✓';
      setTimeout(()=>{ saveFormUrlBtn.textContent = original; }, 1500);
    };
    const addNotifyEmailBtn = document.getElementById('addNotifyEmailBtn');
    if(addNotifyEmailBtn) addNotifyEmailBtn.onclick = async ()=>{
      const el = document.getElementById('setNotifyEmail');
      const email = (el.value||'').trim();
      if(!email) return;
      if(!orderSettings.notifyEmails) orderSettings.notifyEmails = [];
      if(!orderSettings.notifyEmails.includes(email)) orderSettings.notifyEmails.push(email);
      await saveOrderSettings();
      render();
    };
    document.querySelectorAll('[data-notify-email-remove]').forEach(btn=>{
      btn.onclick = async ()=>{
        const email = btn.dataset.notifyEmailRemove;
        orderSettings.notifyEmails = (orderSettings.notifyEmails||[]).filter(e=>e!==email);
        await saveOrderSettings();
        render();
      };
    });
    const saveInfoTextsBtn = document.getElementById('saveInfoTextsBtn');
    if(saveInfoTextsBtn) saveInfoTextsBtn.onclick = async ()=>{
      orderSettings.infoLargeCake = (document.getElementById('setInfoLargeCake').value||'').trim();
      orderSettings.infoSmallCake = (document.getElementById('setInfoSmallCake').value||'').trim();
      orderSettings.infoLargeJar = (document.getElementById('setInfoLargeJar').value||'').trim();
      orderSettings.infoSmallJar = (document.getElementById('setInfoSmallJar').value||'').trim();
      await saveOrderSettings();
      const original = saveInfoTextsBtn.textContent;
      saveInfoTextsBtn.textContent = 'Išsaugota ✓';
      setTimeout(()=>{ saveInfoTextsBtn.textContent = original; }, 1500);
    };
    const saveDecorInfoBtn = document.getElementById('saveDecorInfoBtn');
    if(saveDecorInfoBtn) saveDecorInfoBtn.onclick = async ()=>{
      orderSettings.decorInfo = (document.getElementById('setDecorInfo').value||'').trim();
      await saveOrderSettings();
      const original = saveDecorInfoBtn.textContent;
      saveDecorInfoBtn.textContent = 'Išsaugota ✓';
      setTimeout(()=>{ saveDecorInfoBtn.textContent = original; }, 1500);
    };
    const resetOrderCounterBtn = document.getElementById('resetOrderCounterBtn');
    if(resetOrderCounterBtn) resetOrderCounterBtn.onclick = async ()=>{
      if(!(await customConfirm('Atstatyti kitą užsakymo numerį pagal esamus (neištrintus) užsakymus?'))) return;
      let max = 0;
      orders.forEach(o=>{ if(o.orderNumber && o.orderNumber > max) max = o.orderNumber; });
      try{
        await window.storage.set('orderCounter', max);
        orderCounterCache = max;
        render();
      }catch(e){
        console.error('Nepavyko atstatyti numeracijos', e);
        alert('Nepavyko atstatyti numeracijos.');
      }
    };
    const copyFormUrlBtn = document.getElementById('copyFormUrlBtn');
    if(copyFormUrlBtn) copyFormUrlBtn.onclick = async (e)=>{
      const url = orderSettings.formUrl || '';
      if(!url){
        copyFormUrlBtn.textContent = 'Adresas dar neįvestas';
        setTimeout(()=>{ copyFormUrlBtn.textContent = 'Nukopijuoti užsakymo formos adresą'; }, 1800);
        return;
      }
      let copied = false;
      try{ await navigator.clipboard.writeText(url); copied = true; }
      catch(err){
        try{
          const ta = document.createElement('textarea');
          ta.value = url; ta.style.position='fixed'; ta.style.opacity='0';
          document.body.appendChild(ta); ta.focus(); ta.select();
          document.execCommand('copy'); document.body.removeChild(ta);
          copied = true;
        }catch(err2){ copied = false; }
      }
      const original = copyFormUrlBtn.textContent;
      copyFormUrlBtn.textContent = copied ? 'Nukopijuota ✓' : 'Nepavyko nukopijuoti';
      setTimeout(()=>{ copyFormUrlBtn.textContent = original; }, 1800);
    };
    const openCustomerFormBtn = document.getElementById('openCustomerFormBtn');
    if(openCustomerFormBtn) openCustomerFormBtn.onclick = ()=>{
      modalOrder = emptyOrderTemplate(nextOrderNumber());
      screenMode = 'customer';
      render();
    };
    const manualBtn = document.getElementById('manualBtn');
    if(manualBtn) manualBtn.onclick = ()=>{
      modalOrder = emptyOrderTemplate(nextOrderNumber());
      mobileSidebarOpen = false;
      render();
    };
    document.querySelectorAll('.tab').forEach(el=>{
      el.onclick = ()=>{ activeFilter = el.dataset.filter; render(); };
    });
    document.querySelectorAll('[data-status-card]').forEach(el=>{
      el.onclick = ()=>{
        activeFilter = el.dataset.statusCard;
        render();
        setTimeout(()=>{
          const anchor = document.getElementById('orderListAnchor');
          if(anchor) anchor.scrollIntoView({behavior:'smooth', block:'start'});
        }, 30);
      };
    });
    const orderCardsPrev = document.getElementById('orderCardsPrev');
    if(orderCardsPrev) orderCardsPrev.onclick = ()=>{
      orderCardsMonth -= 1;
      if(orderCardsMonth<0){ orderCardsMonth=11; orderCardsYear -= 1; }
      render();
    };
    const orderCardsNext = document.getElementById('orderCardsNext');
    if(orderCardsNext) orderCardsNext.onclick = ()=>{
      orderCardsMonth += 1;
      if(orderCardsMonth>11){ orderCardsMonth=0; orderCardsYear += 1; }
      render();
    };
    document.querySelectorAll('.view-btn').forEach(el=>{

      const existing = modalOrder.id ? orders.find(o=>o.id===modalOrder.id) : null;
      const prevDeducted = existing ? !!existing.stockDeducted : false;

      const largeCakes = (modalOrder.largeCakes || []).slice();
      const smallCakes = (modalOrder.smallCakes || []).slice();
      const jarQtyLarge = Math.max(0, modalOrder.jarQtyLarge || 0);
      const jarQtySmall = Math.max(0, modalOrder.jarQtySmall || 0);
      const jarLargeCombos = (modalOrder.jarLargeCombos || []).slice(0, orderSettings.maxJarLarge);
      const jarSmallCombos = (modalOrder.jarSmallCombos || []).slice(0, orderSettings.maxJarSmall);
      const jarLargeExtras = modalOrder.jarLargeExtras || {enabled:false, selectedIds:[]};
      const jarSmallExtras = modalOrder.jarSmallExtras || {enabled:false, selectedIds:[]};

      const adminMinChecks = [
        [largeCakes.length, orderSettings.minLargeCake||1, 'Didelio torto'],
        [smallCakes.length, orderSettings.minSmallCake||1, 'Mažo torto'],
        [jarQtyLarge, orderSettings.minLargeJar||1, 'Didelio indelio'],
        [jarQtySmall, orderSettings.minSmallJar||1, 'Mažo indelio'],
      ];
      const belowMin = adminMinChecks.filter(([qty,min])=>qty>0 && qty<min);
      if(belowMin.length){
        const msg = belowMin.map(([qty,min,label])=>`${label} kiekis (${qty}) yra mažesnis už nustatytą minimumą (${min}).`).join('\n');
        if(!(await customConfirm(msg + '\n\nVis tiek išsaugoti šį užsakymą?'))) return;
      }

      const data = {
        customerName: (modalOrder.customerName || '').trim(),
        customerPhone: (modalOrder.customerPhone || '').trim(),
        customerEmail: (modalOrder.customerEmail || '').trim(),
        neededDate: modalOrder.neededDate || '',
        price: (modalOrder.price || '').trim(),
        priceManual: !!modalOrder.priceManual,
        largeCakes, smallCakes, jarQtyLarge, jarQtySmall, jarLargeCombos, jarSmallCombos, jarLargeExtras, jarSmallExtras,
        fulfillment: modalOrder.fulfillment || '',
        address: (modalOrder.address || '').trim(),
        notes: (modalOrder.notes || '').trim(),
        paid: !!modalOrder.paid,
        status: modalOrder.status || 'aktyvus',
        rawMessage: modalOrder.rawMessage || '',
        stockDeducted: prevDeducted,
        orderNumber: modalOrder.orderNumber || null,
        needsInvoice: !!modalOrder.needsInvoice,
        invBuyerName: (modalOrder.invBuyerName || '').trim(),
        invBuyerCode: (modalOrder.invBuyerCode || '').trim(),
        invBuyerVat: (modalOrder.invBuyerVat || '').trim(),
        invBuyerAddress: (modalOrder.invBuyerAddress || '').trim(),
        discountCode: modalOrder.discountCode || '',
        discountType: modalOrder.discountType || '',
        discountValue: modalOrder.discountValue || 0,
      };

      let warehouseChanged = false;
      if(data.status==='ivykdyta' && !prevDeducted){
        warehouse.packaging.large = Math.max(0, (warehouse.packaging.large||0) - largeCakes.length);
        warehouse.packaging.small = Math.max(0, (warehouse.packaging.small||0) - smallCakes.length);
        warehouse.packaging.jarsLarge = Math.max(0, (warehouse.packaging.jarsLarge||0) - jarQtyLarge);
        warehouse.packaging.jarsSmall = Math.max(0, (warehouse.packaging.jarsSmall||0) - jarQtySmall);
        data.stockDeducted = true;
        warehouseChanged = true;
      } else if(data.status!=='ivykdyta' && prevDeducted){
        warehouse.packaging.large = (warehouse.packaging.large||0) + (existing.largeCakes||[]).length;
        warehouse.packaging.small = (warehouse.packaging.small||0) + (existing.smallCakes||[]).length;
        warehouse.packaging.jarsLarge = (warehouse.packaging.jarsLarge||0) + (existing.jarQtyLarge||0);
        warehouse.packaging.jarsSmall = (warehouse.packaging.jarsSmall||0) + (existing.jarQtySmall||0);
        data.stockDeducted = false;
        warehouseChanged = true;
      }

      const justConfirmed = existing && existing.status === 'laukia_patvirtinimo' && data.status === 'aktyvus';

      if(modalOrder.id){
        const idx = orders.findIndex(o=>o.id===modalOrder.id);
        orders[idx] = Object.assign({}, orders[idx], data);
        await updateOrderDoc(orders[idx]);
      } else {
        data.id = uid();
        data.createdAt = new Date().toISOString();
        data.orderNumber = await claimNextOrderNumber();
        orders.push(data);
        await createOrderDoc(data);
      }
      if(warehouseChanged) await saveWarehouse();
      if(justConfirmed) sendOrderConfirmationEmail(Object.assign({}, existing, data));
      modalOrder = null;
      render();
    };

    const closePaymentReminderBtn = document.getElementById('closePaymentReminderBtn');
    if(closePaymentReminderBtn) closePaymentReminderBtn.onclick = ()=>{
      showPaymentReminder = null;
      render();
    };
    const paymentReminderOverlay = document.getElementById('paymentReminderOverlay');
    if(paymentReminderOverlay) paymentReminderOverlay.onclick = (e)=>{
      if(e.target.id==='paymentReminderOverlay'){ showPaymentReminder = null; render(); }
    };

    const submitOrderBtn = document.getElementById('submitOrderBtn');
    if(submitOrderBtn) submitOrderBtn.onclick = async ()=>{
      submitError = '';
      const requiredChecks = [
        ['f_name', modalOrder.customerName, 'Įrašyk vardą.'],
        ['f_phone', modalOrder.customerPhone, 'Įrašyk telefono numerį.'],
        ['f_email', modalOrder.customerEmail, 'Įrašyk el. pašto adresą.'],
        ['f_date', modalOrder.neededDate, 'Pasirink datą, kada reikalingas užsakymas.'],
        ['f_fulfillment', modalOrder.fulfillment, 'Pasirink pristatymo būdą.'],
      ];
      if(modalOrder.needsInvoice){
        requiredChecks.push(['f_invBuyerName', modalOrder.invBuyerName, 'Įrašyk pirkėjo vardą / pavadinimą sąskaitai faktūrai.']);
      }
      for(const [fieldId, value, msg] of requiredChecks){
        if(!value || !String(value).trim()){
          submitError = msg;
          render();
          const field = document.getElementById(fieldId);
          if(field) field.focus();
          return;
        }
      }
      let appliedDiscount = null;
      if(modalOrder.hasDiscountCode){
        const lookup = lookupDiscountCode(modalOrder.discountCodeInput);
        if(lookup.status==='not_found'){
          submitError = 'Nuolaidos kodas nerastas.';
          render();
          const field = document.getElementById('f_discountCodeInput');
          if(field) field.focus();
          return;
        }
        if(lookup.status==='used'){
          submitError = 'Nuolaida arba kuponas jau panaudotas.';
          render();
          return;
        }
        appliedDiscount = lookup;
      }
      const largeCakes = (modalOrder.largeCakes || []).slice();
      const smallCakes = (modalOrder.smallCakes || []).slice();
      const jarQtyLarge = Math.max(0, modalOrder.jarQtyLarge || 0);
      const jarQtySmall = Math.max(0, modalOrder.jarQtySmall || 0);
      const jarLargeCombos = (modalOrder.jarLargeCombos || []).slice(0, orderSettings.maxJarLarge);
      const jarSmallCombos = (modalOrder.jarSmallCombos || []).slice(0, orderSettings.maxJarSmall);
      const jarLargeExtras = modalOrder.jarLargeExtras || {enabled:false, selectedIds:[]};
      const jarSmallExtras = modalOrder.jarSmallExtras || {enabled:false, selectedIds:[]};

      const minChecks = [
        [largeCakes.length, orderSettings.minLargeCake||1, 'Didelio torto'],
        [smallCakes.length, orderSettings.minSmallCake||1, 'Mažo torto'],
        [jarQtyLarge, orderSettings.minLargeJar||1, 'Didelio indelio'],
        [jarQtySmall, orderSettings.minSmallJar||1, 'Mažo indelio'],
      ];
      for(const [qty, min, label] of minChecks){
        if(qty > 0 && qty < min){
          submitError = `${label} minimalus užsakymo kiekis yra ${min} vnt. (dabar pasirinkta ${qty}).`;
          render();
          return;
        }
      }
      const vacRange = vacationRangeFor(modalOrder.neededDate);
      if(vacRange){
        const s = suggestedDatesFor(vacRange);
        submitError = `Pasirinkta data patenka į atostogų laikotarpį (${formatDate(vacRange.start)}–${formatDate(vacRange.end)}). Pasirink kitą datą, pvz. ${formatDate(s.before)} arba ${formatDate(s.after)}.`;
        render();
        return;
      }

      const data = {
        customerName: (modalOrder.customerName || '').trim(),
        customerPhone: (modalOrder.customerPhone || '').trim(),
        customerEmail: (modalOrder.customerEmail || '').trim(),
        neededDate: modalOrder.neededDate || '',
        price: (modalOrder.price || '').trim(),
        priceManual: false,
        largeCakes, smallCakes, jarQtyLarge, jarQtySmall, jarLargeCombos, jarSmallCombos, jarLargeExtras, jarSmallExtras,
        fulfillment: modalOrder.fulfillment || '',
        address: (modalOrder.address || '').trim(),
        notes: (modalOrder.notes || '').trim(),
        paid: false,
        status: 'laukia_patvirtinimo',
        rawMessage: '',
        stockDeducted: false,
        orderNumber: null,
        id: uid(),
        createdAt: new Date().toISOString(),
        needsInvoice: !!modalOrder.needsInvoice,
        invBuyerName: (modalOrder.invBuyerName || '').trim(),
        invBuyerCode: (modalOrder.invBuyerCode || '').trim(),
        invBuyerVat: (modalOrder.invBuyerVat || '').trim(),
        invBuyerAddress: (modalOrder.invBuyerAddress || '').trim(),
        discountCode: appliedDiscount ? appliedDiscount.ref.code : '',
        discountType: appliedDiscount ? appliedDiscount.kind : '',
        discountValue: appliedDiscount ? (appliedDiscount.kind==='discount' ? appliedDiscount.percent : appliedDiscount.amount) : 0,
      };
      data.orderNumber = await claimNextOrderNumber();
      orders.push(data);
      await createOrderDoc(data);
      sendOrderNotificationEmail(data);

      if(appliedDiscount){
        const usageRecord = {customerName: data.customerName, orderNumber: data.orderNumber, usedAt: new Date().toISOString()};
        if(appliedDiscount.kind==='discount'){
          appliedDiscount.ref.usedBy = appliedDiscount.ref.usedBy || [];
          appliedDiscount.ref.usedBy.push(usageRecord);
          await saveDiscountCodes();
        } else {
          appliedDiscount.ref.used = true;
          appliedDiscount.ref.usedBy = usageRecord;
          await saveGiftCoupons();
        }
      }

      const submittedNumber = data.orderNumber;
      const submittedName = data.customerName;
      modalOrder = emptyOrderTemplate(nextOrderNumber());
      customerJustSubmitted = {orderNumber: submittedNumber, customerName: submittedName};
      showPaymentReminder = {orderNumber: submittedNumber};
      render();
    };

    const delBtn = document.getElementById('deleteOrder');
    if(delBtn) delBtn.onclick = async ()=>{
      if(!(await customConfirm('Ištrinti šį užsakymą? Šio veiksmo atšaukti negalėsi.', {danger:true}))) return;
      const existing = orders.find(o=>o.id===modalOrder.id);
      if(existing && existing.stockDeducted){
        warehouse.packaging.large = (warehouse.packaging.large||0) + (existing.largeCakes||[]).length;
        warehouse.packaging.small = (warehouse.packaging.small||0) + (existing.smallCakes||[]).length;
        warehouse.packaging.jarsLarge = (warehouse.packaging.jarsLarge||0) + (existing.jarQtyLarge||0);
        warehouse.packaging.jarsSmall = (warehouse.packaging.jarsSmall||0) + (existing.jarQtySmall||0);
        await saveWarehouse();
      }
      const deletedId = modalOrder.id;
      orders = orders.filter(o=>o.id!==deletedId);
      await deleteOrderDoc(deletedId);
      modalOrder = null;
      render();
    };

    if(prevId){
      const el = document.getElementById(prevId);
      if(el && typeof el.focus === 'function'){
        el.focus({preventScroll:true});
        if(prevCaret!==null && typeof el.setSelectionRange === 'function'){
          try{ el.setSelectionRange(prevCaret, prevCaret); }catch(e){}
        }
      }
    }
  }

  function tryCommitJarSizeCombo(size){
    const flavorKey = size==='large' ? 'jarLargeDraftFlavor' : 'jarSmallDraftFlavor';
    const colorKey = size==='large' ? 'jarLargeDraftColor' : 'jarSmallDraftColor';
    const combosKey = size==='large' ? 'jarLargeCombos' : 'jarSmallCombos';

    const flavor = modalOrder[flavorKey], color = modalOrder[colorKey];
    if(!flavor || !color) return false;

    if(!modalOrder[combosKey]) modalOrder[combosKey] = [];
    const maxCombos = size==='large' ? orderSettings.maxJarLarge : orderSettings.maxJarSmall;
    if(modalOrder[combosKey].length >= maxCombos) return false;

    modalOrder[combosKey].push({flavor, color});
    modalOrder[flavorKey] = ''; modalOrder[colorKey] = '';
    recomputePrice();
    return true;
  }

  function pickCakeDraft(group, unitIdx, field, value){
    const arr = group==='large' ? modalOrder.largeCakes : modalOrder.smallCakes;
    if(!arr || !arr[unitIdx]) return;
    const unit = arr[unitIdx];
    const max = group==='large' ? orderSettings.maxLarge : orderSettings.maxSmall;
    unit[field] = (unit[field] === value) ? '' : value;
    if(unit.draftFlavor && unit.draftColor){
      if(!unit.combos) unit.combos = [];
      if(unit.combos.length < max){
        unit.combos.push({flavor:unit.draftFlavor, color:unit.draftColor});
      }
      unit.draftFlavor = '';
      unit.draftColor = '';
      recomputePrice();
    }
    render();
  }

  function formatDate(iso){
    const [y,m,d] = iso.split('-');
    return `${y}/${m.padStart(2,'0')}/${d.padStart(2,'0')}`;
  }
  function formatDateLong(iso){
    const [y,m,d] = iso.split('-');
    return `${y}/${m.padStart(2,'0')}/${d.padStart(2,'0')}`;
  }
  function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function escapeAttr(s){ return escapeHtml(s); }

  function cakeIcon(){
    return `<svg width="46" height="46" viewBox="0 0 46 46" fill="none">
      <rect x="7" y="24" width="32" height="15" rx="3" fill="#F3E7D2" stroke="#B8355F" stroke-width="1.5"/>
      <path d="M7 27 Q13 22 19 27 T31 27 T39 27" stroke="#B8355F" stroke-width="1.5" fill="none"/>
      <rect x="10" y="16" width="26" height="8" rx="2" fill="#FFF" stroke="#B8355F" stroke-width="1.5"/>
      <line x1="23" y1="16" x2="23" y2="9" stroke="#B8355F" stroke-width="1.5"/>
      <ellipse cx="23" cy="7" rx="2" ry="3" fill="#C9932E"/>
    </svg>`;
  }
  function cakeOutline(){
    return `<svg width="56" height="56" viewBox="0 0 46 46" fill="none" style="opacity:.5">
      <rect x="7" y="24" width="32" height="15" rx="3" stroke="#B8355F" stroke-width="1.5"/>
      <rect x="10" y="16" width="26" height="8" rx="2" stroke="#B8355F" stroke-width="1.5"/>
      <line x1="23" y1="16" x2="23" y2="9" stroke="#B8355F" stroke-width="1.5"/>
    </svg>`;
  }
  function iconLargeCake(){
    return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="3" y="12" width="18" height="8" rx="1.4" stroke="currentColor" stroke-width="1.7"/><rect x="5.5" y="7" width="13" height="5" rx="1" stroke="currentColor" stroke-width="1.7"/><line x1="12" y1="7" x2="12" y2="3.3" stroke="currentColor" stroke-width="1.7"/></svg>`;
  }
  function iconSmallCake(){
    return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="6" y="11" width="12" height="9" rx="1.3" stroke="currentColor" stroke-width="1.7"/><line x1="12" y1="11" x2="12" y2="6.3" stroke="currentColor" stroke-width="1.7"/></svg>`;
  }
  function iconLargeJar(){
    return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M8.5 4.5h7v3l1.3 2.2v10a1.3 1.3 0 01-1.3 1.3H8.5a1.3 1.3 0 01-1.3-1.3v-10L8.5 7.5v-3z" stroke="currentColor" stroke-width="1.6"/><line x1="7.5" y1="10" x2="16.5" y2="10" stroke="currentColor" stroke-width="1.6"/></svg>`;
  }
  function iconSmallJar(){
    return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M9.5 6h5v2.2l1 1.7v8.6a1.1 1.1 0 01-1.1 1.1H9.6a1.1 1.1 0 01-1.1-1.1V9.9l1-1.7V6z" stroke="currentColor" stroke-width="1.6"/><line x1="8.7" y1="10.8" x2="15.3" y2="10.8" stroke="currentColor" stroke-width="1.6"/></svg>`;
  }
  function iconJar(){
    return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M8.5 4.5h7v3l1.3 2.2v10a1.3 1.3 0 01-1.3 1.3H8.5a1.3 1.3 0 01-1.3-1.3v-10L8.5 7.5v-3z" stroke="currentColor" stroke-width="1.6"/><line x1="7.5" y1="10" x2="16.5" y2="10" stroke="currentColor" stroke-width="1.6"/></svg>`;
  }
  function iconPhone(){
    return `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" style="vertical-align:-1px;margin-right:3px;"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.9 21 3 13.1 3 3.9c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z" stroke="currentColor" stroke-width="1.5"/></svg>`;
  }

  loadOrders();

  // The settings-style data below (prices, warehouse stock, vacations, discount
  // codes, etc.) lives in a simple key-value store that doesn't support Firebase's
  // real-time listeners the way the orders/invoices/expenses collections do. To
  // still keep it reasonably in sync across devices without a manual refresh,
  // poll for changes every 15 seconds while the admin screen is open — but never
  // while the person is actively typing somewhere, since re-loading the saved
  // (older) value mid-edit would otherwise overwrite what they're typing.
  setInterval(()=>{
    if(screenMode === 'admin' && !isUserTyping()){
      loadBlobSettings(false).then(render).catch(()=>{});
    }
  }, 15000);

  window.addEventListener('resize', syncSidebarHeight);

  document.addEventListener('click', (e)=>{
    if(screenMode !== 'admin' || activeAdminTab !== 'orders') return;
    if(!selectedDate && !activeFilter) return;
    const keepOpenSelectors = ['.cal-day', '.status-stat-card', '.day-panel', '#orderListAnchor', '.grid', '.overlay', '.modal', '.admin-sidebar', '.mobile-menu-btn', '.cal-nav', '.order-cards-switcher'];
    if(keepOpenSelectors.some(sel=>e.target.closest(sel))) return;
    selectedDate = null;
    activeFilter = null;
    render();
  });

  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('./sw.js').catch(()=>{});
    });
  }
})();
</script>
</body>
</html>
